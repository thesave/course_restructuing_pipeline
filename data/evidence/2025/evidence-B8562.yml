outcomes:
- id: o1
  text: 'At the end of the course, the student has an in-depth understanding of:'
- id: o2
  text: the organization of concurrent and parallel computing systems, in relation to the characteristics
    of the hardware used, with particular focus on multiprocessor architectures, multicomputers, and high-performance
    computing (HPC) systems;
- id: o3
  text: the features and internal structure of operating systems that support the execution of concurrent
    and parallel applications;
- id: o4
  text: the models and tools for process synchronization in both the shared memory model and the message-passing
    model;
- id: o5
  text: the methodologies and programming languages for designing concurrent applications;
- id: o6
  text: the methodologies and programming languages for designing parallel applications on high-performance
    computing (HPC) systems, with particular reference to the MIMD architectural model.
- id: o7
  text: In particular, the student is able to solve synchronization problems among concurrent/parallel
    activities in both the shared memory and message-passing models, develop concurrent programs using
    high-level languages based on both shared variables and message passing, develop parallel programs
    on HPC systems—especially within the MIMD architectural model—and evaluate their performance.
