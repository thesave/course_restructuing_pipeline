outcomes:
- id: o1
  text: The course presents some current technologies to develop distributed systems.
- id: o2
  text: The concept of distributed system is introduced first, then the concept of middleware technology
    as a distributed programming platform.
- id: o3
  text: The fundamental principles of distributed systems will be explained.
- id: o4
  text: This introductory material is followed by a description of the main architectures of distributed
    systems, including those for implementing and deploying service-based applications in the cloud.
- id: o5
  text: At the end of the course the students will be able to select the appropriate middleware platform
    for a given problem and to apply the main technologies presented to solve practical case studies.
- id: o6
  text: The exam will consist of 1) a midterm presentation on a research paper chosen by the student and
    2) a final project assigned by the instructor.
