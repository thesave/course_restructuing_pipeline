outcomes:
- id: o1
  text: Fundamentals of the relational database systems technology; methodologies and tools for database
    design and implementation.
contents:
- id: c1
  text: 'Main components of a RDBMS: Query Optimizer, Transaction Manager, Scheduler, Recovery Manager,
    Cache Manager, Storage Manager, Access Methods.'
- id: c2
  text: 'Data Models: conceptual vs. logical models. The relational model.'
- id: c3
  text: 'Conceptual database design: the Entity-Relationship model, introduction to requirement analysis
    and to conceptual database design.'
- id: c4
  text: 'Logical database design: workload estimation, schema restructuration, entity and associations
    translation.'
- id: c5
  text: 'Normal forms: functional dependencies, 1NF, 2NF, 3NF, BCNF.'
- id: c6
  text: 'Relational algebra: basic and derived operators.'
- id: c7
  text: 'The SQL language : DDL, DML and DCL statements.'
- id: c8
  text: 'Transactions: ACID properties, concurrency management, protocols.'
- id: c9
  text: Data Structures in secondary memory and related management algorithms (sequential and direct access
    organizations, primary and secondary indeces, B-tree, B*-tree and B+tree).
- id: c10
  text: 'Database applications: overview of data access modalities (examples in Java and .NET C#).'
- id: c11
  text: Description of the main client-server RDBMS architectures, hints on DDBMS and cloud databases.
- id: c12
  text: Brief introduction to NoSQL Systems.
