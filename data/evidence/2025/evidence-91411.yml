outcomes:
- id: o1
  text: At the end of the course, students have acquired knowledge and competencies for designing a system
    composed of one or more robots (here, we call "robot" an autonomous system which exists in the physical
    world, can sense its environment and can act on it to achieve some goals).
- id: o2
  text: In particular, students know the main models, methods, architectures and tools for programming
    robots equipped with nontrivial computational and cognitive capabilities.
contents:
- id: c1
  text: Introduction to robotics
  items:
  - id: c1.1
    text: Brief history of robotics
  - id: c1.2
    text: Notions of robot and its behavior in a physical environment
  - id: c1.3
    text: Main issues in intelligent robotic systems design
- id: c2
  text: Behavior-based robotics
  items:
  - id: c2.1
    text: Overview of main paradigms for coordinating behaviors
  - id: c2.2
    text: The Subsumption Architecture
  - id: c2.3
    text: Motor schemas
  - id: c2.4
    text: Fuzzy logic and fuzzy systems
  - id: c2.5
    text: Behavior trees
  - id: c2.6
    text: 'Experimental evaluation and parameter tuning of control software for robots: practical guidelines'
  - id: c2.7
    text: Swarm robotics
- id: c3
  text: Robot adaptation and learning
  items:
  - id: c3.1
    text: Artificial evolution and evolutionary robotics
  - id: c3.2
    text: Automatic design of robot programs
  - id: c3.3
    text: Associative learning
  - id: c3.4
    text: Reinforcement learning
  - id: c3.5
    text: Value-based learning and intrinsic motivation
- id: c4
  text: Deliberative control
  items:
  - id: c4.1
    text: Informed search algorithms. A* and its variants for path planning problems
  - id: c4.2
    text: 'Robot planning: definitions, principles, and main approaches'
  - id: c4.3
    text: Navigation problems and main solution approaches
- id: c5
  text: Lab activitiesExperiments in simulation and with physical robots (Thymio) with the aim of experiencing
    with the various kinds of control and testing the knowledge acquired.
