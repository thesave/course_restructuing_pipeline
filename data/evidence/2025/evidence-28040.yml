outcomes:
- id: o1
  text: Al termine del corso, lo studente possiede il necessario background informatico ed una appropriata
    conoscenza dei linguaggi di programmazione.
- id: o2
  text: Sa utilizzare le conoscenze acquisite per progettare autonomamente algoritmi e strutture dati.
- id: o3
  text: Sa lavorare in modo autonomo, ma anche inserirsi in un gruppo di lavoro.
contents:
- id: c1
  text: Computer science and problem solving.
- id: c2
  text: Abstract machines.
- id: c3
  text: Python machine.
- id: c4
  text: 'Programming in Python: names and visibility, functions, immutable and mutable objects, basic
    data types and their use in the solution of problems.'
- id: c5
  text: Classes and objects.
- id: c6
  text: Abstract data types as classes.
- id: c7
  text: Sorting algorithms.
- id: c8
  text: Introduction to computational complexity.
- id: c9
  text: 'Limitations of effective procedures: non decidable problems.'
- id: c10
  text: The course involves an important lab activity, where the instructors is joined by teaching assistants.
