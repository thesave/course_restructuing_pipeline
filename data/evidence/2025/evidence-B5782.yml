outcomes:
- id: o1
  text: At the end of the course, the student has the basic knowledge in design and analysis of correct
    and efficient algorithms and data structures.
- id: o2
  text: In particular, the student has basic knowledge on algorithms and data structures.
- id: o3
  text: 'The student will be able to: design correct and efficient algorithm for common computational
    tasks; analyze existing algorithms and data structures; design and analyze new algorithms and data
    structures.'
contents:
- id: c1
  text: The course is divided into two main parts, each covering essential topics in algorithms and data
    structures.
- id: c2
  text: 'Part 1: Foundations of Algorithms and Data Structures'
  heading: true
  items:
  - id: c2.1
    text: 'Introduction to Algorithmic Complexity Analysis: explore the concept of computational complexity,
      including asymptotic notation.'
  - id: c2.2
    text: 'Sorting Algorithms: dive into various sorting techniques such as insertion sort, merge sort,
      quick sort, lower bounds of comparison-based sorting. Additionally, learn about sorting in linear
      time using counting sort and radix sort.'
  - id: c2.3
    text: 'Elementary Data Structures: gain a comprehensive understanding of fundamental data structures
      like arrays, linked lists, stacks, and queues.'
  - id: c2.4
    text: 'Advanced Data Structures: delve into more complex data structures such as binary trees, trees,
      hash tables, and graphs.'
  - id: c2.5
    text: 'Algorithmic Techniques: explore essential algorithmic paradigms, including brute force, divide-and-conquer,
      dynamic programming, and greedy algorithms.'
  - id: c2.6
    text: 'Handling Hard Problems: study algorithmic approaches for challenging problems, such as approximation
      algorithms, branch-and-bound, and heuristics.'
- id: c3
  text: 'Part 2: Algorithms and Data Structures for Computational Biology'
  heading: true
  items:
  - id: c3.1
    text: 'Exact and Approximate String Matching: learn about techniques for exact string matching strings
      and approximate string matching.'
  - id: c3.2
    text: 'Sequence Alignment: dive into local and global pairwise alignments, as well as multiple sequence
      alignments.'
  - id: c3.3
    text: 'Suffix Data Structures: understand suffix trees, suffix tries, and suffix arrays, which play
      a crucial role in string processing.'
  - id: c3.4
    text: 'Burrows-Wheeler Transform: explore the Burrows-Wheeler transform, a reversible string transformation
      technique with various applications.'
  - id: c3.5
    text: 'Sequence Assembly: study overlap graphs and the greedy algorithm for solving the shortest common
      supersequence problem in sequence assembly.'
  - id: c3.6
    text: Throughout the course, algorithms will be presented using pseudocode, and practical Python implementations
      will be provided as well.
prerequisites: []
bibliography: |-
  It is fundamental to use the electronic slides and material provided during the classes, including live exercises. The slides will be made available on the course web page.

  The readings below are suggested, but need not to be necessarily purchased.

  Books more specific on computational biology topics:

  - Carlos Setubal, Joao Meidanis, Introduction to computational molecular biology, Cengage Learning eds., 1997;
  - C. Gibas, P. Jambeck, Developing Bioinformatics Computer Skills, O'Reilly media, 2001

  Books more general on computer algorithms and data structures topics:

  - Alfred V. Aho, Jeffrey D. Ullman, John E. Hopcroft. Data Structures and Algorithms. Addison Wesley, 1983.
  - Thomas H. Cormen, Charles E. Leiserson, Ronald L. Rivest, Clifford Stein. Introduction to Algorithms. McGraw-Hill, 2001.
  - Donald E. Knuth. The Art of Computer Programming, Volumes 1-3. Addison-Wesley Professional, 1998.
  - S.B. Kishor Data Structures, Edition 3. Das Ganu Prakashan, Nagpur, 2008.
