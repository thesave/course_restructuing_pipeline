outcomes:
- id: o1
  text: By the end of the course, the should - understand the fundamentals of supervised and unsupervised
    machine learning algorithms, focusing on deep learning algorithms - understand the fundamental programming
    principles of the Python language and be able to apply them primarily to data management and analysis,
    under the umbrella of data science - understand the role, purpose and features of Python libraries
    for numerical computation, data representation, and machine learning, and their interconnectivity
    with frameworks, such as Jupyter Notebook - be able to apply data science practices and methods to
    construct models and solve problems for various data-science applications.
contents:
- id: c1
  text: Module 1
  heading: true
  items:
  - id: c1.1
    text: 'The Python language: Expressions, tuples, lists, comprehensions, sets, dictionaries.'
  - id: c1.2
    text: Repetitive and branching instructions.
  - id: c1.3
    text: The NumPy and Panda packages.
  - id: c1.4
    text: 'Supervised Machine Learning: Deep Neural Networks, convolutional and recurrent networks, LSTM,
      generative models (GAN, Autoencoder, Transformer).'
  - id: c1.5
    text: 'Laboratory classes: Integrated development environments for Python'
- id: c2
  text: Module 2
  heading: true
  items:
  - id: c2.1
    text: The course focuses on the paradigm and core features of Python, as well as environments suited
      for data manipulation in the context of data science, such as PyTorch and TensorFlow.
  - id: c2.2
    text: Emphasis is placed on exploring its libraries, which support the use and definition of machine
      learning models in various domains, including text analysis, time series, and image analysis.
  - id: c2.3
    text: The practical part of the course involves the use of development tools and platforms such as
      Jupyter Notebook, Google Colab, Hugging Face, and GitLab, enabling data analysis sharing and support.
  - id: c2.4
    text: The course also includes access to various datasets to illustrate the applicability of the material
      through real-world examples.
