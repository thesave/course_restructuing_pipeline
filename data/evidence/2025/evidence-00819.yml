contents:
- id: c1
  text: Introduction to Programming with C++.
- id: c2
  text: 'Imperative programming in C++: algorithms and programs, data types, assignment, input / output,
    conditional, iteration, functions, recursion and recursive functions, vectors, records, memory allocation,
    dynamic data structures (lists, queues, trees)'
- id: c3
  text: 'Object-oriented programming in C++: classes, methods, overloading, inheritance.'
- id: c4
  text: Use of a development environment.
