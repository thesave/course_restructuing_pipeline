outcomes:
- id: o1
  text: The student knows the basic features (terms, concepts and methods) of computational thinking.
- id: o2
  text: 'S/he is able to: understand and use different types of data and data structures; design and implement
    scripts and use core libraries for the processing of numerical and textual data; apply the acquired
    knowledge to solve problems with computing tools.'
contents:
- id: c1
  text: The course teaches how to use some of the computational tools that can help a professional in
    language and intercultural communication to solve problems.
- id: c2
  text: It pays particular attention to large-scale problems and to the implementation of solutions that
    go beyond using standard software.
- id: c3
  text: Introduction to computational thinking
- id: c4
  text: Decomposition
- id: c5
  text: Pattern recognition
- id: c6
  text: Abstraction
- id: c7
  text: Algorithmic thinking
- id: c8
  text: Introduction to programming
- id: c9
  text: Jupyter notebooks
- id: c10
  text: Basic operations
- id: c11
  text: Dealing with text
- id: c12
  text: Methods
- id: c13
  text: Classes This lesson represents the minimum necessary introduction to follow lessons on natural
    language processing and machine translation fine tuning (e.g., within the Translation and Technology
    (https://corsi.unibo.it/2cycle/SpecializedTranslation/course-structure-diagram/piano/2023/9174/C09/000/2023)
    MA curriculum).
