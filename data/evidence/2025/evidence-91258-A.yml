- id: c14
  text: NLP applications
prerequisites:
- id: p1
  text: The course is intended for 2nd-year students of the Masters' Degree in Artificial Intelligence,
    who have a solid background in foundational subjects and technological tools for tackling modern Natural
    Language Processing.
- id: p2
  text: There are no formal prerequisites in terms of exams taken, but students are expected to be familiar
    with machine learning and deep learning concepts and tools, and the Python programming language.
