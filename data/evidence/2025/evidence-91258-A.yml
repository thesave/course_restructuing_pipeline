outcomes:
- id: o1
  text: At the end of the course, the student masters the basic algorithms, tools and systems for the
    management, processing and analysis of natural language.
- id: o2
  text: The student is able to design and develop simple systems oriented to real-world natural language
    processing applications such as those requiring segmentation and classification of elements of text.
