outcomes:
- id: o1
  text: At the end of the course, the student acquires the basics of Python programming, data structures
    and algorithms.
- id: o2
  text: He is able to use the libraries to work with statistics, graphs and tables, spreadsheets and web
    pages.
- id: o3
  text: Providing the student with the concepts necessary for understanding computer architectures and
    the role of hardware components in the performance of computing systems.
contents:
- id: c1
  text: 'The course is structured in three modules taking place in parallel: one carrying out lectures
    on Python programming, one with corresponding lab activity (guided exercises at the PC), and one dedicated
    to computer architectures.'
- id: c2
  text: 'Python Programming: variables, objects, types and expressions; control flow statements; object
    attributes and methods; function definitions and scoping; modules, standard library and packages;
    immutable and mutable objects; basic data structures (strings, tuples, lists, dictionaries) and their
    use in the solution of problems; basic types of algorithms.'
- id: c3
  text: 'Computer Architectures: working knowledge of the key terms, computer components (CPU, RAM, HDD/SSD,
    I/O devices), milestones in computer architectures, current trend and applications; digital representation,
    logic circuits, chips and their production; modern computer architectures: computer performance, parallelism,
    comparison of architectures, cloud paradigm, computer-related companies.'
