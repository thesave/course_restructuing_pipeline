outcomes:
- id: o1
  text: This is a software engineering course concerning software development processes and practices,
    with specific focus on those useful for the requirement and the design of software systems.
- id: o2
  text: Specifically, the students will learn how to apply principles, practices and patterns to the analysis,
    design and construction of software systems.
- id: o3
  text: They will learn how to address the issues related to the internal quality of software systems.
- id: o4
  text: They also will learn the main agile and plan-based methods and how to work in a development team.
