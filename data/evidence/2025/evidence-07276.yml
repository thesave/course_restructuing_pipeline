outcomes:
- id: o1
  text: At the end of the course the student possesses general knowledge of IT, such as that relating
    to the components of processing systems, networks and basic software.
- id: o2
  text: Knows and applies concepts relating to the hardware and software of a computer system, in particular
    for the classification and use of simple application programs.
- id: o3
  text: He is able to evaluate the efficiency of a processing system, especially in relation to his actual
    needs, both study and professional.
- id: o4
  text: He knows how to develop a basic IT approach for the solution of simple problems, which contribute
    to his academic and professional preparation.
- id: o5
  text: He has the ability to consult search engines to collect information, useful for carrying out his
    activities, both study and work.
