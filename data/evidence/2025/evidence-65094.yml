outcomes:
- id: o1
  text: 'This course will be devoted to complete the preparation by giving the student all elements of
    programming with modern languages: e.g. python, object-oriented programming.'
contents:
- id: c1
  text: 'The Python programming language: from basics to advanced programming for scientific computing.'
- id: c2
  text: The first part includes a quick overview over variables, data types, operators, control structures,
    functions, lists, tuples, dictionaries, file handling.
- id: c3
  text: Within the second part the student will start exploring the versatility and power for scientific
    computing, learning how to unleash the potential of Python by mastering essential libraries such as
    NumPy, SciPy, Pandas, Matplotlib and Scikit-Learn.
- id: c4
  text: These libraries will be the tools for efficiently managing, analyzing, and visualizing large datasets
    commonly encountered in scientific research.
- id: c5
  text: The student will apply the learned skills in the resolution of simple physical equations (ex.
- id: c6
  text: D’alembert equations, heat equation, transport equation) with the help of basic numerical modeling,
    in the extraction of major statistical properties from physical datasets and comparison with theoretical
    predictions, in the visualization and graphical representation of datasets and their properties.
- id: c7
  text: The course will introduce to some basics of shell commands to optimize and automate workflows
    and series of codes.
