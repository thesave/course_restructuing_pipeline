outcomes:
- id: o1
  text: The course introduces main issues related to design and implementation of modern operating systems.
- id: o2
  text: Moreover, the course provides the basic knowledges of their structure, implementation and system
    administration procedures.
contents:
- id: c1
  text: Introduction and history of operating systems.
- id: c2
  text: ANSI C programming language.
- id: c3
  text: Shell and Shell scripting.
- id: c4
  text: Thread and processes.
- id: c5
  text: Concurrent programming.
- id: c6
  text: Deadlock, Starvation e Busy Waiting.
- id: c7
  text: Inter Process Communications.
- id: c8
  text: CPU scheduling.
- id: c9
  text: Memory management and virtual memory.
- id: c10
  text: Secondary memory management and file systems.
- id: c11
  text: I/O management.
- id: c12
  text: 'Case study: Linux and Windows.'
- id: c13
  text: Linux Kernel.
- id: c14
  text: Introduction to virtualization, container, docker, kubernetes, IaaS and PaaS services.
