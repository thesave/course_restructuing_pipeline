outcomes:
- id: o1
  text: At the end of the course, the student is able to design, implement and evaluate the quality of
    the interaction with software systems with respect to the dimensions of practicality, experience,
    affection, meaning and value that they may have on the target audience.
- id: o2
  text: The student is able to focus the functional analysis of the software on the characteristics and
    needs of the target audience, to drive the development process so as to guarantee a constant connection
    between the technical and implementation features and the expectation of the audience, and to evaluate
    whether and according to which metrics a software system satisfies these expectations.
contents:
- id: c1
  text: 'The course content is divided in distinct parts:'
- id: c2
  text: 'Background: The evolution of the discipline from Human Computer Interaction to User Experience
    Design. A description of its scope: the human, the computer, and their interaction.'
- id: c3
  text: 'Usability analysis and design: A systematic discussion of the techniques and standards for the
    management of the process of user experience design, with particular attention to the phases of usability
    analysis (with and without the participation of users) and the user- and goal-oriented usability design
    methodologies.'
- id: c4
  text: 'Guidelines, patterns and methods for usability design: A discussion, with historical aspects,
    of the framework on which the concrete aspects of usability design is based. we will also give strong
    attention to the problem of usability for web applications and mobile apps.'
- id: c5
  text: 'Applications of User Experience Design to complex systems (e.g. AI Systems): short module reserved
    to students in Artificial Intelligence, optional for the other students.'
