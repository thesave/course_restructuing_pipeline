outcomes:
- id: o1
  text: The student will know propositional calculus and first order logic.
- id: o2
  text: He will be able to write and understand logical propositions and to verify them.
contents:
- id: c1
  text: The first part of the course will cover concepts and formalisms of propositional calculus, syllogistic
    logic, and predicate/first-order logic.
- id: c2
  text: Based on these notions, the second part will briefly introduce the fundamental concepts of information,
    entropy, and computability (Turing machines), and knowledge representation techniques in the context
    of automated reasoning.
- id: c3
  text: In the third and final part, modal/epistemic logic and action logic will be covered, leading up
    to the fundamental constructs of imperative programming.
- id: c4
  text: During the lab sessions, specific computational platforms will be used to learn, test, and apply
    the theoretical concepts covered in class.
