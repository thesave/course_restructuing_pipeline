outcomes:
- id: o1
  text: At the end of the course, the student knows and can apply formal, ontological and computational
    methods to deal with the semiotic interpretation of multimodal data and content.
- id: o2
  text: The interpretations considered will concern different ontological levels.
- id: o3
  text: A 4E (embodied, enactive, embedded, extended) approach will be assumed.
contents:
- id: c1
  text: This course covers interdisciplinary research across semiotics, ontology, artificial intelligence,
    and cognitive science.
