outcomes:
- id: o1
  text: At the end of this course, students will acquire advanced knowledge of techniques and methodologies
    for advanced software development.
- id: o2
  text: In particular, students will:-know the basic software engineering methodologies (from waterfall
    to agile ones), and can apply them to develop complex software systems;
- id: o3
  text: know the main programming techniques of declarative (functional and logical) approaches;
- id: o4
  text: be able to apply advanced programming techniques in the context of modern programming languages,
    and in particular, those mixing object-oriented and functional paradigms;
- id: o5
  text: be able to apply advanced design patterns in the context of the various programming paradigms.
contents:
- id: c1
  text: Software quality
  items:
  - id: c1.1
    text: rules for clean code and effective programming
  - id: c1.2
    text: the role of design patterns
  - id: c1.3
    text: refactoring
  - id: c1.4
    text: agile testing approaches
- id: c2
  text: Functional programming
  items:
  - id: c2.1
    text: functions and functional programming
  - id: c2.2
    text: lambda calculus
  - id: c2.3
    text: the Scala language (OO layer, functional layer, advanced typing)
- id: c3
  text: Logic programming
  items:
  - id: c3.1
    text: Prolog
  - id: c3.2
    text: Java-Prolog integration
- id: c4
  text: Software engineering
  items:
  - id: c4.1
    text: software methodologies overview
  - id: c4.2
    text: documenting a project
  - id: c4.3
    text: the role of SCRUM
  - id: c4.4
    text: testing, unit testing, and test-driven development
  - id: c4.5
    text: continuous integration and delivery
  - id: c4.6
    text: advanced design and architectural patterns
prerequisites: []
bibliography: |-
  Advanced OO programming techniques:

  - "Effective Java", Third Edition, Joshua Bloch
  - "Design Patterns: Elements of Reusable Object-Oriented Software", Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides

  Functional languages:

  - "Functional Programming in Scala", Paul Chiusano and Runar Bjarnason
  - "Programming in Scala", Bill Venners, Lex Spoon, and Martin Odersky
  - "Functional Programming Patterns in Scala and Clojure", Michael Bevilacqua-Linn
  - "Programming Scala: Scalability = Functional Programming + Objects", Alex Payne and Dean Wampler

  Logic languages:

  - "The Art of Prolog", Second Edition, Leon S. Sterling and Ehud Y. Shapiro

  Software Engineering:

  - "Fundamentals of Software Engineering", Giorgio Ghezzi, Dino Mandrioli and Mehdi Jazayeri
  - "Clean Code", Robert Cecil Martin
  - "The Art of Agile Development", James Shore
  - "Scrum and XP from the Trenches: How We Do Scrum", by Henrik Kniberg
  - "Test Driven Development: By Example", Kent Beck
  - "JUnit in Action", Second Edition, Petar Tahchiev, Felipe Leme, Vincent Massol and Gary Gregory
  - "Testing in Scala", Daniel Hinojosa
  - "Managing Technical Debt: Reducing Friction in Software Development", Philippe Kruchten, Robert Nord, Ipek Ozkaya
