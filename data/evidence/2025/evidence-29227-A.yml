outcomes:
- id: o1
  text: Students learn basic notions about the architecture of a computing system.
- id: o2
  text: Students gain expertise about techniques and methods for the solution of various classes of problems
    using a specific programming language.
- id: o3
  text: The aim of the course is to give the student a general overview about computers and scientific
    computing.
- id: o4
  text: After this introductory part, the course is focused on the C language and on numerical methods
    both at an elementary level.
