- id: c8
  text: Social Implications of Information Technology (Chapter 9)
- id: c9
  text: Digital Privacy and Security (Chapter 10)
- id: c10
  text: Laboratory sessions will focus on technologies and platforms such as HTML, A-Frame, Glitch, WIX/WEEBLY,
    Excel, and SEO, with applications in the fashion sector.
- id: c11
  text: Brief overview of 3D modeling software (Clo3D and Style3D).
- id: c12
  text: Brief overview of Artificial Intelligence, Virtual Reality, and Augmented Reality.
