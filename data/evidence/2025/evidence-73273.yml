outcomes:
- id: o1
  text: At the end of the course the student has the necessary knowledge to apply computer technologies
    to the context of fashion.
- id: o2
  text: The student acquires the skills required to use state of the art platforms aimed at developing
    office and communication activities.
- id: o3
  text: The student learns to interact with IT specialists in order to translate ideas into concrete software
    implementations.
