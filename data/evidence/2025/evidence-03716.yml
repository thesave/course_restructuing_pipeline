outcomes:
- id: o1
  text: At the end of the course, the student possesses the methods and tools needed to approach the design
    of simple microprocessor-based systems with awareness.
- id: o2
  text: The student learns to analyse and synthesize combinational and sequential logic networks (both
    synchronous and asynchronous).
- id: o3
  text: This knowledge forms the foundation for studying the architectures of modern electronic computers,
    through which the student acquires an understanding of their general operating principles, performance
    impact, processor design, and the mutual relationship between hardware and software.
- id: o4
  text: 'Beyond the specific content, the student develops one of the key skills currently required in
    the information engineering industry: the ability to manage project complexity, becoming accustomed
    to the practice of abstraction, understood as the process of effectively and hierarchically representing
    the essence of a computing system.'
