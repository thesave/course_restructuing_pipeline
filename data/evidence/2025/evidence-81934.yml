outcomes:
- id: o1
  text: At the end of the course, the student
  items:
  - id: o1.1
    text: understands the principles and methodologies for designing interaction systems with a computer
      system;
  - id: o1.2
    text: understands theories and methodologies for evaluating interface usability;
  - id: o1.3
    text: understands the principles and methodologies of User Experience and Experience Design.
contents:
- id: c1
  text: The course will focus on three key areas
  items:
  - id: c1.1
    text: 'Introduction to Human-Computer Interaction: Covering foundational models like Norman’s Model
      of Interaction and Abowd and Beale''s interaction framework, along with tools, techniques, and environments
      for HCI.'
  - id: c1.2
    text: 'Human-Centered Interactive Application Development: Exploring tasks and methods for designing,
      developing, and evaluating interactive applications. Topics include needfinding strategies, prototyping
      (low- and high-fidelity), mental models, visual design, heuristic evaluation, and basics of user
      studies. This section emphasizes the design process, with students applying concepts to a specific
      application domain through a group project carried out during lab sessions.'
  - id: c1.3
    text: '"Beyond Traditional Interaction" Paradigms: Investigating advanced interaction paradigms, such
      as AI-driven systems, tangible interaction, voice user interfaces, and gesture-based interaction.
      These topics will be explored from multiple perspectives, including their rationale, vision, contemporary
      examples, and associated development tools.'
