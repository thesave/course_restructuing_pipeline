outcomes:
- id: o1
  text: At the end of the course, the student knows the basics of modern cryptography and some techniques
    for the analysis of security protocols.
- id: o2
  text: He or she can verify the absence of security bugs on simple protocols
contents:
- id: c1
  text: This course deals with some fundamental notions on modern cryptography and some techniques for
    the formal verification of cryptographic protocols.
- id: c2
  text: In addition to many new concepts, we discuss some cryptographic techniques already seen in previous
    courses, studying the most interesting properties .
- id: c3
  text: 'The main emphasis of this course is on the theoretical aspects of cryptography: it attempts to
    give a clear and accurate account on security, in order to give students the tools to assess (and
    not just to use) cryptographic techniques .'
- id: c4
  text: In other words, we focus a lot on the "why" maybe putting the "how" behind the scenes.
- id: c5
  text: 'More specifically, we seek to answer questions such as the following: when a cryptographic technique
    can be consider safe?'
- id: c6
  text: Is it possible to formally prove that a cryptographic technique is secure ?
- id: c7
  text: Is it possible to analyze the security of a cryptographic protocol in an automatic or semi-automatic
    way?
- id: c8
  text: Topics covered include perfect security, pseudorandomness, public and private key ciphers, and
    the symbolic model.
