outcomes:
- id: o1
  text: At the end of the course, the student is familiar with the core technologies of the web and the
    semantic web.
- id: o2
  text: They are able to effectively use knowledge graphs and the tools to model and query them.
- id: o3
  text: They know the state of the art of artificial intelligence technologies.
contents:
- id: c1
  text: This module aims to provide the student with an in-depth knowledge of knowledge graphs and methods
    and tools to query them.
- id: c2
  text: The study of the modeling of knowledge graphs based on ontology will be addressed, as well as
    the practical use of some software tools to support their exploration and querying.
- id: c3
  text: Furthermore, the characteristics of Large Language Models and the main prompting techniques will
    be studied.
- id: c4
  text: In particular, the following tools will be used
  items:
  - id: c4.1
    text: SPARQL query engine
  - id: c4.2
    text: Graffoo; OWL diagrams notation
  - id: c4.3
    text: Github
  - id: c4.4
    text: 'LLMs: GPT, Llama, Mistral, Mixtral, Gemini'
