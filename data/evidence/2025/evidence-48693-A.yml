outcomes:
- id: o1
  text: Il corso fornisce allo studente una panoramica sull’utilizzo critico delle tecnologie informatiche
    a supporto dello studio del patrimonio culturale.
- id: o2
  text: Verranno presentati principi e caratteristiche hardware e software delle moderne tecnologie informatiche,
    dalle tecniche proprie della Digital Humanities (trasposizione digitale e analisi di testi e documenti,
    creazione e gestione banche dati, web database) al Virtual Heritage (acquisizione tridimensionale
    di contesti storici e archeologici, ricostruzione virtuale tramite computer grafica, elaborazione
    di immagini e restauro virtuale, GIS e cartografia storica).
- id: o3
  text: Verranno inoltre illustrati casi applicativi e progetti di ricerca nelle diverse discipline storiche,
    storico-artistiche, archeologiche e documentarie.
- id: o4
  text: Al termine del corso lo studente avrà conoscenza e consapevolezza delle principali tecniche e
    tecnologie informatiche a supporto del patrimonio culturale, saprà integrarle alle metodologie di
    indagine tradizionale per elaborare una efficace strategia di studio e di indagine a seconda dei diversi
    casi applicativi.
contents:
- id: c1
  text: The course aims to introduce students to the topics of Digital Humanities (DH) and Data Management
    (DM).
- id: c2
  text: During the course, particular attention will be given to the use of digital tools and methodologies
    for the proper management of humanities data throughout the entire life cycle of a DH project, with
    a focus on bibliographic, archival, documentary, and artistic domains.
- id: c3
  text: Students will acquire both theoretical and practical knowledge of the languages, models, tools,
    and principles necessary to conceive, design, and implement a digital resource based on FAIR (Findable,
    Accessible, Interoperable, and Reusable) data management, capable of enhancing cultural heritage.
