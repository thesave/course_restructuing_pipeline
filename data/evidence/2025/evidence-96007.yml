outcomes:
- id: o1
  text: At the end of the course, the student will know the principles and methods underlying the logical
    design of machines that receive, process, and generate binary signals.
- id: o2
  text: 'The student will also understand the elementary principles used to describe the machine from
    two perspectives: behavior (i.e., "what it does") and structure (i.e., "how it is built").'
- id: o3
  text: The student will be familiar with the architecture of computers and their structuring into layers,
    and will be able to understand low-level programming languages used to program information processors.
- id: o4
  text: The student will also be familiar with the functionalities of the operating system, the issues
    of multi-user systems and concurrency, the character-based user interface, and the structure of the
    filesystem.
