outcomes:
- id: o1
  text: Knowledge of models and tools for the analysis, design, development, and testing of software systems.
- id: o2
  text: Ability to design, develop, and test software systems.
contents:
- id: c1
  text: Introduction to software engineering; software product.
- id: c2
  text: 'Process of software development: feasibility study, analysis and specification of requirements,
    design, implementation and testing of modules, integration and system testing, operation and maintenance,
    software quality factors, evolutionary models.'
- id: c3
  text: 'Object-oriented analysis and design: modeling languages, UML.'
- id: c4
  text: 'Requirement analysis: gathering and validation, domain analysis, requirement analysis, use cases
    and scenarios'
- id: c5
  text: 'Problem analysis: static and dynamic model, definition of the logical architecture of the problem.'
- id: c6
  text: 'Design: designing the system architecture.'
- id: c7
  text: 'Principles of design: rigidity, fragility, and immobility of software.'
- id: c8
  text: Design patterns.
- id: c9
  text: 'Introduction to the .NET framework and the C # language.'
- id: c10
  text: Version control systems.
prerequisites: []
bibliography: |-
