  - C. Larman, Applicare UML e i pattern: Analisi e progettazione orientata agli oggetti, Pearson
  - E. Gamma, R. Helm, R. Johnson, J. Vlissides, Design Patterns – Elements of Reusable Object-Oriented Software, Addison Wesley
  - M. Fowler, UML Distilled, Addison Wesley
  - S. Bennett, J. Skelton, K. Lunn, Introduzione a UML, McGraw-Hill
  - W. Zuser, S. Biffl, T. Grechenig, M. Köhle, Ingegneria del software con UML e UnifiedProcess, McGraw-Hill
  - J. Arlow, I. Neustadt, UML e UnifiedProcess – Analisi e progettazione object-oriented, McGraw-Hill, 2003
  - I. Sommerville, Ingegneria del software, Pearson
  - R. S. Pressman, Principi di Ingegneria del Software, McGraw-Hill
