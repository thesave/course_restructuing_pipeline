outcomes:
- id: o1
  text: At the end of the course the student will know the principal languages, the modeling techniques
    and the reasoning methods that are at the base of artificial intelligence.
- id: o2
  text: In particular the student will be able to construct systems that exhibit intelligent behaviours,
    often simulating the behavior of human experts of a specific discipline.
- id: o3
  text: Moreover she will be able to model and solve simple constraint and optimization problems by using
    constraint programming.
contents:
- id: c1
  text: Introduction to artificial intelligence.
- id: c2
  text: The principal technologies and applications of artificial intelligence.
- id: c3
  text: The notion of agent.
- id: c4
  text: Non informed search strategies.
- id: c5
  text: Informed search strategies.
- id: c6
  text: Search with adversaries.
- id: c7
  text: 'Modeling of problems with costraints and CSP: basic notions.'
- id: c8
  text: Logic programming.
- id: c9
  text: Constraint programming, basic notions of MiniZinc.
- id: c10
  text: Introduction to machine learning.
- id: c11
  text: Sub-symbolic computation and neural networks .
- id: c12
  text: Large language models
- id: c13
  text: Philosophical aspects and future challenges.
