outcomes:
- id: o1
  text: At the end of the course, the student has a basic understanding of computational tools and terminology.
- id: o2
  text: 'He is able to:'
- id: o3
  text: use programming languages to write small scale programs;
- id: o4
  text: understand programs written by others;
- id: o5
  text: map simple physical problems into computational solutions.
contents:
- id: c1
  text: Module 1
  heading: true
  items:
  - id: c1.1
    text: Computational tools and problem solving.
  - id: c1.2
    text: Declarative and Imperative knowledge.
  - id: c1.3
    text: High level programming languages and tools.
  - id: c1.4
    text: Interpreters and Compilers.
  - id: c1.5
    text: The role of debugging.
  - id: c1.6
    text: Scripting Languages.
  - id: c1.7
    text: The Python interpreter.
  - id: c1.8
    text: Computer programming in Python.
  - id: c1.9
    text: Variables expressions, and statements; signed number representation and the approach of Python.
  - id: c1.10
    text: Functions, conditionals and recursion; Iteration; Data types; Tables; Exporting data in csv
      files; spreadsheet creation; Python built-in data types and basic
  - id: c1.11
    text: Object Oriented Programming concepts and notation.
- id: c2
  text: Module 2
  heading: true
  items:
  - id: c2.1
    text: Python modules focusing on graphical and scientific/numerical ones; Analysis and browsing of
      data catalogs using different formats (ascii, fits); Sample selection and correlation analysis;
      Statistical methods for data modelling; solving astronomical problems.
