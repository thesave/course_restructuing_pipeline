outcomes:
- id: o1
  text: He/she is able to effectively use the tools of the Office suite to create, analyse and present
    documents, spreadsheets and presentations.
- id: o2
  text: They will also have acquired basic knowledge of artificial intelligence and will be able to recognise
    its practical applications in a professional context.
contents:
- id: c1
  text: This course is part of the Integrated Course B9090 - Soft Skills.
- id: c2
  text: 'The Integrated Course B9090 - SOFT SKILLS contributes to the achievement of the following ESEVT
    Day One Competences: 1.1, 1.4, 1.6, 1.11, 1.12.'
- id: c3
  text: The BASICS OF COMPUTER SCIENCE course will address the fundamental concepts and tools for the
    effective and informed use of digital technologies in academic and professional settings.
- id: c4
  text: Specifically, the lessons will cover the following topics
  items:
  - id: c4.1
    text: 'Introduction to computer science: basic concepts (hardware, software, networks), computer architecture,
      and operating systems (1 hour)'
  - id: c4.2
    text: 'Word processing and presentations: creating and formatting text documents, managing styles,
      indexes, and bibliographies. Techniques and tools for creating clear, professional, and effective
      presentations. (2 hours)'
  - id: c4.3
    text: 'Spreadsheets: organizing data, using basic formulas and functions, creating charts for data
      analysis and visualization. (2 hours)'
  - id: c4.4
    text: 'Online communication and collaboration: professional email, cloud storage, tools for teamwork
      (e.g., Office 365, Teams, OneDrive). (1 hour)'
  - id: c4.5
    text: 'Cybersecurity and privacy: recognizing the main threats (viruses, malware, phishing), protecting
      your devices, data, and digital identity. (1 hour)'
  - id: c4.6
    text: 'Introduction to new tools: using artificial intelligence tools, using medical informatics software
      (1 hour)'
