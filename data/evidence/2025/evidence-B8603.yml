outcomes:
- id: o1
  text: The student knows the history, theoretical principles, and latest developments of machine translation
    (MT) and artificial intelligence (AI) applied to language and translation services; they understand
    the principles of pre- and post-editing, as well as prompt design and engineering, and can apply them
    maintaining adequate ethical standards; they can plan, execute, and evaluate complex projects involving
    other professionals and a range of AI-based language and translation tools; they are able to acquire
    further knowledge independently in both MT and AI technologies and apply it to optimize and innovate
    language industry processes.
contents:
- id: c1
  text: In this course, the student will learn
  items:
  - id: c1.1
    text: the main phases of the history and evolution of machine translation
  - id: c1.2
    text: the intuition behind the main principles underlying MT
  - id: c1.3
    text: how to apply and interpret the most important evaluation metrics for machine-produced translations
  - id: c1.4
    text: how to set up and maintain a MT model, including gathering and cleaning training data
  - id: c1.5
    text: to use specialised MT software and utilities
  - id: c1.6
    text: to think about MT systems critically and leverage their knowledge to boost productivity
