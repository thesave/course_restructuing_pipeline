outcomes:
- id: o1
  text: At the end of this course students will be able to design and create digitally enabled "things"
    consisting of single board computers, sensors and actuators.
- id: o2
  text: They will be also able to study and implements all the software components needed by their "things"
    to interface peripherals, to process data and to communicate/interoperate.
- id: o3
  text: Tools to create physical objects will be studied in this course as well, both additive and subtractive
    manifacturing methods.
- id: o4
  text: The students will learn how to implement innovative software for CNC-like machines (3D printers,
    CNC mills, laser cutters, etc).
- id: o5
  text: In this way a student can design physical and digitally enabled objects and tools from blueprint
    to prototype.
- id: o6
  text: Such "digital craft working" professionals can provide original solutions for both practical and
    artistic challenges.
- id: o7
  text: Subjects of the course will also be the design and development of teaching methods for computer
    Science based on Making, and Making as a problem solving paradigm.
- id: o8
  text: At the end of the course, the student is able to design and build objects composed of microsystems,
    sensors, and actuators, as well as to study and develop the related software components for interfacing,
    processing, and communication.
- id: o9
  text: The purpose of the course is to integrate knowledge of computer science with the basics of analog
    and digital electronics for interfacing, processing, and communication, including radio transmission.
- id: o10
  text: The course also introduces the principles of operation of tools for the physical 3D realization
    of objects through constructive or subtractive synthesis, and provides skills related to software
    for the innovative use of 3D printers.
- id: o11
  text: In this way, the student is capable of formulating and carrying out digital craftsmanship projects
    to deliver original and creative solutions for specific practical problems or artistic purposes.
- id: o12
  text: Additionally, skills will be provided for designing and developing teaching methodologies in computer
    science based on the concept of Making, as well as constructive problem-solving techniques
contents:
- id: c1
  text: Module 1
  heading: true
  items:
  - id: c1.1
    text: 'Introduction: Digital Artisans'
  - id: c1.2
    text: 'Electronics with passive components: electric current, intensity, potential, power, energy,
      Kirchhoff''s laws, resistors, Ohm''s laws, capacitors, inductors, transformers.'
  - id: c1.3
    text: 'Semiconductors: diodes, transistors'
  - id: c1.4
    text: 'Use of laboratory instruments: multimeter, oscilloscope, logic analyzer'
  - id: c1.5
    text: Digital Electronics
  - id: c1.6
    text: Radio Waves
  - id: c1.7
    text: 'FPGA and HDL: verilog, workbench/simulation'
- id: c2
  text: Module 2
  heading: true
  items:
  - id: c2.1
    text: 'The course contents include the following topics, ranging from electronics to computer science:'
  - id: c2.2
    text: Arduinos and microcontrollers
  - id: c2.3
    text: Raspberry Pi e Systems-on-Chip
  - id: c2.4
