outcomes:
- id: o1
  text: At the end of the course the students will know
  items:
  - id: o1.1
    text: the main problems concerning the realization of highly parallel and distributed programs
  - id: o1.2
    text: a programming style, based on functional and object-oriented programming, useful to develop
      scalable applications, namely applications that can be easily deployed over different computing
      architectures, with different amounts of computing resources. In particular, the students will be
      able to
  - id: o1.3
    text: develop an application by using the programming language Scala and the platform Spark and deploy
      it on cloud computing systems like those provided by Amazon Web Services (AWS) and Google Cloud
      Platform (GCP).
contents:
- id: c1
  text: Analisys of the problems concerning the realization of highly concurrent and distributed applications.
- id: c2
  text: Scalable approaches to the parallelization and distribution of both data and processes, like the
    MapReduce programming model.
- id: c3
  text: Functional approach to the realization of scalable systems through languages and frameworks like
    Scala and Spark.
- id: c4
  text: Cloud platforms for the execution of scalable applications like Amazon Web Services (AWS) and
    Google Cloud Platform (GCP).
