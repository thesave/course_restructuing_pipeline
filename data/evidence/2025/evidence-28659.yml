outcomes:
- id: o1
  text: Skills, knowledge, and ability to apply the primary existing models and tools for the design,
    implementation, deployment, and optimization of Web-based systems and applications.
contents:
- id: c1
  text: 'The origins of the Web: the static model Short historical introduction The originary World Wide
    Web model Primary model elements: the HTTP protocol and the URIs Languages for page content description:
    HTML and CSS'
- id: c2
  text: 'The evolution of the Web model Towards a more dynamic approach: personalization, state, sessions,
    and conversations State management Server-side programming: Servlet, JSP Client-side programming:
    Javascript, Ajax'
- id: c3
  text: 'Towards Enterprise-oriented server-side environments Multi-layer architectures: horizontal and
    vertical distribution, business logics separation, component-container models Rapid notes on Model
    View Controller for the Web and on Java Model 2 Enterprise Java Beans as a notable example of technology
    compliant with the heavy container model Spring as a notable example of technology compliant with
    the lightweight container model'
- id: c4
  text: 'Emerging client-side technologies: single page applications, react.js, and directions of evolution
    of front-end technologies'
- id: c5
  text: 'Emerging server-side technologies: event-oriented and stateless models, node.js, asynchronous
    I/O management'
- id: c6
  text: 'Upgrading towards HTTP2/0: Websocket motivations and mechanisms, in Javascript (client side)
    and Java (server side)'
- id: c7
  text: 'Introductory elements of HTTP3/0: motivations and primary characteristics of the QUIC protocol'
- id: c8
  text: Please see also the full description of the course contents on the related Website on Virtuale
    @UNIBO, which will be populated and enriched progressively during the lecturing period.
- id: c9
  text: To have a preliminary idea of the contents, please refer to the contents of the previous academic
    year.
