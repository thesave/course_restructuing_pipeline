outcomes:
- id: o1
  text: Students are familiar with semantic web and LLM technologies.
- id: o2
  text: They know the core differences between knowledge-based and machine learning-based Artificial Intelligence
    methods.
- id: o3
  text: They know the basic principles and theories behind this technologies and are able to design, build
    and query ontologies and knowledge graphs.
- id: o4
  text: They are familiar with the main prompting techniques and are able to use them in combination with
    knowledge graphs.
contents:
- id: c1
  text: This course aims to provide students with in-depth knowledge of knowledge graphs and the methods
    and tools used to query them.
- id: c2
  text: It will cover both the theoretical foundations of ontology-based knowledge graph modeling and
    the practical use of software tools for their exploration and querying.
- id: c3
  text: In addition, the course will explore the characteristics of Large Language Models (LLMs) and the
    main prompting techniques.
- id: c4
  text: The topics covered in the course are summarized as follows
  items:
  - id: c4.1
    text: The Semantic Web and the basics of ontology and knowledge graph design
  - id: c4.2
    text: Overview of Artificial Intelligence (applications and methods)
  - id: c4.3
    text: Prompting techniques
- id: c5
  text: The following tools will be used
  items:
  - id: c5.1
    text: SPARQL query engine
  - id: c5.2
    text: Graffoo; OWL diagram notation
  - id: c5.3
    text: GitHub
  - id: c5.4
    text: 'LLMs: GPT, Llama, Mistral, Mixtral, Gemini'
