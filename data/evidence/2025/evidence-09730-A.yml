outcomes:
- id: o1
  text: At the end of the course the student possesses the fundamental notions regarding digital machines
    and the architecture of computers and their use in information processing.
- id: o2
  text: In addition, he possesses the knowledge useful for the design of algorithms and the tools necessary
    for their implementation using a high-level language to solve simple engineering problems.
contents:
- id: c1
  text: 'Basic computer architecture: Von Neuman architecture; structure of a CPU.'
- id: c2
  text: 'Information representation: representation of numerical information (two''s complement representation,
    floating-point representation); representation of non-numerical information.'
- id: c3
  text: 'Boolean logic: Boolean algebra.'
- id: c4
  text: Boolean expressions and functions.
- id: c5
  text: Logic gates and circuit diagrams.
- id: c6
  text: 'Introduction to algorithms and data structures: definition of algorithm and examples; fundamental
    data structures.'
- id: c7
  text: 'The MATLAB / Octave language: Fundamental constructs.'
- id: c8
  text: Data structures.
- id: c9
  text: Operations on vectors and matrices.
- id: c10
  text: Vector programming elements.
- id: c11
  text: Input and Output.
- id: c12
  text: Functions.
- id: c13
  text: Visibility of variables.
- id: c14
  text: Use of graphic functions.
