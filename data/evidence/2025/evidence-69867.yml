outcomes:
- id: o1
  text: 'At the end of the course, the student is able to develop, by using advanced programming techniques:
    web sites based on client side and server side web technologies, front-ends based on apps and rich
    internet applications and back-ends based on web services, asynchronous notifications and workflows.'
contents:
- id: c1
  text: Comparisons among different Web architectures and different solution stacks.
- id: c2
  text: 'Web Browser and Web Server: how they work and the supported technologies.'
- id: c3
  text: MVC and MVVM patterns applied to the Web context.
- id: c4
  text: JavaScript and the "JavaScript everywhere" paradigm
- id: c5
  text: MEVN solution stack and related ones (MEAN and MERN), illustrating MongoDB, ExpressJS, NodeJS.
- id: c6
  text: 'Javascript frameworks: VueJS, Angular, React.'
- id: c7
  text: 'Superset languages in the Web: TypeScript, SASS and SCSS.'
