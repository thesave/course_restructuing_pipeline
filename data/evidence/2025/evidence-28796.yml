outcomes:
- id: o1
  text: At the end of the course the student
  items:
  - id: o1.1
    text: knows the semi structured and unstructured data models in relationship with the central constructors
      of SQL/XML and XQuery;
  - id: o1.2
    text: knows the basic techniques of information retrieval and text analysis;
  - id: o1.3
    text: is capable of designing and developing a datawarehouse;
  - id: o1.4
    text: is capable of conducting a project using the basic data mining techniques
contents:
- id: c1
  text: Structured, unstructured and semi structured data models.
- id: c2
  text: The limits of SQL
- id: c3
  text: An introduction to SQL/XML and XQuery
- id: c4
  text: The information retrieval models (boolean and vectors space) and web information retrieval (PageRank)
- id: c5
  text: The datawarehousing (OLAP) and data mining (Machine Learning)
