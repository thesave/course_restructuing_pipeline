outcomes:
- id: o1
  text: At the end of the course, the student knows the most important technologies used in the World
    Wide Web context.
- id: o2
  text: The student is able to create web documents and simple distributed web applications, determine
    their visual aspects, verify their correctness and universality, and design and verify their usability
    and user experience.
contents:
- id: c1
  text: The course covers the following topics
  items:
  - id: c1.1
    text: 'Fundamentals: Layer 7 protocols, character encodings, standardization bodies'
  - id: c1.2
    text: 'Core web technologies: HTTP, URI, HTML, CSS, XML'
  - id: c1.3
    text: 'Server-side technologies for web applications: PHP, Python, NodeJs'
  - id: c1.4
    text: 'Client-side technologies for web applications: JavaScript, Ajax, JSON, JavaScript frameworks'
  - id: c1.5
    text: 'Component-based web programming: Angular, React, Vue'
  - id: c1.6
    text: 'Introduction to some Semantic Web technologies: RDF, OWL, SPARQL, ontologies'
  - id: c1.7
    text: 'User Experience Design for websites: the Garrett model'
prerequisites: []
bibliography: Due to the rapid evolution of the field, there is no textbook that covers the entire subject.
  Students are provided with slides shown during lectures and are guided from time to time to typically
  free and online resources for completing the course and exploring topics in greater depth.
