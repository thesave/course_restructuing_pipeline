outcomes:
- id: o1
  text: The objective of the course is to present the theory, mechanisms, techniques and tools that are
    effective in increasing the security of a computer system.
- id: o2
  text: At the end of the course, the student will be familiar with the mathematical foundations of modern
    cryptography, authentication, authorization and access control mechanisms that are suitable for achieving
    confidentiality, integrity and availability of computer systems.
- id: o3
  text: The student will also acquire the knowledge necessary to assess the potentials and limitations
    of current technologies.
