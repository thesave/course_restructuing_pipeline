outcomes:
- id: o1
  text: The course aims to provide knowledge about models, processes, and tools for the representation
    and processing of digital documents, particularly administrative and regulatory documents, and their
    organization into accessible and interoperable document repositories.
- id: o2
  text: At the end of the course, the student will know the main techniques for extracting information
    from text documents.
- id: o3
  text: The student will be able to represent and link digital text documents, design complex document
    repositories, and analyze texts to automatically extract meaningful information.
contents:
- id: c1
  text: The course includes an introductory part on the main techniques for document markup and the identification
    of their structural components, with a particular focus on XML technologies and validation languages.
- id: c2
  text: The main document formats will also be studied, along with their characteristics, fields of application,
    and limitations.
- id: c3
  text: Subsequently, some languages and tools for the transformation between document formats will be
    covered.
- id: c4
  text: Additionally, the course will address some models and tools for the automatic extraction of information
    from text, as well as the main Natural Language Processing techniques.
