outcomes:
- id: o1
  text: At the end of the course the students will know the main topics of digital forensics.
- id: o2
  text: 'Moreover, they have used several basic tools to manage some common scenarios: single device (computer,
    tablet, smartphone) and several kinds of file, networking (wireless and wired), e-mail and social
    media.'
- id: o3
  text: The students will know the importance of the chain of custody and also the main procedures to
    acquire, conserve and analyze the data.
- id: o4
  text: The students will know both the importance of the final report and the conceptual instruments
    for its appropriate drafting
