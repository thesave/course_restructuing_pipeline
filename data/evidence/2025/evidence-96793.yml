outcomes:
- id: o1
  text: Aim of the course is to understand the concepts and learn the techniques to access data stored
    in database systems for analytical purposes.
- id: o2
  text: In particular, the student will understand the main concepts of relational and noSQL database
    systems and will learn how to effectively extract data from those systems in order to prepare them
    for subsequent application of statistical and machine learning techniques.
- id: o3
  text: The course will deal with both the query languages of databases and the interfaces with programmatic
    languages, such as R or Python.
- id: o4
  text: At the end of the course the student is able
  items:
  - id: o4.1
    text: to understand the structure of a given database, either relational or noSql;
  - id: o4.2
    text: to access the data stored in a Database Management System either with the specific standard
      languages or with programmatic interfaces.
