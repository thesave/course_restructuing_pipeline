outcomes:
- id: o1
  text: The goal of this course is to introduces the essential concepts of software architecture and related
    abilities expected for a software architect in the practice of software engineering, including the
    application of modern architectures (e.g.
- id: o2
  text: Service-Oriented Architectures and REST, microservices, event-driven Architectures, cloud-computing
    architectures) to concrete application contexts, including cyber-physical systems and the IoT.
- id: o3
  text: The student will learn to
  items:
  - id: o3.1
    text: analyze how a software architecture relates to an organization and identify its quality attributes;
  - id: o3.2
    text: design software architectures using fundamental principles, patterns, and styles;
  - id: o3.3
    text: implement, deploy and manage software architectures using proper software platforms;
  - id: o3.4
    text: document and evaluate software architectures, using standard languages (e.g. UML) and tools.
contents:
- id: c1
  text: Software Architecture introduction
  items:
  - id: c1.1
    text: '- What do we mean for Software Architecture and Architectural Thinking'
  - id: c1.2
    text: '- The Role of Software Architect'
- id: c2
  text: Software Architecture foundations
  items:
  - id: c2.1
    text: '- Basic Concepts and Design Principles'
  - id: c2.2
    text: '- Architectural Styles and Patterns'
  - id: c2.3
    text: main examples including Layered Architecture, Clean Architecture, Service-Oriented Architecture,
      Microservices, Event-Driven Architecture
- id: c3
  text: Software Architecture and the Software Engineering Process
  items:
  - id: c3.1
    text: '- Architectural Significant Requirements'
  - id: c3.2
    text: '- Designing, implementing, evaluating, documenting, evolving a software architecture'
  - id: c3.3
    text: '- Software Architectures and Domain-Driven Design'
  - id: c3.4
    text: '- Software Architectures and DevOps'
- id: c4
  text: Software Architectures in Practice - selected domains and case studies
  items:
  - id: c4.1
    text: '- Pervasive Computing, Internet of Things and Web of Things - with a focus on Digital Twins'
  - id: c4.2
    text: '- Enterprise Applications and Cloud Computing'
  - id: c4.3
    text: '- Autonomous/Intelligent Systems - with a focus on Intelligent Agents and Cognitive Architectures'
