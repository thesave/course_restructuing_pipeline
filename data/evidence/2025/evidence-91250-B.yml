bibliography: |-
  Slides of the course.

  Suggested reading:

  - C. M. Bishop, and H. Bishop, "Deep Learning: Foundations and Concepts (https://link.springer.com/book/10.1007/978-3-031-45468-4)", Springer, 2024.
  - F. Chollet, "Deep Learning with Python (2nd edition) (https://www.manning.com/books/deep-learning-with-python-second-edition)", Manning Publications Co., USA, 2021.
  - A. Zhang, Z. C. Lipton, M. Li, and A. J. Smola, "Dive into Deep Learning (https://d2l.ai/index.html)", 2020.
  - M. Elgendy, "Deep Learning for Vision Systems (https://www.manning.com/books/deep-learning-for-vision-systems)", Manning Publications Co., USA, 2020.
  - A. Geron, “Hands-on Machine Learning with Scikit-Learn, Keras, and TensorFlow: Concepts, Tools, and Techniques to Build Intelligent Systems (https://www.oreilly.com/library/view/hands-on-machine-learning/9781492032632/)”, O'Reilly Media, Inc., USA, 2019.
  - M. Nielsen, "Neural Networks and Deep Learning (http://neuralnetworksanddeeplearning.com/index.html)", 2019.
  - I. Goodfellow, Y. Bengio, and A. Courville, "Deep Learning (http://www.deeplearningbook.org/)", MIT Press, 2016.
