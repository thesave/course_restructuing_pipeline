outcomes:
- id: o1
  text: The course aims at providing advanced skills (both theoretical and practical) on machine learning
    and, in particular, on deep learning.
- id: o2
  text: At the end of the course the student will be able to
  items:
  - id: o2.1
    text: in-depth train and optimize deep learning approaches;
  - id: o2.2
    text: choose and customize the most appropriate techniques to be used in real application scenarios;
  - id: o2.3
    text: use advanced deep learning techniques.
contents:
- id: c1
  text: Introduction to deep learning
- id: c2
  text: Linear algebra, calculus and automatic differentiation
- id: c3
  text: Artificial neural networks
- id: c4
  text: Backpropagation
- id: c5
  text: Optimization algorithms
- id: c6
  text: Convolutional Neural Networks (CNN)
- id: c7
  text: Recurrent Neural Networks (RNN)
- id: c8
  text: Transformers
- id: c9
  text: AutoEncoders (AE)
- id: c10
  text: Generative models
- id: c11
  text: Reinforcement Learning (RL)
- id: c12
  text: Natural Language Processing (NLP) (a practical example)
