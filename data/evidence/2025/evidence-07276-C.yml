outcomes:
- id: o1
  text: At the end of the course, the student will have acquired the knowledge and understanding of the
    basic IT skills necessary for the use of common digital tools, the management of service information
    systems, and the use of the internet in research, medical informatics, telemedicine, and biomedical
    instrumentation.
contents:
- id: c1
  text: Basic Notions on Operating systems and computer architectures.
- id: c2
  text: Configuration and use of a PC connected to the Internet.
- id: c3
  text: Spreadsheets and search engines.
- id: c4
  text: Firms information systems, networks and Web infrastructure.
- id: c5
  text: Databases and SQL queries.
- id: c6
  text: Further insights will also be provided on medical devices and the application of artificial intelligence
    in the medical and physiotherapy context.
