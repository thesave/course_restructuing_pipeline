outcomes:
- id: o1
  text: At the end of the course, the student knows and can apply abstraction methods to interpret any
    kind of signal from a physical, social or cognitive environment, either inductively (pattern discovery)
    or deductively (pattern finding).
- id: o2
  text: The methods will leverage theoretical or experimental findings from philosophy, cognitive science,
    semiotics, and computer science.
contents:
- id: c1
  text: The course integrates computational and empirical approaches to investigate semantic universals
    across languages, modalities, cultures, practices, and neurocognitive systems.
- id: c2
  text: Students will engage in data-driven methods to analyze multimodal meaning-making processes.
- id: c3
  text: The curriculum balances theoretical frameworks with hands-on computational analysis, examining
    real-world phenomena like perspectivization, theory of mind, and conceptual blending through diverse
    methodological lenses.
- id: c4
  text: Assessment centers on a dedicated project integrating theoretical design with investigation techniques.
