outcomes:
- id: o1
  text: Students will learn basic concepts about the fundamental algorithms (divide and conquer, dynamic
    programming, greedy method, backtracking, local search) to solve well knwon computational problems,
    and the basic data structures and abstract data types (lists, queues, trees, graphs, etc.), as well
    as techniques (asymptotic notation, recurrences) for evaluation of computational complexity of algorithms
    (and computation complexity classes P, NP, NP-hard) and space complexity of algorithms execution (memory
    space).
- id: o2
  text: The course will offer the illustration of trade-offs and sinergies between algorithms and data
    structures, and a training on methodologies to realize the design of efficient algorithms and correspondingly
    appropriate data structures to solve both generalized and specific instances of computational problems,
    under pre-defined assumptions and requirements
contents:
- id: c1
  text: Basic data structures (List, Queue, Stack, Trees...)
- id: c2
  text: Computational Complexity
- id: c3
  text: Searching and Sorting Algorithms
- id: c4
  text: Sets, Dictionaries, Trees, Binary search, RB trees
- id: c5
  text: Heaps, Hash tables, Priority queues, Union-Find data structures
- id: c6
  text: 'Algorithmic techniques: divide et impera, greedy algorithms, dynamic programming,'
- id: c7
  text: 'Graphs and graph algorithms: depth-first visit and breadth-first visit,'
- id: c8
  text: Elementary graph algorithms, Minimum Spanning Tree, shortest paths algorithms
- id: c9
  text: Introduction to NP-completeness theory
