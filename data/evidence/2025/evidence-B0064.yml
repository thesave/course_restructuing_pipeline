outcomes:
- id: o1
  text: At the end of this course, the students will have a good knowledge and understanding of the fundamental
    principles of algorithmics and of programming in Python, with specific focus on problems with large
    amount of data.
- id: o2
  text: The students will be able to apply the acquired knowledge to read, write, and test programs using
    the Python programming language.
- id: o3
  text: Moreover, the student will be able to understand prototypes and programs written by other people.
- id: o4
  text: Thanks to the acquired knowledge, the student will be able to evaluate pros and cons of a prototype
    or of an implementation in the Python language of a program using typical algorithmic techniques to
    handle data structures coming from the web or from open repositories.
contents:
- id: c1
  text: To define a solid and homogeneous base of the structure of the computational process.
- id: c2
  text: To structure the concept of programming and of programming languages.
- id: c3
  text: Elaborate the concept of digital transformation.
- id: c4
  text: Evidence the concept of production of software, both from a organizational and from a cognitive
    viewpoint.
- id: c5
  text: Present how the use of computational thinking and of the informatics tools could help solving
    problems of organizing systems, of understanding complex structures, and of forecasting possible events.
- id: c6
  text: Use text processing and its understanding as a paradigmm of the process of digital transformation
