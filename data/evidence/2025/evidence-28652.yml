outcomes:
- id: o1
  text: Aim of the course is to provide the methodological tools which are necessary for the correct design
    and use of an information system and for the development of applications on a relational DBMS platform,
    and to provide some knowledge of the base technologies which are deployed in their implementation.
contents:
- id: c1
  text: Enterprise Information Systems and Data Base Management Systems (DBMS).
- id: c2
  text: Introduction to the fundamental concepts on information systems and relational data bases.
- id: c3
  text: 'Relational theory: basic definitions, relational algebra, normal forms.'
- id: c4
  text: 'The SQL language: DDL and DML.'
- id: c5
  text: Simple and complex queries (including grouping and nesting), views.
- id: c6
  text: SQL for applications.
- id: c7
  text: Technology of Relational Systems.
- id: c8
  text: The control of concurrent accesses and the management of transactions.
- id: c9
  text: Recovery of information after malfunctions.
- id: c10
  text: 'Advanced architectures: parallelism, replication.'
- id: c11
  text: 'Distributed data bases:'
- id: c12
  text: fragmentation, distributed transactions.
- id: c13
  text: Outline of physical organization (B+tree indexes, join methods, optimization).
- id: c14
  text: Design of Information Systems.
- id: c15
  text: Analysis of enterprise organization, requirements collection.
- id: c16
  text: 'The conceptual design of data: the Entity-Relationship model and the data schemata.'
- id: c17
  text: 'The flow and operation schemata: Data-Flow'
- id: c18
  text: Diagrams and Workflows.
- id: c19
  text: Design methodologies.
- id: c20
  text: Integrated design of data and functions. relational logical design.
- id: c21
  text: Design with ERP systems.
prerequisites:
- id: p1
  text: A prior knowledge and understanding of the basic organization and functionalities of a modern
    computer system is required to attend with profit this course.
- id: p2
  text: These notions are normally achieved by giving an exam of Foundations of Informatics.
- id: p3
  text: 'Fluent spoken and written Italian is a necessary pre-requisite: all lectures and tutorials, and
    all study material will be in Italian.'
bibliography: |-
