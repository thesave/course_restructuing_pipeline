outcomes:
- id: o1
  text: The course aims to train students in the critical use of information technologies and tools for
    the digital acquisition, processing and restoration of textual documents on various media.
- id: o2
  text: At the end of the course, students are acquainted with effective principles and methodologies
    for the acquisition and digital representation of images, and are able to prepare digitisation, restitution
    and enhancement activities for textual documents
contents:
- id: c1
  text: Topics covered
  items:
  - id: c1.1
    text: 'Digital Scenarios for Cultural Heritage: Issues and Problems'
  - id: c1.2
    text: Scenes, analogue images and digital images
  - id: c1.3
    text: Scanning processes and acquisition devices (flatbed and planetary scanners, digital cameras,
      digital backs)
  - id: c1.4
    text: Optical and interpolated resolution
  - id: c1.5
    text: Calibrating a scanner
  - id: c1.6
    text: Digitising a printed and handwritten text
  - id: c1.7
    text: Methodologies for verifying the quality of a digital image (histograms, distributions and information
      content)
  - id: c1.8
    text: Visualisation on any medium
  - id: c1.9
    text: Storage of digital images
  - id: c1.10
    text: Formats
  - id: c1.11
    text: Notes on the function of technical metadata
  - id: c1.12
    text: Use of nomenclature in logical structure
  - id: c1.13
    text: Dimensioning a digital collection (general considerations on the uncertainty of determining
      the exact storage space of a digital collection)
  - id: c1.14
    text: Critical analysis of the guidelines published by PND https://docs.italia.it/italia/icdp/
  - id: c1.15
    text: Critical analysis of technical specifications for digitization tenders
- id: c2
  text: Course objectives
  items:
  - id: c2.1
    text: 'Knowledge / skill: to be in possession of the necessary knowledge of the problems related to
      document digitisation techniques, digital image production and their relationship with traditional
      iconography; to be able to distinguish and use the main treatments of visual data with numerical
      calculation tools; to know the typical aspects of the conservation and valorisation of great iconographic
      heritages, highlighting the criticalities of long-term conservation and possible solutions'
  - id: c2.2
    text: 'Know-how: to be able to use computer technologies and tools for the acquisition and processing
      of digital images of textual documents and for their overall digital reconstruction; to deal with
      the various phases of a digitisation and enhancement project of documentary resources; to be able
      to draw up technical specifications for a digitisation project.'
  - id: c2.3
    text: 'Autonomy of assessment: to be able to check a Data Management Plan; to be able to adopt the
      technological tools for checking the quality of the digital images produced following the directives
      expressed by the new PND ''guidelines for the digitisation of cultural heritage''.'
  - id: c2.4
    text: 'Communication skills: to be able to illustrate with logical and terminological rigour issues,
      including technical issues related to document digitisation techniques.'
  - id: c2.5
    text: 'Learning skills: to be able to independently explore in depth the issues inherent to the discipline'
