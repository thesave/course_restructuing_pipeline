outcomes:
- id: o1
  text: At the end of the course, the student knows the principles and fundamental techniques underpinning
    the object-oriented programming paradigm as well as some basic notions of programming with scripting
    languages.
- id: o2
  text: The student is capable of implementing object-oriented programs, writing scripts and using some
    collaborative tools for software development.
contents:
- id: c1
  text: Introduction to object-oriented programming in Java
- id: c2
  text: Encapsulation
- id: c3
  text: Inheritance
- id: c4
  text: Polymorphism and subtyping relation
- id: c5
  text: Implementation and use of data structures in Java
- id: c6
  text: Introduction to programming in Python
- id: c7
  text: Use of data structures in Python (sequences, lists, dictionaries)
prerequisites:
- id: p1
  text: 'Note: students are expected to be familiar with the notion of partial order relation and with
    the principles of procedural/imperative programming in Java.'
