outcomes:
- id: o1
  text: Al termine del corso lo studente
  items:
  - id: o1.1
    text: conosce gli algoritmi per risolvere problemi computazionali di base su strutture di dati elementari;
  - id: o1.2
    text: conosce le tecniche di base per calcolare il costo computazionale degli algoritmi;
  - id: o1.3
    text: conosce le classi di complessità computazionale P, NP e NP-hard;
  - id: o1.4
    text: è in grado di progettare algoritmi efficienti per risolvere semplici problemi computazionali;
  - id: o1.5
    text: è in grado di stimare in ordine di grandezza il costo computazionale degli algoritmi;
  - id: o1.6
    text: è in grado di analizzare la complessità computazionale di problemi computazionali di base;
  - id: o1.7
    text: è in grado di dare una valutazione circa l'efficienza e la correttezza di un algoritmo;
  - id: o1.8
    text: è capace di elaborare e di presentare un progetto per la risoluzione di problemi computazionali
      di base
contents:
- id: c1
  text: Design and analysis of algorithms.
- id: c2
  text: Computational complexity.
- id: c3
  text: Orders of growth.
- id: c4
  text: Recurrence equations.
- id: c5
  text: 'Sorting algorithms: SelectionSort, InsertionSort, MergeSort, QuickSort, CountingSort, RadixSort.'
- id: c6
  text: 'Data structures: lists, queues, stacks .'
- id: c7
  text: Trees.
- id: c8
  text: Tree visits (preorder, inorder, postorder).
- id: c9
  text: Binary search trees and binary balanced search trees.
- id: c10
  text: Dictionaries.
- id: c11
  text: Hash tables.
- id: c12
  text: 'Heaps: HeapSort and Priority queues.'
- id: c13
  text: Union-find structures.
- id: c14
  text: 'Design techniques: divide-&-conquer, greedy, dynamic programming.'
- id: c15
  text: Graphs.
- id: c16
  text: DFS and BFS visits.
- id: c17
  text: 'Algorithms on graphs: Minimum Spanning Tree (Prim, Kruskal), Shortest Paths (Bellman-Ford, Dijkstra,
    Floyd-Warshall).'
- id: c18
  text: Complexity.
- id: c19
  text: The P and NP classes.
- id: c20
  text: NP-completeness.
- id: c21
  text: There are also practical lectures in which data structures are implemented and used, and the Object-Oriented
    paradigm as well as some Java notions are introduced.
