outcomes:
- id: o1
  text: Focus is on quantitative aspects of computer architecture.
- id: o2
  text: Expected outcome is understanding of
  items:
  - id: o2.1
    text: instruction level parallelism and latency tolerance
  - id: o2.2
    text: memory hierarchy
  - id: o2.3
    text: Uniform Memory Access (UMA) architectures
  - id: o2.4
    text: protection and task management
  - id: o2.5
    text: architecture impact on power and performance at processor and system level Within the course
      the student will practice abstraction as the most effective method to handle the complexity of modern
      computer architectures. The final test verifies the ability to apply methods and concepts offered
      by the course.
contents:
- id: c1
  text: Processor Architecture
  items:
  - id: c1.1
    text: Instruction set architecture for multitasking protected systems (Intel IA32 architecture)
  - id: c1.2
    text: Instruction level parallelism; dependencies; hazards; hazards avoidance
  - id: c1.3
    text: superscalar architectures; superpipelining and underpipelining; non blocking architectures;
      out of order execution (Tomasulo approach); speculative execution;
  - id: c1.4
    text: Introduction to simultaneous multithreading, logical processors, multicore architectures and
      virtualisation Memory Hierarchy
  - id: c1.5
    text: Goals, reference model and performance parameters
  - id: c1.6
    text: 'memory hierarchy in the Intel IA32 architecture: segmentation, virtual memory, main memory
      and caches'
  - id: c1.7
    text: address mapping, write policies, replacement policies; implementation techniques and performance
      analysis
  - id: c1.8
    text: the MESI protocol for memory coherence in shared memory multiprocessor architecture (UMA architectures)
      System Architecture
  - id: c1.9
    text: Interleaved memory access in multibyte data bus systems
  - id: c1.10
    text: Uniform Memory Access (UMA) architectures, and introduction to NUMA multicore based architectures
  - id: c1.11
    text: Bus hierarchy and bus protocols
  - id: c1.12
    text: 'Multimaster systems with DMA based I/O: hardware/software power/performance perspective'
