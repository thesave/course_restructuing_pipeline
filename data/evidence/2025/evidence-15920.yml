outcomes:
- id: o1
  text: At the end of the course the student will have general knowledge of Computational Sciences.
- id: o2
  text: He knows concepts relating to algorithms, methods and basic tools for Scientific Computing and
    applies them to the classification of simple problems, connected to his study and work activities.
- id: o3
  text: He is able to evaluate the efficiency of simple application programs, in particular for the management
    of texts and hypertexts and for the manipulation of medical images.
- id: o4
  text: He knows how to develop a basic IT approach for the solution of simple problems, which contribute
    to his academic and professional preparation.
- id: o5
  text: He knows how to correctly interpret the results obtained from the use of simple application programs,
    useful for carrying out his activities, both study and work.
