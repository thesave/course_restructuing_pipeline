outcomes:
- id: o1
  text: The student knows how to apply specific software and informatics programmes to language and communication
    ambits.
contents:
- id: c1
  text: This course aims at providing the student with an understanding of informatics, the Web, and artificial
    intelligence, with specific focus on its current applications.
- id: c2
  text: The topics addressed in the course are summarised as follow
  items:
  - id: c2.1
    text: Basics of informatics and historical introduction
  - id: c2.2
    text: 'Internet and the Web: basics of Web page design (HTML, CSS)'
  - id: c2.3
    text: The Semantic Web and basics of ontology and knowledge graph design
  - id: c2.4
    text: Artificial Intelligence (overview of applications and methods)
