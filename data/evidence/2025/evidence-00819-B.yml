outcomes:
- id: o1
  text: At the end of the course, the student will have a basic understanding of programming in the C
    language, as well as the ability to analyze some fundamental problems and their corresponding solution
    algorithms.
- id: o2
  text: After completing the course, the student has a strong knowledge of programming using C language
    and the analysis of some fundamental problems and related algorithms solvers.
contents:
- id: c1
  text: The Programming course aims to provide basic competence in computer programming.
- id: c2
  text: Initially, a basic description of the algorithmic approach to problem-solving using computers
    is provided.
- id: c3
  text: Subsequently, using the C language, which is described in detail regardless of any prior knowledge
    the students may have, some fundamental problems and some of the main and most interesting solving
    algorithms are analyzed.
- id: c4
  text: The C Language
  items:
  - id: c4.1
    text: 'Organization of computer memory: addresses, words, pointers.'
  - id: c4.2
    text: 'Data types: integers, floats, double, char, string. Data structures: arrays, matrices, lists.'
  - id: c4.3
    text: 'The C language: purposes and main characteristics.'
  - id: c4.4
    text: 'Structure of a C program: including headers, variable declarations, libraries.'
  - id: c4.5
    text: 'Elementary data types in C: integers, floating point, double, small int, long, char.'
  - id: c4.6
    text: Pointers and pointer arithmetic.
  - id: c4.7
    text: Arrays and matrices and their memory representation.
  - id: c4.8
    text: 'Complex data structures: lists, trees.'
  - id: c4.9
    text: Library functions and user-defined functions.
  - id: c4.10
    text: Parameter passing by value and by address to functions.
  - id: c4.11
    text: Recursive functions.
  - id: c4.12
    text: Input/output functions, file functions, functions for direct memory management, string functions.
- id: c5
  text: Algorithm Design and Analysis
  items:
  - id: c5.1
    text: 'Data types; algebraic specification and implementation: vectors, lists, stacks, queues.'
  - id: c5.2
    text: 'Algorithms with data structures: construction, search, and sorting in linear lists; management
      of queues and stacks.'
prerequisites:
- id: p1
  text: No prior knowledge of computer science is required.
