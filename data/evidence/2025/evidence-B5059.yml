outcomes:
- id: o1
  text: At the end of the course students are put in touch with the intangible cultural heritage mediated
    by computer science and expressed under the form of practices, representations and skills that the
    multimedia research community recognizes as part of its identity.
- id: o2
  text: Students are able to reflect upon and manipulate a variety of digital instruments, including objects,
    artifacts and cultural spaces, manifested through interactive multimedia signs and actions.
contents:
- id: c1
  text: Interaction Media Design focuses on the design of interactive applications in the humanities and
    specifically in the domain of Cultural Heritage.
- id: c2
  text: During the course, media are treated (images, audio, video, 3d, etc.), together with their acquisition
    and processing.
- id: c3
  text: Main design principles are discussed in relation with CH and cognitive sciences.
- id: c4
  text: The course is one of the modules of the exam "Digital Heritage and Multimedia".
- id: c5
  text: The second module (Museology, Museography and Virtual Environments), is held by prof.sa Tartarini.
- id: c6
  text: The course is divided in 6 areas
  items:
  - id: c6.1
    text: Cognitive-Emotional goals of Interactive Media Design
    items:
    - id: c6.1.1
      text: Distraction and Concentration, Meaningfulness, Transformation through Provocation, Sense of
        Belonging and Caring attitude, Memory and Recall, Authenticity, Embodiment, Language and Narration,
        Engagement, Empathy, The Perception of Cultural Heritage, Curiosity
  - id: c6.2
    text: Human Computer Interaction for Cultural Heritage
    items:
    - id: c6.2.1
      text: 'basics: what is interaction, interaction principles, how do we interact, WIMP paradigm: Device-based
        Interaction and Natural Interaction'
  - id: c6.3
    text: Digital Images and Digital Photography
    items:
    - id: c6.3.1
      text: 'principles, analog/digital, electromagnetic spectrum, colors and human vision, color in visualization,
        image processing and computer vision, intensity images, range images, pixels, bit depth, file
        formats /jpg, tiff, gif, png, raw/, rawtherapee (sw); Digital Photography: focus, slr/dslr camera,
        exposure, Shutter Speed, Aperture and F-number, Luminance, Focal length, Depth of Field, ISO'
  - id: c6.4
    text: 'Beyond Multimedia: from digital images to virtual experiences'
    items:
    - id: c6.4.1
      text: 'Computer Graphics: non interactive CG, interactive CG, 3d models, file formats, software;
        Image Based Modelling; Panoramas and Virtual Tours (Pano2VR); Videogames: design tools (Twine)'
  - id: c6.5
    text: Interactive Media Design principles and Tools
    items:
    - id: c6.5.1
      text: PACT frameworks, Egonomics, Mental Models, Personas, Metaphors, Requirements, Design Brief;
        Card Sorting, Visitor Box, Scenarios (role-play), Cultural Probes, Storyboards, Interactive Storytelling
        (Twine)
  - id: c6.6
    text: 'Hands-on: the Design Process'
- id: c7
  text: 'the Design Process: 1-Context definition, Star Assets and Target Audience; 2-Institutional Goals
    (Cognitive and Educational Goals); 3-Design Brief (motivations, barriers, capabilities, devices);
    4-Ideas generation and envisionment techniques: storyboarding (Twine) and virtual tours (Pano2VR);
    5-Distruption (constraints, negative experiences, beyond); 6-Revision and Evaluation; other envisionment
    techniques (low-fi prototypes); 10 golden rules of Interactive Media design for Cultural Heritage'
