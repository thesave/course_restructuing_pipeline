outcomes:
- id: o1
  text: At the end of the course, students will have acquired an in-depth knowledge of models and methodologies
    for the analysis and design of simple digital machines.
- id: o2
  text: 'Specifically, they will: understand digital representation of information; be familiar with design
    methodologies for combinational logic circuits; be able to apply graphical methods for the analysis
    and synthesis of simple combinational logic circuits;'
- id: o3
  text: know and be able to use the main combinational circuits(decoders, encoders, multiplexers, ROMs);
    know and be able to apply formal design methodologies for the analysis and synthesis of asynchronous
    sequential circuits; be familiar with the main binary memory elements (SR latch, D latch, D flip-flop);
    know notable synchronous sequential circuits (registers, shift registers, synchronizers, counters);
    be able to combine memory elements and notable circuits, both sequential and combinational, for the
    direct synthesis of medium-complexity synchronous sequential networks.
contents:
- id: c1
  text: The course is held in the second semester, from February to June.
- id: c2
  text: 'Design layers of a digital machine: block description of a machine and verbal description of
    its behavior. Signal classification. Logic circuits as networks of switches. Logic gates.'
- id: c3
  text: 'Binary representation of information. Properties of codes. Codes to represents texts and numbers.Classification
    of digital systems: combinational, asynchronous and synchronous circuits.'
- id: c4
  text: 'Combinational logic circuits. Functions, truth tables, and logic diagram views. Commutation Algebra:
    operations, expressions, and equivalence theorems. Design and analysis through canonical forms and
    standard forms. Real combinatorial networks: transient and steady-state behavior.'
- id: c5
  text: Gate-level minimization with Karnaugh maps.
- id: c6
  text: 'Standard combinational logic circuits: decoder and multiplexer. Design by means of decoders and
    OR gates. Shannon''s expansion theorem and design by means of multiplexers. Programmable circuits.
    ROM as programmable combinational circuits. Three-state buffer.'
- id: c7
  text: Binary arithmetic with unsigned and signed numbers. 2-complements representation for signed numbers.
    Half adder, full adder, and n-bit adder. Arithmetic-Logic Unit (ALU).
- id: c8
  text: The asynchronous sequential logic circuit as a combinational circuit with direct feedback. Behaviors,
    constraints for correct use and techniques aimed at a priori removal of undesired behaviors. Finite
    state machine (FSM); description of the behavior by means of state diagram and state table. Design
    and analysis of asynchronous sequential logic circuits.
- id: c9
  text: 'Asynchronous sequential logic circuits for binary memories: latches and flip-flops.'
- id: c10
  text: The synchronous sequential logic circuit as a combinational circuit with feedback loops based
    on flip-flops. Timing constraints to choose the clock period. Formal design method for circuits with
    D flip-flops.
- id: c11
  text: 'Standard synchronous circuits: registers, shift registers, and counters. Examples of design of
    synchronous logic circuits containing registers, counters, and shift registers and not based on the
    conventional graph-based method.'
