outcomes:
- id: o1
  text: At the end of the course, the student acquires the skills necessary for effective communication
    of cultural heritage, with particular emphasis on the use of digital technologies.
- id: o2
  text: They are able to effectively apply techniques of photogrammetry, structured-light scanning, and
    modeling for the three-dimensional reconstruction of cultural heritage objects and for their virtual
    restoration.
contents:
- id: c1
  text: 'Principles of communication, fundamentals of the semiotics of the sign, strategies and technologies
    for the communication of cultural heritage: digital images; principles of photogrammetry; principles
    of structured-light 3D scanning; 3D printing; 3D modeling; virtual tours; fundamentals of GIS and
    GIS-based web applications.'
