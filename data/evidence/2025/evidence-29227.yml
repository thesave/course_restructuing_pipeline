outcomes:
- id: o1
  text: The student is introduced to the principles, project methodologies and fundamental tools for the
    development of computer applications, investigating some classic computational problems, proceeding
    for each of them to the identification of suitable solution algorithms, formalized in terms of the
    C programming language.
- id: o2
  text: In addition, basic concepts of object-oriented programming with reference to C++ language.
- id: o3
  text: 'The student acquires: familiarity and mastery of the programming language; ability to translate
    a problem into an algorithm; ability to structure a program using classes and objects; theoretical
    aspects of computer science and computing systems.'
contents:
- id: c1
  text: List of topics
  items:
  - id: c1.1
    text: 'Introduction to modern elaboration systems: brief history of informatics, introduction to the
      von Neumann architecture and to the modern hardware devices, basic concepts of operating systems.'
  - id: c1.2
    text: Introduction to the concept of algorithm, Turing's specific and universal machines, problems
      solutions and (non) computable functions, high- and low-level programming languages, syntax definition
      by means of EBNF grammars.
  - id: c1.3
    text: 'Introduction to the C language: values, types, constants, variables, operators and expressions,
      pointers, arrays and strings, structures.'
  - id: c1.4
    text: 'Structural and procedural programming in C: control instructions, functions, procedures.'
  - id: c1.5
    text: 'Input and output in C: I/O primitives, I/O based on the stream abstraction, access to files.'
  - id: c1.6
    text: 'Principles and basic methodologies for designing and developing algorithms: solving small-scale
      problems, iteration and recursion, programs structured in many modules in the C language.'
  - id: c1.7
    text: 'Runtime structure of C programs: runtime representation of programs, activation records and
      functions.'
  - id: c1.8
    text: Dynamic allocation of memory for scalar types, structures and array; memory managing and memory
      leaking issues in C.
  - id: c1.9
    text: 'Ordering algorithms: Naive Sort, Bubble Sort, Insert Sort, Merge Sort, and Quick Sort.'
  - id: c1.10
    text: 'Introduction to Abstract Data Types (ADT): type definition and operations (constructors, selectors,
      predicates, functions and transformators). Some fundamentals ADT: lists, queues, stacks.'
