    evidence:
    - Classrooms and labs are interspersed each other, so that the introduction of a concept or an element
      of the language together with some examples is followed by a lab lesson, where the student is asked
      to use the acquired knowledge to solve problems using "programming in-the-small" techniques in C.
      For this reason, a content introduced within the Module 1 is usually tackled one week later within
      Module 2, so that the student is given enough time to acquire the new notions.
