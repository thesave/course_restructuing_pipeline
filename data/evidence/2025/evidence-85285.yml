outcomes:
- id: o1
  text: By the end of the course, the student knows the principles, the tools and the methodologies pertaining
    to computer programming.
- id: o2
  text: The successful student can find solutions to basic programming problems and to choose the best
    informatics tools to solve specific programming challenges.
- id: o3
  text: At the end of the hands-on lab, the student can program in at least one of the main languages
    used in bioinformatics.
contents:
- id: c1
  text: Introduction to Python.
- id: c2
  text: Simple numerical programs.
- id: c3
  text: Functions scoping and abstractions.
- id: c4
  text: Structured types, mutabilty and higher-order functions.
- id: c5
  text: Testing and debugging.
- id: c6
  text: Exceptions and assertions.
- id: c7
  text: Classes and object-oriented programming.
- id: c8
  text: A simplistic introduction to algorithmic complexity.
- id: c9
  text: Some simple algorithms and data structures.
- id: c10
  text: Dynamic programming.
- id: c11
  text: Stochastic programs, probability and distributions.
- id: c12
  text: Monte Carlo simulations.
- id: c13
  text: Sampling and confidence intervals.
- id: c14
  text: Understanding experimental data.
- id: c15
  text: Lies, damned lies, and statistics.
- id: c16
  text: Quick look at machine learning.
