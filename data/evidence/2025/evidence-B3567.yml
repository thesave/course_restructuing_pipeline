outcomes:
- id: o1
  text: At the end of the course the student is acquainted with the basic mathematical notions underlying
    quantum computing seen as an alternative computing paradigm, and knows how to implement quantum algorithms
    as families of quantum circuits.
- id: o2
  text: Moreover, he has an understanding of more advanced topics like quantum cryptography, quantum error
    correction, and the development of graphical languages for quantum circuits.
contents:
- id: c1
  text: First module
  heading: true
  items:
  - id: c1.1
    text: overview on quantum computing
  - id: c1.2
    text: 'mathematical background: linear algebra and complex Hilbert spaces'
  - id: c1.3
    text: qubits and their mathematical representation
  - id: c1.4
    text: 'a quantum computational model: quantum circuits'
  - id: c1.5
    text: sample circuits (Deutsch, Bernstein-Vazirani)
- id: c2
  text: Second module
  heading: true
  items:
  - id: c2.1
    text: quantum computational complexity
  - id: c2.2
    text: quantum algorithms (Simon, Grover, Shor)
  - id: c2.3
    text: quantum error correction
  - id: c2.4
    text: quantum protocols
  - id: c2.5
    text: overview on quantum programming and quantum graphical languages
