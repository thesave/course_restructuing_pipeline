outcomes:
- id: o1
  text: 'At the end of the course, the student will be acquainted with the basics of information representation,
    computation, algorithms, and computer programming (in particular: imperative, structured programming).'
- id: o2
  text: The student will be able to design and implement algorithms in a programming language.
contents:
- id: c1
  text: 'Introduction to informatics: an overview of the field.'
- id: c2
  text: 'Basics of computer architecture: Von Neuman architecture; main components of modern computers;
    software levels.'
- id: c3
  text: 'Representation of information: binary code; representation of numeric information (two''s complement,
    floating-point representation); representation of non-numeric information.'
- id: c4
  text: 'Introduction to algorithms, data structures, and programming: definition of algorithm; examples
    of algorithms; fundamental data structures; notations for representing algorithms (pseudo-code, flow
    diagrams); programming languages.'
- id: c5
  text: 'The C programming language: fundamental constructs of the language: types, values, operators,
    expressions, functions, control flow structures, cycles; structured programming; iteration and recursion;
    arrays e pointers; algorithms on arrays (reverse, ordering, search); strings of characters.'
