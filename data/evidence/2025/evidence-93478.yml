outcomes:
- id: o1
  text: 'At the end of the course the students will be able to implement algorithms addressing relevant
    computer vision tasks, such as: object detection, semantic segmentation, image and video captioning.'
- id: o2
  text: During the course they will learn the basics of image, video analysis and computer vision.
- id: o3
  text: They will gain knowledge about the design and implementation of convolutional neural networks,
    recurrent neural networks and how to combine them.
- id: o4
  text: During the course they will also acquire familiarity with the relevant frameworks used to design
    modern deep architecture.
contents:
- id: c1
  text: The course introduces concepts, and tools for the design and implementation of image acquisition,
    processing, and analysis techniques.
- id: c2
  text: 'List of the contents:'
- id: c3
  text: 'Image Formation and Acquisition: geometry of image formation; lenses; field of view and depth
    of field; image sampling and quantization.'
- id: c4
  text: 'Spatial Filtering: convolution and correlation; mean and Gaussian filtering; median filtering;
    bilateral filtering.'
- id: c5
  text: 'Edge Detection: image gradient; non-maxima suppression; Laplacian of Gaussian; Canny edge detector.'
- id: c6
  text: 'Local Invariant Features: detectors and descriptors; Harris corners; scale-invariant features;
    SIFT features.'
- id: c7
  text: 'Camera calibration: projective coordinates and perspective projection matrix; intrinsic and extrinsic
    camera parameters; Zhang''s algorithm.'
- id: c8
  text: 'Recall on Convolutional Neural Networks: filters, striding, and padding; Pooling Layers, Normalization
    Layers, successful CNN architectures.'
- id: c9
  text: 'Attention Mechanism: self-attention in RNN; Transformer architecture; Vision Transformer.'
- id: c10
  text: 'Object Detection: two-stages, one-stage, and anchor-free detectors; RoI pooling operator; feature
    pyramid networks.'
- id: c11
  text: 'Semantic Segmentation: fully convolutional networks; transposed and dilated convolutions; RoI
    Align operator; semantic, instance, and panoptic segmentation.'
- id: c12
  text: 'Metric Learning: deep metric learning; contrastive and triplet losses; application to different
    recognition/identification tasks.'
prerequisites:
