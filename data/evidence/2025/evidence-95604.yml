outcomes:
- id: o1
  text: At the end of the course the student knows the main technical problems and the related solution
    behind networking with particular reference to the Internet.
- id: o2
  text: The student can understand the functional principles of a network service and the related quality
    of service issues as well as the Internet protocol architecture and the main protocols.
- id: o3
  text: The student knows how to implement some basic network applications and is able to analyze a protocol
    behavior.
