outcomes:
- id: o1
  text: 'Students who successfully complete this module will be able to: 1.'
- id: o2
  text: Understand basic programming concepts and constructs such as strings numbers, assignments, sequential
    and selective executions, loops and functions; 2.
- id: o3
  text: Write short programs that use the fundamental program constructs including standard conditional
    and iterative control structures; 3.
- id: o4
  text: Write simple programs involving the drawing of basic geometric shapes; 4.
- id: o5
  text: Write basic animation programs; 5.
- id: o6
