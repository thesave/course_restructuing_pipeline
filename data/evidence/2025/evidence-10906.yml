outcomes:
- id: o1
  text: The student learns the fundamental principles of the relational data model and of the relational
    database management systems.
- id: o2
  text: In particular, the student will be able to understand the structure of a relational database,
    the integrity constraints on data and the SQL query language.
- id: o3
  text: Moreover, the student gains an introductory background in NoSQL architectures and non-relational
    data models.
contents:
- id: c1
  text: The relational model; the structure of the relational model, integrity constrints, Normal forms.
- id: c2
  text: 'The SQL language : Data definition and manipulation, Query databases'
- id: c3
  text: 'Main components of a RDBMS: Query Optimizer, Transaction Manager, Scheduler, Recovery Manager,
    Cache Manager, Storage Manager, Access Methods.'
- id: c4
  text: 'Relational database design: the Entity-Relationship model, introduction to requirement analysis
    and to conceptual database design. Logical database design. Normalization techniques.'
- id: c5
  text: Brief introduction to NoSQL Systems
