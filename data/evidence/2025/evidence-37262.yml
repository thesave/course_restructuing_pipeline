outcomes:
- id: o1
  text: At the end of the course, the student has a basic understanding of computational tools and terminology,
    including object oriented programming techniques.
- id: o2
  text: 'He is able to:'
- id: o3
  text: use programming languages to write small scale programs;
- id: o4
  text: understand programs written by others;
- id: o5
  text: map financial problems, such as pricing systems and risk measurement models, into computational
    solutions.
contents:
- id: c1
  text: Computer programming is a creative task that is learned through practice.
- id: c2
  text: It involves finding solutions to problems using programming languages.
- id: c3
  text: The course will introduce basic informatics concepts and terminology such as operating systems,
    networks, information systems, computer languages, interpreters, and compilers.
- id: c4
  text: Next, using the Python programming language, we will present programming techniques through an
    interactive, step-by-step approach.
- id: c5
  text: This will include introducing concepts and constructs of programming languages, such as variables,
    expressions, and statements; functions, conditionals, and recursion; iteration; data types; tables;
    CSV files; spreadsheet creation; and web scraping.
- id: c6
  text: Additionally, we will cover object-oriented programming, case studies, and methods for accessing
    financial data.
