outcomes:
- id: o1
  text: 'By the end of the course, the student is expected to master advanced techniques for organising
    the software development process, and in particular:'
- id: o2
  text: ability to set up, evolve, and maintain an agile development process, including build automation,
    multi-platform and multi-target testing, continuous integration, and continuous delivery;
- id: o3
  text: advanced knowledge of modern version control systems
- id: o4
  text: understanding of the software licensing (with a focus on open source products) and of the existing
    models of software versioning;
- id: o5
  text: capacity of performing a domain-first analysis in a technology-independent fashion, leveraging
    techniques of Domain-Driven (DDD) and Model Driven (MDD) development;
- id: o6
  text: 'knowledge of supporting tools for DDD/MDD: creation of domain-specific languages (DSLs) and corresponding
    code generators, development of language-internal DSLs in modern programming languages.'
