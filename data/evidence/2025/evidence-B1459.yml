outcomes:
- id: o1
  text: 'The course aims to educate students so that, at the end of the course, they: • know the main
    cognitive models that can explain how people develop software • are aware of the opportunities and
    limitations of applying artificial intelligence tools to software development • become familiar with
    how software engineering principles can guide the development of artificial intelligence-based systems
    • master the principles of blockchain and its applications • understand the role and potential of
    cryptocurrencies, and the issues associated with them in the development of software systems • are
    able to build complex production and product models by combining the various leading sectors of today''s
    production, with particular relevance to artificial intelligence, blockchain systems and cryptocurrencies'
contents:
- id: c1
  text: In recent years, there has been a substantial paradigm shift in software development, leading
    to a rethinking of processes and application areas.
- id: c2
  text: In particular, there has been a renewed interest in artificial intelligence, with a strong focus
    on the application of machine learning in prediction and quality models, and in the use of cognitive
    models to guide production processes.
- id: c3
  text: On the other hand, there has been a strong need to identify suitable software tools for managing
    data analytics platforms, which are increasingly complex and generate systems that initially appear
    to be impressive but are ultimately difficult to evolve.
