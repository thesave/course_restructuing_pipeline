outcomes:
- id: o1
  text: At the end of the course, the student understands how corpora and big data sets can be analyzed
    to derive strategic knowledge and data-driven decisions.
- id: o2
  text: The student is able to address the main data and text analytics tasks such as data selection,
    transformation, analysis and interpretation, moreover is able to leverage deep learning pipelines
    and advanced solutions for text mining and natural language understanding downstream goals.
contents:
- id: c1
  text: Module 1 - Text Mining and Large Language Models (Prof. Gianluca Moro (https://disi-unibo-nlp.github.io))
  heading: true
  items:
  - id: c1.1
    text: The module focuses on the following state-of-the-art deep learning advancements to cope with
      challenging and highly business demanded natural language processing and understanding tasks with
      core open source technologies
  - id: c1.2
    text: (see the virtuale space of the course (https://virtuale.unibo.it/course/view.php?id=70599) and
      our GitHub repo (https://disi-unibo-nlp.github.io/))
  - id: c1.3
    text: Neural Language Modeling Foundations Transformer Architecture, Pre-Training and Fine-Tuning
      Techniques, Decoding Strategies, Evaluation (Natural Language Generation Metrics, LLM-as-a-judge).
  - id: c1.4
    text: Large Language Models Scaling Laws, Prompting vs Fine-Tuning, Instruction Fine-Tuning, Preference
      Alignment, Efficient Attention Mechanisms (e.g., BigBird, Performer, Key-Value Caching, Multi-Query
      Attention)
  - id: c1.5
    text: Compression and Quantization Methods (GPTQ, AWQ, GGUF), Parameter-Efficient Fine-Tuning (e.g.,
      LoRA, QLoRA, GaLoRE, Prompt Tuning), Mixture-of-Experts, Vision-Language Models.
  - id: c1.6
    text: Knowledge-Enhanced Natural Language Processing. Retrieval-Augmented Generation (Chunking Strategies,
      Architectures) and VectorDBs, Agents and Tool Calling (Large Action Models - LAM), Graph Neural
      Networks, Graph Injection into Language Models for Trustworthiness.
  - id: c1.7
    text: Labs on real-world case studies and in enterprise settings with core technologies Python, Pytorch,
      HuggingFace, LlamaIndex
  - id: c1.8
    text: '- Prompting vs Full Fine-Tuning vs Parameter-Efficient Fine-Tuning for Dialogue Summarization;
      Foundational Multimodal Large Language Models for Visual Question Answering.'
  - id: c1.9
    text: '- Efficient, Retrieval-Augmented Conversational Agents for Qustion-Answering in the Legal Domain.'
  - id: c1.10
    text: '- Graph Learning, Embedding and Injection into Language Models for Semantics-Aware Lay Summarization;
      GraphRAG and Structured Query Generation to Interact with DBMS and Knowledge Graphs in Multi-Source
      Question Answering;'
  - id: c1.11
    text: '- Graph Verbalization into Large Language Model Prompts for Medical Question Answering.'
  - id: c1.12
    text: The module introduces also new published SOTA results in top-tier AI conferences for research
      and industrial projects, we also achieved on some of these topics (https://disi-unibo-nlp.github.io/applications/).
- id: c2
  text: Module 2 - Big Data Analytics
  heading: true
  items:
  - id: c2.1
    text: Data Mining in Big Data Environments
  - id: c2.2
    text: Maps and reductions in parallel programming. The MapReduce programming model.
  - id: c2.3
    text: The Hadoop implementation of MapReduce.
  - id: c2.4
    text: The Python API to the Spark system and examples of parallel programs.
  - id: c2.5
    text: The Machine Learning Library (MLlib) of Spark.
