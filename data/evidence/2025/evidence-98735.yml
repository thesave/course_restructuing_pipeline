outcomes:
- id: o1
  text: The focus of the course is on Phython coding & Data Science which have gained great popularity
    in the last few years, especially in the field of financial applications.
- id: o2
  text: Students will acquire a good knowledge of Coding with a special focus to financial application
    and frontier topics of green finance.
