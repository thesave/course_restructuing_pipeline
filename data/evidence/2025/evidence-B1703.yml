    text: 'Organising information: trees and graphs [Garcia Marquez and Euler]'
  - id: c8.36
    text: Genealogy and document markup
  - id: c8.37
    text: Tree
  - id: c8.38
    text: The city of Königsberg
  - id: c8.39
    text: Graph
  - id: c8.40
