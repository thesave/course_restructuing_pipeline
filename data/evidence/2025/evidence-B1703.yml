outcomes:
- id: o1
  text: At the end of the course, the student has the necessary IT background and an appropriate knowledge
    of programming languages.
- id: o2
  text: He can use the acquired knowledge to autonomously design algorithms and data structures.
- id: o3
  text: He knows how to work independently, but also to be part of a work group.
contents:
- id: c1
  text: The course is organised in two blocks.
- id: c2
  text: The first block (module 1) is organised in a series of lectures.
- id: c3
  text: Each lecture introduces a specific topic, includes mentions to some related historical facts and
    to people (indicated between squared brackets) who have provided interesting insights on the subject.
- id: c4
  text: The lectures are accompanied by several laboratory sessions, to be held with a computer, for learning
    the primary constructs of the programming language that will be used for implementing and running
    the various algorithms proposed.
- id: c5
  text: The second block (module 2) is organised in a series of practical hands-on sessions.
- id: c6
  text: In particular, each hands-on session will be held with a computer and includes laboratory activities
    based on existing tools that enable the experimentation with the topics introduced in the lectures
    in the first block.
- id: c7
  text: List of lectures
- id: c8
