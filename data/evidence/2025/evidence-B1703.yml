- id: c9
  text: Second block (module 2, April-May)
  items:
  - id: c9.1
    text: 'Strings: from basic constructs to advanced features'
  - id: c9.2
    text: Introducing regular expressions
  - id: c9.3
    text: Arrays and matrixes with numpy
