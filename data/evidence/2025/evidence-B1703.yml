prerequisites: []
bibliography: |-
  Lecture notes will be made freely available to students in the GitHub repository of the course (https://github.com/intro-prog/2025-2026) before the beginning of the course. Slides and any additional material will be made also available a few days before each lecture in the same repository.

  The following suggested readings could be helpful to students as background material, in order to practice basic terminologies of the course:

  - Peroni, S. (2020). Computational Thinking and Programming book. https://comp-think.github.io
  - Tagliaferri, L. (2018). How To Code in Python. ISBN: 978-0999773017. Full text available online (https://www.digitalocean.com/community/books/digitalocean-ebook-how-to-code-in-python).
  - Downey, A. B. (2015). Think Python. 2nd edition. O'Reilly. https://greenteapress.com/wp/think-python-2e/
  - Severance, C. R. (2016). Python for Everybody - Exploring Data Using Python 3. CreateSpace Independent Publishing Platform. https://www.py4e.com/book
