outcomes:
- id: o1
  text: 'By the end of the course the student is provided with basic information technology notions and
    ability to use basic software tools, including: operating systems, search engines, word processing,
    image manipulation and graphics, multimedia representation of data, including both proprietary and
    open source technologies.'
contents:
- id: c1
  text: The course will tackle advanced programming techniques.
- id: c2
  text: In particular, the course will be focused on Object-Oriented computing and Array-Oriented computing
    for scientific computing.
- id: c3
  text: Both paradigm will be investigated by using Python as the reference programming language.
- id: c4
  text: Accordingly, the students will be presented with the mail Python modules and libraries for scientific
    computing, such as, NumPy, Pandas, and SciPY.
- id: c5
  text: Finally, the Unified Modelling Language (UML) will be taught to provide the reference standard
    language to visualise the design of software application.
