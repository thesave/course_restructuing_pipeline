outcomes:
- id: o1
  text: Al termine del corso, lo studente conosce le tecnologie più importanti utilizzate in ambito World
    Wide Web. È in grado di scrivere documenti nei linguaggi del Web, di curarne l'aspetto visivo, di
    verificarne la correttezza e universalità, e di realizzare semplici applicazioni distribuite sul Web.
contents:
- id: c1
  text: Il corso si occupa delle principali tecnologie Web, con enfasi sia su aspetti teorici che pratici.
- id: c2
  text: Le lezioni sono divise in due parti, di cui la seconda opzionale per gli studenti che mutuano
    il corso, per le lauree in Lettere, Scienze della Comunicazione e Filosofia.
- id: c3
  text: 'Parte I: Tecnologie Web di base'
  heading: true
  items:
  - id: c3.1
    text: Princìpi ed evoluazione del World Wide Web, organismi e processi di standardizzazione
  - id: c3.2
    text: 'Protocolli e Architettura delle applicazioni: URI, HTTP, REST, progettazione API'
  - id: c3.3
    text: Linguaggi di markup e XML
  - id: c3.4
    text: HTML
  - id: c3.5
    text: CSS
  - id: c3.6
    text: Javascript e Ajax
- id: c4
  text: 'Parte II: Sviluppo backend e framework client-side'
  heading: true
  items:
  - id: c4.1
    text: 'Tecnologie server-side per applicazioni web: NodeJs e e framework server-side'
  - id: c4.2
    text: 'Introduzione ai framework client-side: Vue, React, Angular'
