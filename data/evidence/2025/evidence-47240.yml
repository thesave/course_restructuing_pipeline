outcomes:
- id: o1
  text: At the end of the course, the student is familiar with the main web stacks, LAMP and MEAN.
- id: o2
  text: They are able to develop web applications and services, both client-side and server-side.
- id: o3
  text: They know and can appropriately use the main frameworks and content management systems for web
    development.
- id: o4
  text: 'They also understand the key differences between the main types of mobile device applications:
    web apps, hybrid apps, and native apps.'
contents:
- id: c1
  text: Comparison of different Web Architectures and Solution Stacks
- id: c2
  text: MEAN stack solution, with an introduction to Node.js
- id: c3
  text: Introduction to Build Tools
- id: c4
  text: 'Supersets of Web Languages: TypeScript, SCSS, and SASS'
- id: c5
  text: LAMP Stack Solution, with a focus on PHP
- id: c6
