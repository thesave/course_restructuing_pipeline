outcomes:
- id: o1
  text: The student is expected to understand the functions and processes of transformations within the
    media industries and the innovations connected to new digital technologies applied to creative industries.
contents:
- id: c1
  text: The digital revolution has fundamentally reshaped our world, transforming how we create, distribute,
    and consume everything from news and entertainment to social connections.
- id: c2
  text: This course, Management of Digital Media, is an in-depth exploration of the economic principles
    and models that govern this new landscape.
- id: c3
  text: The course will be focused on two of the most important media industries, music and video.
- id: c4
  text: For each of them, it will be introduced and analyzed the value chain, all the relevant typologies
    of players and how the technological evolution and the changes in consumer habits are influencing
    the markets’ dynamics and their structure.
