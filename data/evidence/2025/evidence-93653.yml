outcomes:
- id: o1
  text: 'At the end of the course, the student possesses knowledge on: the basics for ICT, big data and
    IoT; the introduction to IoT, application scenarios, enabling definitions and technologies, cloud
    and fog computing; the main components of IoT solutions, big data and references to Artificial Intelligence;
    IoT and big data services from the product to the service, and application cases in smart agriculture.'
- id: o2
  text: 'The Graduate possesses the skills to: analyze and organize small big data and IoT projects for
    smart agriculture solutions.'
