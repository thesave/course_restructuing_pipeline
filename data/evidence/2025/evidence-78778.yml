outcomes:
- id: o1
  text: At the end of the course the students are able to use the main AI techniques to develop tools
    for solving real life applications.
- id: o2
  text: The students are able to understand and apply a wide range of techniques such as constraint programming,
    symbolic and sub-symbolic machine learning techniques, planning and swarm intelligence.
