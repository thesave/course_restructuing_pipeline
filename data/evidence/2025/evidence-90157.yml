bibliography: |-
  Open access articles and papers will be made freely available to students in the GitHub repository of the course (https://github.com/open-sci/2025-2026) during the course. Slides and any additional material
  will be made also available in the same
  repository.

  The GitHub repository of the Open Science course held in the previous year (https://github.com/open-sci/2024-2025) and the following open access book could be helpful to students as
  background material, in order to practice basic terminologies of the
  course:

  Bartling, S., Friesike, S. (2014). Opening Science. Cham, Switzerland: Springer. ISBN: 978-3-319-00026-8. DOI: https://doi.org/10.1007/978-3-319-00026-8

  Due to the practical focus of the course, preliminary knowledge and practice on computational thinking (e.g. algorithms, data structures, and algorithmic techniques) and programming topics (e.g. Python and basics of Javascript libraries for web and data development) is highly recommended.

  A minimal bibliography on the two topics mentioned above is:

  - Peroni, S. (2020). Computational Thinking and Programming book. https://comp-think.github.io
  - Tagliaferri, L. (2018). How To Code in Python. ISBN: 978-0999773017. Full text available online (https://www.digitalocean.com/community/books/digitalocean-ebook-how-to-code-in-python).
  - Gans, M., Hodges, T., Wilson, G. (2020). JavaScript for Data Science. ISBN: 978-0367422486. Full text available online (https://js4ds.org/).
  - Majorek, J. (2020). 19 Popular JavaScript Libraries for Data Visualization in 2021. https://www.monterail.com/blog/javascript-libraries-data-visualization
