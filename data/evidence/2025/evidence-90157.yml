outcomes:
- id: o1
  text: At the end of the course, the students knows the theoretical and social principles characterizing
    the Open Science movement, as well as the most common practices to set up and develop Open Science
    projects.
- id: o2
  text: The student is able to understand and use the main tools and techniques for gathering, analyzing,
    modifying, investigating open data of different domains, and to communicate the results of research
    works and experiments by means of typical and effective Open Science channels, such as the Web and
    Semantic Publishing technologies
contents:
- id: c1
  text: The course is organised in nine lectures and a final wrap-up session, and requires an active and
    intensive participation of the students for its entire duration.
- id: c2
  text: Each lecture is organised in three parts.
- id: c3
  text: In the first part (45 minutes), a theoretical and historical introduction about the specific topic
    of the lecture is provided.
- id: c4
  text: In the second part (45 minutes), a structured discussion on a scientific article provided by the
    professor in the previous lecture is organised.
- id: c5
  text: In the third part (one hour an half), all students and professor participate in an hands-on session
    based on existing tools that enable the experimentation and/or implementation of the project.
- id: c6
  text: Topics of the lectures
  items:
  - id: c6.1
    text: Introduction to Open Science
  - id: c6.2
    text: Reproducibility
  - id: c6.3
    text: FAIR and Open Data
  - id: c6.4
    text: Open Methodology
  - id: c6.5
    text: Open Peer Review
  - id: c6.6
    text: Open Source Software
  - id: c6.7
    text: Open Access
  - id: c6.8
    text: Open Metrics
  - id: c6.9
    text: Open Infrastructures
  - id: c6.10
    text: Wrap-up session
