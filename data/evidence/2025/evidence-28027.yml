outcomes:
- id: o1
  text: Knowledge of models and tools for organizing, managing and designing relational databases.
contents:
- id: c1
  text: 'Database Management Systems (DBMSs) Information Systems and the role of DBMSs. Basic functionalities
    of DBMSs: 3-tier architecture, languages, access and concurrency control, fault tolerance.'
- id: c2
  text: 'The Relational Data Model Basic concepts: domains, attributes, tuples and relations, 1NF relations,
    null values. Data constraints: on domains, tuples, keys, referential integrity.'
- id: c3
  text: 'The Relational Algebra Unary operators: selection, projection, and renaming. Binary operators:
    natural join, union, and difference. Derived operators: intersection, theta-join, and division. Algebra
    with null values: 3-valued logic, outer join. Expressions and basic equivalence rules.'
- id: c4
  text: The SQL (Structured Query Language) Language Data definition language (DDL) and definition of
    constraints. The "Select-From-Where" block. Ordering the result. Insert, delete, and update data.
    Aggregate queries. Nested queries. Definition of views and recursive queries. Granting and revoking
    authorities and privileges. Triggers. Transactions.
- id: c5
  text: Data Base Design Data-oriented design. Design steps. Conceptual and logical data models. Basic
    abstraction primitives.
- id: c6
  text: 'The Entity-Relationship (E-R) Model Basic elements: entities, relationships, attributes. Internal
    and external identifiers. Hierarchies.'
- id: c7
  text: Conceptual Design (hints) Collecting and analyzing requirements. Design strategies. Typical design
    patterns.
- id: c8
  text: 'Logical Design Mapping entities and relationships onto relational tables. Restructuring an E-R
    schema: dropping hierarchies, managing multi-valued attributes, choosing the principal identifiers.
    Optimization criteria: Workloads (data volumes and navigation schemas), redundancy analysis, partitioning
    and merging entities and relationships.'
- id: c9
  text: Normalization of Relational Schemas Functional dependencies and data anomalies. Normal forms (3NF
    and BCNF). Schema decompositions. Lossless and dependency preservation decompositions. Functional
    dependencies and E-R schemas.
