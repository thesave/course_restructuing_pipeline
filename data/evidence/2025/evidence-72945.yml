outcomes:
- id: o1
  text: The course aims to provide a rational view of the main issues involved in the design of real-time
    systems, emphasizing peculiar principles, implementation strategies, supporting environments and performance
    evaluation methods.
contents:
- id: c1
  text: 'An introduction to real-time systems: peculiar features and typical application domains.'
- id: c2
  text: Hard vs. soft real-time tasks.
- id: c3
  text: Temporal parameters and reference models for periodic, sporadic and aperiodic tasks.
- id: c4
  text: 'Real-time scheduling approaches: the clock-driven approach and the priority-driven approach.'
- id: c5
  text: 'Algorithms for scheduling hard real-time periodic/sporadic tasks: RM, DM, EDF and LSTF.'
- id: c6
  text: 'Server-based strategies for optimizing the response time of soft real-time aperiodic tasks: polling
    server, deferrable server, priority exchange server, sporadic server, constant utilization server,
    total bandwidth server.'
- id: c7
  text: 'Shared resources access protocols: priority inheritance protocol, priority-ceiling protocol,
    immediate priority-ceiling protocol, stack resource policy.'
- id: c8
  text: 'Pre-run-time schedulability analysis of systems that schedule tasks using static or dynamic priorities:
    processor-utilization analysis, response-time analysis, processor-demand analysis.'
- id: c9
  text: Exemplification of theoretical and methodological issues with reference to design patterns typical
    of the industrial automation application domain.
prerequisites: []
bibliography: |-
