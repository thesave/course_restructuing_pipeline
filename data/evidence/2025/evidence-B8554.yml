      to both 1 & 2 modules about safety at work, as per the Italian law.
    - Conversely, AI techniques are NEVER allowed during the lab sessions, nor are they allowed during
      the final examination in any way.
    - The student will be asked to leave the lab immediately and the exam will be considered as FAILED
      with no further discussion.
