outcomes:
- id: o1
  text: The course aims to provide an in-depth concptual & practical knowedlge about the basics concepts,
    methodologies, technologies and tools for the design and development of medium-size applications according
    to the object-oriented paradigm.
- id: o2
  text: At the end, the student
  items:
  - id: o2.1
    text: knows the methodological foundations for the analysis and development of object-oriented software
      applications
  - id: o2.2
    text: knows the corresponding techniques in depth both from the conceptual and practical viewpoints
  - id: o2.3
    text: is able to apply such knowledge and techniques to medium-size applications using the Java language
  - id: o2.4
    text: knows in depth the fundamental data structures and related algorithms
  - id: o2.5
    text: has the fundamental notions of functional programming in modern OO-blended languages (Java,
      Kotlin, Scala, C#)
  - id: o2.6
    text: is able to develop simple graphical user interfaces in JavaFX according to the event-driven
      programming pattern
- id: o3
  text: Throughout the course, while the Java language and platform are the main reference (and the only
    one required for assessment in the final examination), a multi-language approach is adopted when introducing
    concepts and constructs, presenting the Java approch in comparison with other object-oriented languages
    such as C#, Scala, Kotlin, so as to provide a broader view.
contents:
- id: c1
  text: Basic concepts of programming languages.
- id: c2
  text: Language families -- imperative, functional, logic, and object-oriented languages (5hrs).
- id: c3
  text: 'Introduction to Object-oriented software design in a multi-language perspective: singleton objects,
    abstract data types, classes and objects.'
- id: c4
  text: 'Basic concepts of the Java language and architecture: classes, instances, object construction
    and deletion, inheritance, polymorphism.'
- id: c5
  text: Abstract classes, interfaces, multiple inheritance.
- id: c6
  text: (30hrs + 12hrs lab)
- id: c7
  text: Lambda expressions and functional interfaces.
- id: c8
  text: (12hrs + 6hrs lab)
- id: c9
  text: Exceptions and exception handling.
- id: c10
  text: I/O streams and file access, object serialization.
- id: c11
  text: 'Data structures: lists, hashmaps, trees and related algorithms.'
- id: c12
  text: (20hrs + 12hrs lab)
- id: c13
  text: Introduction functional programming in general and specifically to Java streams.
- id: c14
  text: (3rhs)
- id: c15
  text: 'Basic elements for GUI construction in Java on the JavaFX platform: event-driven programming,
    event listeners.'
- id: c16
  text: (10hrs + 10hrs lab)
