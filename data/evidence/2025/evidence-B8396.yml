outcomes:
- id: o1
  text: 'By the end of the course, the student: understands the functionality of software for online information
    research and for creating text documents, spreadsheets, and presentations; is able to create a text
    document and apply the desired formatting; is able to use the basic functions of a spreadsheet; is
    able to create a professional presentation.'
contents:
- id: c1
  text: This Course is part of the Integrated Course "Transversal Skills".
- id: c2
  text: The Integrated Course aims to provide the student with fundamental competences in digital literacy,
    evidence-based approach, and personal and professional well-being.
- id: c3
  text: 'The Integrated Course "Transversal Skills" contributes to the achievement of the following ESEVT
    Day One Competences: 1.1, 1.2, 1.4, 1.5, 1.6, 1.8, 1.9, 1.10, 1.11, 1.12, 1.13, 1.14, 1.15.'
- id: c4
  text: Specific Course contents
  items:
  - id: c4.1
    text: '3h: usage of writing and presentation tools with a focus on formatting (Microsoft Word, Microsoft
      Power Point, Latex).'
  - id: c4.2
    text: 2h lecture + 1h practical
  - id: c4.3
    text: '3h: usage of spreadsheet (Microsoft Excel).'
  - id: c4.4
    text: 2h lecture + 1h practical
  - id: c4.5
    text: '2h: basics of generative artificial intelligence and prompt engineering (ChatGPT, Gemini, ...).'
  - id: c4.6
    text: 1h lecture + 1h practical
