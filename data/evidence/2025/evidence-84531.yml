outcomes:
- id: o1
  text: The class tends to enhance the capacity of orientating in the process of defining the strategies
    for a distributed system and applying them in different related applications.
- id: o2
  text: The students face the principles and the main problems of distributed large systems and are exposed
    to some standard and widely solutions, by following the class and via individual work.
- id: o3
  text: 'At the end, students are expected to be able to know the properties of most diffused middleware
    and the evolutions one can expect from that technology, by mastering the properties for designing
    a real application: most well spread strategies are presented and discussed.'
contents:
- id: c1
  text: 'The course covers several topics central in modern global data and processing infrastructures,
    such as Data Centers, MultiCloud Systems, Federation of resources, etc. typically supporting Industry
    5.0 and Smart city applications, via the following basic concepts:'
- id: c2
  text: Advanced models for large distributed & cloud systems, from C/S to message exchange. Particular
    importance is given to the distinction and the implications of the two models and their goals
- id: c3
  text: Replication, group and many-to-many communication, and systems for QoS
- id: c4
  text: Middleware for development and management of large distributed & cloud systems
- id: c5
  text: Infrastructures for global data storage and processing
- id: c6
  text: Specific modern systems for big data processing and scalable global supports
- id: c7
  text: All above issues are basic topics on which students must be aware of and very competent of, obtained
    by deep reflections and personal considerations.
- id: c8
  text: The class explores the following topics
- id: c9
  text: Advanced models for large distributed & cloud systems
  items:
  - id: c9.1
    text: 'Class Starting: general information and presentation of the Class (use cases)'
  - id: c9.2
    text: 'Goals, Basics, and Models: classifications, C/S vs. Message exchange, service and cloud models,
      parallelization models'
  - id: c9.3
    text: 'Middleware & Cloud Models: definitions, categories, basic organization, and patterns for large
      distributed and cloud systems, Cloud internals design.'
- id: c10
  text: Different consistency degrees and impact on service properties (BASE and CAP)
- id: c11
  text: 'Replication: models, strategies and protocols'
- id: c12
  text: 'Communication and groups: models, protocols and algorithms'
- id: c13
  text: Systems and protocols for QoS
- id: c14
  text: Multicast and MOM middleware
- id: c15
  text: Middleware for large distributed & cloud systems
  items:
  - id: c15.1
    text: 'CORBA: middleware and operating environment'
  - id: c15.2
    text: 'MOM: examples of very thin environments'
  - id: c15.3
    text: 'OpenStack: an example of a widely-diffused cloud IaaS'
- id: c16
  text: Novel infrastructures for global data storage and processing
  items:
  - id: c16.1
    text: 'Global data storage: solutions for non-traditional NoSQL data memorization (Cassandra and MongoDB)'
  - id: c16.2
    text: 'Global data processing: batching and streaming based big data processing (Map-Reduce, Spark,
      and Storm and S4)'
  - id: c16.3
    text: Main properties for effective design projects
