    evidence:
    - The course takes place in the first semester and is structured into in-class lectures and weekly
      lab exercises.
    - The lab exercises are designed to ensure that students fully acquire the expected competencies,
      particularly with regard to proving new theorems and writing recursive programs.
    - During the lab sessions, students can ask both the instructor and a lab assistant—who will always
      be present—for clarification and support.
