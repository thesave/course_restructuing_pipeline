outcomes:
- id: o1
  text: The student will learn the modern network programming and automation methodologies and the related
    enabling technologies.
- id: o2
  text: The student will learn how to use a platform for virtual network programming and automation in
    a cloud computing environment and a control plane for software defined networks.
- id: o3
  text: Moreover the student will learn how to use specific data models for the design and for the programming
    of network services, according to the current standards.
contents:
- id: c1
  text: Network Virtualization and cloud computing
  items:
  - id: c1.1
    text: 'Network virtualization: Linux namespaces, virtual bridges and virtual switches'
  - id: c1.2
    text: 'Virtual networking in cloud computing: examples with Docker and OpenStack'
- id: c2
  text: Software Defined Networking
  items:
  - id: c2.1
    text: SDN architecture
  - id: c2.2
    text: The OpenFlow protocol
  - id: c2.3
    text: Examples of SDN programming with OpenFlow
- id: c3
  text: Programming the data plane
  items:
  - id: c3.1
    text: The P4 language
  - id: c3.2
    text: Example of programming switches behavior with P4
