outcomes:
- id: o1
  text: The module aims to provide a common background on the requirements of the new participatory services,
    starting from an analysis of the main features of enabling technologies.
- id: o2
  text: It intends to experiment in a new and creative way enabling technologies and services through
    an open and living lab approach, encouraging participation and increasing the design capacity and
    working with new technologies.
- id: o3
  text: Students acquire skills on the topics of
- id: o4
  text: 'architecture of Web systems: servant customer models, execution models, protocols and Web environments,
    Web technologies, execution of components for fixed and mobile systems;'
- id: o5
  text: design of components for the supplying of services in fixed and mobile heterogeneous environments;
- id: o6
  text: usage patterns of services and technological support, integration of services in ecosystems oriented
    to the end user.
