- id: c2
  text: Module 2
  heading: true
  items:
  - id: c2.1
    text: 'Module Title: Design Process and User Research Methodologies'
  - id: c2.2
    text: 'Duration: 5 lessons (2 sessions per lesson, 3 hours each)'
  - id: c2.3
    text: 'Module Objective: Design a service concept based on user-centered research methodologies and
      design processes, culminating in strategic and operational deliverables useful for prototype development.'
  - id: c2.4
    text: 'Lesson 1: Introduction to User-Centered Design and Design Thinking Workshop'
  - id: c2.5
    text: Objectives
    items:
    - id: c2.5.1
      text: Understand key design methodologies and their role in the product development process.
    - id: c2.5.2
      text: Apply the complete Design Thinking process in a practical workshop.
- id: c3
  text: PART ONE
  heading: true
  items:
  - id: c3.1
    text: Introduction to User-Centered Design (UCD).
  - id: c3.2
    text: From HCI (Human-Computer Interaction) to UX (User Experience).
  - id: c3.3
    text: Overview of design frameworks (e.g., Double Diamond).
  - id: c3.4
    text: User Research methods.
- id: c4
  text: PART TWO
  heading: true
  items:
  - id: c4.1
    text: 'Full Design Thinking workshop: Empathize, Define, Ideate, Prototype, Test.'
  - id: c4.2
    text: 'Deliverable: None.'
  - id: c4.3
    text: 'Activities: Participation in the Design Thinking workshop.'
  - id: c4.4
    text: 'Lesson 2: Problem Exploration and Current Context Creation'
  - id: c4.5
    text: Objectives
    items:
    - id: c4.5.1
      text: Apply the Double Diamond framework to identify key problems and formulate a Design Challenge.
    - id: c4.5.2
      text: Create deliverables representing the current context and problem.
- id: c5
  text: PART ONE
  heading: true
  items:
  - id: c5.1
    text: Introduction to the first diamond of the Double Diamond (Discover and Define).
  - id: c5.2
    text: Qualitative research techniques
  - id: c5.3
    text: Semi-structured interviews.
  - id: c5.4
    text: Contextual Inquiry.
  - id: c5.5
    text: User Observation.
  - id: c5.6
    text: Creation of a User Research Plan.
- id: c6
  text: PART TWO
  heading: true
  items:
  - id: c6.1
    text: Synthesis of collected information
  - id: c6.2
    text: Proto Personas / Personas.
  - id: c6.3
    text: Experience Map (representation of the current context).
  - id: c6.4
    text: Deliverables
    items:
    - id: c6.4.1
      text: Proto Personas / Personas.
    - id: c6.4.2
      text: Experience Map.
  - id: c6.5
    text: Activities
    items:
    - id: c6.5.1
      text: Conducting field research activities.
    - id: c6.5.2
      text: Collaborative creation of Personas and Experience Maps.
  - id: c6.6
    text: 'Lesson 3: Synthesizing Results and Concept Ideation'
  - id: c6.7
    text: Objectives
    items:
    - id: c6.7.1
      text: Analyze and synthesize research findings.
    - id: c6.7.2
      text: Define key insights and transform them into design opportunities.
- id: c7
  text: PART ONE
  heading: true
  items:
  - id: c7.1
    text: Research findings synthesis (Empathy Mapping, POV, HMW).
  - id: c7.2
    text: Problem definition techniques
  - id: c7.3
