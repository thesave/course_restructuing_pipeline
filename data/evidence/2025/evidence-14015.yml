outcomes:
- id: o1
  text: At the end of the course the student
  items:
  - id: o1.1
    text: will be familiar with the mathematical foundations of modern cryptography
  - id: o1.2
    text: knows the basic public and secret keys cryptographic algorithms;
  - id: o1.3
    text: knows the basic cryptographic protocols;
  - id: o1.4
    text: is able to understand how modern cryptographic techniques work
    items:
    - id: o1.4.1
      text: is able to understand the fundamental security issues arising in a computer system
  - id: o1.5
    text: knows the basic results of information theory and data compression
  - id: o1.6
    text: is able to understand the connection between information theory and cryptography
