outcomes:
- id: o1
  text: At the end of the course, the student possesses the knowledge to understand the fundamental structure
    of the Internet as a packet-switched network and the main services offered by the World Wide Web such
    as e-mail, instant messaging, remote connections, the evolution of social network services or Web2,
    the processes of searching for information on the Web.
- id: o2
  text: The student also has basic knowledge of the use of spreadsheets (operations, functions, graphs),
    and database management (construction of tables, relations, masks, and queries).
