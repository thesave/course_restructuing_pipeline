outcomes:
- id: o1
  text: The course aims to provide fundamental knowledge on the main tools and methodologies for planning,
    developing, and evaluating software-based digital transformations, also using a very practical learning
    by doing approach with hands-on exercises in class.
- id: o2
  text: At the end of the course the student will be able to evaluate and apply the principles that guide
    the social, collaborative development process of software services and products for the digital transformation,
    in particular is able to define and analyze the requirements of a new service or digital product and
    to collaborate in an IT-type development process.
