outcomes:
- id: o1
  text: The student knows the basic theoretical aspects of Natural Language Processing (NLP); s/he is
    able to perform core NLP tasks, such as tokenisation, vectorisation and similarity computations; s/he
    is able to build and analyse corpora for the construction of prediction models; s/he is able to apply
    supervised models for typical NLP problems such as topic identification or sentiment analysis.
contents:
- id: c1
  text: Whereas the contents could be (slightly) adapted according to the students skills and interests,
    the general structure of the course will be as follows.
- id: c2
  text: Introduction to natural language processing
- id: c3
  text: Words and vector space model
- id: c4
  text: Naive Bayes
- id: c5
  text: Word vectors
- id: c6
  text: From counts to meaning
- id: c7
  text: Training and evaluation in machine learning
- id: c8
  text: Introduction to LSA
- id: c9
  text: Introduction to neural networks
- id: c10
  text: Word embeddings
- id: c11
  text: From document representations towards sequences
- id: c12
  text: Convolutional NNs for text
- id: c13
  text: Recurrent NNs for text
- id: c14
  text: Beyond
