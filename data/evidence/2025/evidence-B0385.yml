bibliography: |-
  1. Hobson Lane, Cole Howard, Hannes Hapke (2019). Natural Language Processing in Action Understanding, analyzing, and generating text with Python (https://www.manning.com/books/natural-language-processing-in-action). Manning Publications.

  Optional
  2. Dirk Hovy (2020). Text analysis in Python for social scientists (https://www.cambridge.org/core/elements/abs/text-analysis-in-python-for-social-scientists/BFAB0A3604C7E29F6198EA2F7941DFF3). Cambridge University Press.
  3. Kenneth Ward Church. Unix for poets. (https://www.cs.upc.edu/~padro/Unixforpoets.pdf)
  4. Dan Jurafsky and James H. Martin. Speech and Language Processing (http://web.stanford.edu/~jurafsky/slp3/)(3rd ed. draft) Draft chapters in progress, October 16, 2019
  5. Steven Bird, Ewan Klein, and Edward Loper. Natural Language Processing with Python (http://www.nltk.org/book/).
  6. Yoav Goldberg. (2017). Neural Network Methods for Natural Language Processing (G. Hirst, ed.). Morgan & Claypool Publishers.
  7. Emily M. Bender (2013). Linguistic Fundamentals for Natural Language Processing: 100 Essentials from Morphology and Syntax Synthesis Lectures on Human Language Technologies. Morgan & Claypool Publishers.
