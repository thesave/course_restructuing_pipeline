outcomes:
- id: o1
  text: The student is introduced to the presentation of the principles, of the project methodologies
    and of the fundamental tools for the development of computer applications, investigating some classical
    computational problems, proceeding for each of them to the identification of suitable algorithms,
    implemented in C programming language.
- id: o2
  text: The student acquires familiarity and mastery of the topics covered, combining the theoretical-methodological
    aspects with an intense experimental activity carried out in the laboratory.
contents:
- id: c1
  text: List of topics
  items:
  - id: c1.1
    text: Computer introduction, programming, algorithms, flowcharts, languages and development tools
      (compilation, linking)
  - id: c1.2
    text: Elements of computer architecture and machine language
  - id: c1.3
    text: Introduction to the C language - numerical data, variables, constants, identifiers
  - id: c1.4
    text: Representation of numerical and alphanumeric data
  - id: c1.5
    text: Elementary instructions, flow control and I / O
  - id: c1.6
    text: Vectors, strings and matrices
  - id: c1.7
    text: Functions and language libraries
  - id: c1.8
    text: Aggregate types
  - id: c1.9
    text: File management, command line input
  - id: c1.10
    text: Main algorithms for searching and sorting on vectors
  - id: c1.11
    text: Outline of dynamic allocation and recursion
  - id: c1.12
    text: Elements of cross-compilation and programming on embedded devices
  - id: c1.13
    text: Principles of operating systems (scheduler, concept of time sharing) and file system management
