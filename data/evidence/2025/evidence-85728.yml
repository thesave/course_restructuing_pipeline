outcomes:
- id: o1
  text: The course covers the fundamentals of modern real-time operating systems.
- id: o2
  text: Arguments that are addressed in the course are architecture, organization, and functionalities
    of modern operating systems, task management and resource allocation, mechanisms and tools for synchronisation
    and concurrent programming, characteristics of real-time operating systems and main scheduling algorithms
    for hard real-time periodic processes.
