outcomes:
- id: o1
  text: The aim of the course is to give the student a general overview about computers and scientific
    computing.
- id: o2
  text: After this introductory part, the course is focused on the C++ language and on numerical methods
    both at an elementary level.
contents:
- id: c1
  text: I. The Linux operating system
  items:
  - id: c1.1
    text: 'preliminary notions: shell use; basic commands; filesystem and partitions; operating system
      installation;'
- id: c2
  text: II. Introduction to C++
  items:
  - id: c2.1
    text: 'Fundamentals: variable and arithmetic expressions; for loops; if statements; constants: input
      and output; arrays; functions; passing arguments by reference; external variables and scope.'
  - id: c2.2
    text: 'Pointers and arrays: pointers and addresses; pointers and function arguments; address arithmetic;
      pointers and arrays; dynamic memory allocation; pointer arrays; pointers to pointers; multidimensional
      arrays; command line arguments;function pointers; void pointers.'
  - id: c2.3
    text: 'Classes: basics of classes; operator overloading; self referential classes.'
  - id: c2.4
    text: 'Header files and libraries: header files; conditional inclusion; compiling multiple files;
      the Makefile.'
  - id: c2.5
    text: 'Toward numerical applications: sources of errors: absolute, relative and percentage errors;
      numerical cancellation and error propagation; machine precision and significant digits.'
- id: c3
  text: III. Introduction to numerical methods
  items:
  - id: c3.1
    text: 'Function approximation: Lagrangian interpolation, Taylor polynomial and series.'
  - id: c3.2
    text: 'Finite difference methods: approximation of the first, second and n-th derivative with backward
      and forward finite differences, with first and second order truncation error; approximation of the
      first, second and n-th derivative with centered finite differences. ODE of the second order.'
  - id: c3.3
    text: 'Root-finding algorithms: solution of linear system with Gauss method. Non linear equation:
      bisection and Newton-Raphson''s (tangent) method. The secant method and Regula Falsi method.'
  - id: c3.4
    text: 'Numerical integration: rectangle rule, trapezoidal rule, Simpson''s formula. Gauss quadrature.
      Local and global truncation error and order of convergence.'
