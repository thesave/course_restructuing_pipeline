outcomes:
- id: o1
  text: The student is familiar with key digital tools for file management, computer-assisted translation
    (CAT) and AI-enhanced translation, including Machine Translation (MT); they can use CAT tools effectively,
    apply basic prompting techniques for AI-driven translation tools, and work with MT engines; they can
    vouchsafe translation quality and post-edit texts efficiently and accurately across various text types
    and domains, adapting them to different audiences, as needed; they can set up, manage, and evaluate
    projects involving other professionals that combine CAT, MT, post-editing, and AI tools; they can
    expand and refine their knowledge of CAT, AI and post-editing autonomously, applying it to new AI-driven
    practices, in line with professional ethics and industry standards.
contents:
- id: c1
  text: 'The "Computer-aided human translation: CAT, MT and AI " (CatMAI) module is delivered in the second
    semester and is one of the two modules that make up the "Technologies for Translation" course, together
    with "Information Mining and Terminology", which is delivered in the first semester and which is held
    by Prof. Adriano Ferraresi (https://www.unibo.it/sitoweb/adriano.ferraresi/didattica/2025).'
- id: c2
  text: The first part offers a theoretical introduction to the notion of computer-assisted translation.
- id: c3
  text: Subsequently some of the most common CAT tools are presented (Trados Studio, MemoQ, MateCat),
    proprietary and free.
- id: c4
  text: In particular, the module focuses on the translation of the main file formats, the creation and
    managing of translation memories and the quality assurance of target texts (QA check).
- id: c5
  text: The basis for managing complex translation projects involving different professionals (Project
    Management) through CAT are also provided.
- id: c6
  text: Finally, the latest CAT tool functionalities that integrate generative artificial intelligence
    (AI) to optimise workflows in both translation and revision will be presented.
- id: c7
  text: The second part, which is linked to the first one, starts with a presentation of the obvious advantages
    of using AI-enhanced translation, including machine translation (MT) accompanied by post-editing.
- id: c8
  text: It will also focus on the possibilities of integration between CAT and MT systems and AI-based
    generative translation functionalities included in CAT software.
- id: c9
  text: With regard to PE, different ways of intervention (light, full, etc.) are discussed in relation
    to variables such as the specific conditions of the revision task, the post-editor profile (bilingual,
    monolingual of the target language, expert in the field, etc.), the type of translation, the publication
    venue and the circulation methods planned for the revised target text, its potential readers and users,
    etc. Various PE strategies allowing for the improvement of the raw output provided by MT and generative
    AI systems are also presented.
- id: c10
  text: The aim of these strategies is to obtain a target text which meets the specific requirements of
    the translation context.
- id: c11
  text: Basic prompting techniques that can be used within AI-based translation tools, both to optimise
    the raw output of a machine-translated text and to post-edit it, will also be introduced.
