outcomes:
- id: o1
  text: At the end of the course, students will be acquainted with basic knowledge of the object-oriented
    paradigm of software construction, of its basic design patterns, its incarnation in the Java programming
    language and the corresponding framework, including advanced aspects like GUIs, multi-threading and
    events.
contents:
- id: c1
  text: Basic elements of object-oriented programming and design
- id: c2
  text: 'The case of the java programming language: overview and development tools'
- id: c3
  text: 'Basic functionality: classes, objects, methods, fields, and instantiation'
- id: c4
  text: 'Polimorphism, inheritance, reuse:: interfaces and abstract classes'
- id: c5
  text: 'Advanced aspects: generics, annotations, exceptions, inner classes, lambda expressions'
- id: c6
  text: Basic libraries for program construction
- id: c7
  text: I/O management and graphical interfaces
- id: c8
  text: Elements of concurrency programming in Java
- id: c9
  text: Brief overview of design patterns and techniques of effective programming
- id: c10
  text: 'Development tools: JDK, VSCode, Git'
