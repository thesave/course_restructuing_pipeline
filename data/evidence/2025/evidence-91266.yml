outcomes:
- id: o1
  text: At the end of the course, the student masters the most popular modern machine-learning approaches
    to computer-vision tasks, with particular reference to specialized deep-learning architectures.
- id: o2
  text: The student has both a theoretical understanding and the necessary practical skills required to
    develop state-of-the-art image and video analysis systems for real-world applications.
contents:
- id: c1
  text: The course is held in the first semester, from September to December.
- id: c2
  text: 'Advanced CNNs: : ResNeXt and grouped convolutions, MobileNets, EfficientNet and RegNet.'
- id: c3
  text: Attention and vision Transformers. Transformers and atttention. Image classification architectures
    based on Transformers.
- id: c4
  text: Object detection. Introduction to ensemble learning via boosting. The Viola-Jones detector and
    its applications. Specialized NN architectures for object detection. Two-stages, one-stage, and anchor-free
    detectors. Feature Pyramid Networks. Imbalanced learning and the focal loss. DEtection TRansformer
    (DETR) and the Hungarian loss. Hands-on session on object detection.
- id: c5
  text: Semantic/instance/panoptic segmentation. Ensemble learning via bagging and random forests. The
    algorithm behind the Kinect body part segmentation. Transposed and dilated convolutions. Fully Convolutional
    Networks, U-net, DeepLab. Instance segmentation and Mask R-CNN. Panoptic segmentation, MaskFormer.
- id: c6
  text: 'Depth estimation from monocular images: photometric loss and Monodepth.'
- id: c7
  text: Metric and representation learning. Deep metric learning and its applications to face recognition/identification
    and beyond. Contrastive and triplet loss, ArcFace, NT-Xent loss, CLIP. Hands-on session on metric
    learning.
- id: c8
  text: 'Image generation with GANs and diffusion models: metrics for generative tasks. Generative Adversarial
    Networks and Denoising Diffusion Probabilistic Models. Stable diffusion and text-guided image generation.
    Hands-on session on textual inversion.'
prerequisites:
- id: p1
  text: 'Computer vision and image processing: image formation, image digitization, camera modelling and
    calibration, basic image manipulation and processing, local image features.'
- id: p2
  text: 'PyTorch: a good intro is available at https://pytorch.org/tutorials/beginner/basics/intro.html'
- id: p3
  text: 'Machine learning: supervised versus unsupervised learning, classification versus regression,
    underfitting and overfitting, regularization; data split in training, validation and test sets; hyper-parameters
    and cross-validation.'
- id: p4
  text: If you attended Computer Vision and Image Processing, you already fulfill these prerequisites.
- id: p5
  text: If you didn't, you can find on Virtuale slides and lab sessions.
