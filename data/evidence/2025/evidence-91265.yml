outcomes:
- id: o1
  text: At the end of the course, the student knows some (semi-)automated methods for joint interpretation
    of data and content as sources of knowledge.
- id: o2
  text: The student masters the basics of knowledge extraction, engineering, and linking, making data
    suitable to machine querying and automated reasoning, typically on decentralized platforms such as
    the Web.
