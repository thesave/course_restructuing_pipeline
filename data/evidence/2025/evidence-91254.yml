outcomes:
- id: o1
  text: At the end of the course, the student masters the basic algorithms, tools and systems for the
    management, processing and analysis of digital images.
- id: o2
  text: The student is able to design and develop simple systems oriented to real-world computer vision
    applications such as those requiring segmentation and classification of objects in digital images.
contents:
- id: c1
  text: 'Introduction: basic definitions related to computer vision.'
- id: c2
  text: An overview across major application domains.
- id: c3
  text: 'Image formation and acquisition: geometry of image formation; lenses; field of view and depth
    of field; image sampling and quantization.'
- id: c4
  text: 'Spatial filtering: linear shift-invariant operators; mean and Gaussian filtering; median filtering;
    bilateral filtering.'
- id: c5
  text: 'Edge detection: image gradient; non-maxima suppression; Laplacian of Gaussian; Canny edge detector.'
- id: c6
  text: 'Local invariant features: detectors and descriptors; Harris Corners; scale-invariant features;
    SIFT features.'
- id: c7
  text: 'Instance detection: pattern matching; shape-based matching; Hough transform.'
- id: c8
  text: 'Camera calibration: Intrinsic and extrinsic camera parameters; projective coordinates and perspective
    projection matrix; Zhang''s algorithm; image warping and homographies between cameras.'
- id: c9
  text: 'Image classification: the case for and implication of data-driven computer vision; datasets;
    linear classifier as template matching; cross-entropy loss; gradient descent and stochastic gradient
    descent.'
- id: c10
  text: 'Image representations: Bag of Visual Words; representation learning for images; convolutional
    layers; pooling; batch normalization.'
- id: c11
  text: 'Successful CNNs: LeNet5; AlexNet; ZFNet; VGG; Inception v1 and v3; ResNet.'
- id: c12
  text: 'Regularization and training recipes: model capacity; learning rate schedulers; weight decay;
    label smoothing; dropout; data augmentations; FixRes; cutout; mix-up; cut-mix; PyTorch case study.'
- id: c13
  text: The theory is complemented by lab sessions.
- id: c14
  text: Lab sessions cover selected topics such as spatial filtering, camera calibration, local invariant
    features, image classification and transfer learning.
