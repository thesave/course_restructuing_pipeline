outcomes:
- id: o1
  text: At the end of the course the student understands the basics of computer programming.
- id: o2
  text: The student knows the types of programming languages and understands why they are essential for
    interacting with computers.
- id: o3
  text: 'The student knows the main tools that are used for programming activities: editor, compiler,
    development environment; understands what are the effects of the main Python operations in terms of
    syntax and semantics.'
- id: o4
  text: The student can solve exercises on the course topics, read Python programs of low or medium complexity,
    and understand what are their purposes.
- id: o5
  text: The student can analyse data and design small applications written in Python starting from the
    description of a problem or from portions of existing code.
contents:
- id: c1
  text: The course discusses the following topics
  items:
  - id: c1.1
    text: Algorithms and programming languages
  - id: c1.2
    text: 'Data models and formats: basic data types, data types for the Web (JSON, CSV, …)'
  - id: c1.3
    text: 'Basics of programming in Python: data types, functions, comparison, conditional and iterative
      constructs, exception handling, testing and debugging'
  - id: c1.4
    text: 'Data exploration with Pandas: Series e Dataframe, data manipulation (indexes, selection, aggregation,
      sorting, etc.)'
  - id: c1.5
    text: 'Data visualization with Seaborn: relational, distribution and categorical plots'
  - id: c1.6
    text: 'Machine Learning with Python: problem types (classification, regression, clustering), learning
      types (e.g. supervised vs unsupervised), performance evaluation (validation), classifiers and neural
      networks'
