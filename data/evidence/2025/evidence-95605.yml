outcomes:
- id: o1
  text: At the end of the course, the student knows the most important technologies used in the World
    Wide Web and in the mobile context.
- id: o2
  text: The student knows platforms and systems that can be used to design and develop Web sites and applications.
- id: o3
  text: The students is able to create web documents and simple distributed web and mobile applications,
    defining a friendly user interface on the basis of the human computer interaction methodologies.
contents:
- id: c1
  text: The course is composed of two modules, one related to the web technologies (such as HTML, CSS);
    the other focuses on the mobile ecosystem.
- id: c2
  text: Main contents of this class are the following ones
  items:
  - id: c2.1
    text: Evolution of the web and mobile technologies
  - id: c2.2
    text: Introduction to the main mobile operating systems
  - id: c2.3
    text: Web and mobile architectures
  - id: c2.4
    text: 'Web standards and technologies: HTTP, URI, HTML5, CSS3'
  - id: c2.5
    text: Frameworks, platforms and tool for Web and mobile development
  - id: c2.6
    text: User interface and interaction for the Web and for the mobile ecosystem.
