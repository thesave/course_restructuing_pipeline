outcomes:
- id: o1
  text: 'The course has a dual purpose: (1) understand NoSql architectures and get familiar with the design
    of non-relational data models; (2) deepen the knowledge of relational DBMSs and improves her practical
    capabilities.'
- id: o2
  text: In both cases the theoretical knowledge will be combined with practical skills through laboratory
    activities
contents:
- id: c1
  text: NoSQL DBMS Design --------------
  items:
  - id: c1.1
    text: Modelli dati non relazionali (Document-based, Graph-based, Column oriented)
  - id: c1.2
    text: 'Architetture per DBMS non relazionali: Cluster, Sharding e persistenza'
    language: it
  - id: c1.3
    text: Progettazione dei dati in DBMS NoSQL
    language: it
  - id: c1.4
    text: Esercitazioni di laboratorio con MongoDB
    language: it
- id: c2
  text: Relational DBMSs Management and Programming ----------
  items:
  - id: c2.1
    text: Database administration
  - id: c2.2
    text: Database programming and active database
  - id: c2.3
    text: Provisioning and resource optimization
