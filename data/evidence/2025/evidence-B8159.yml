bibliography: |-
  Course slides and exercises are available on Virtuale [http://virtuale.unibo.it/] .

  All books are optional.

  Recommended on the R language:

  - Muggeo, V. (2005). Il linguaggio R : concetti introduttivi ed esempi. Disponibile come E-book (Cercare nel Catalogo del Polo Bolognese SEBINA YOU [http://sol.unibo.it.ezproxy.unibo.it/SebinaOpac/SebinaYOU.do] )

  Statistical processing with R in more depth (in English):

  - Fischetti, T. (2015). Data Analysis with R. United Kingdom: Packt Publishing. Disponibile come E-book (Cercare nel Catalogo del Polo Bolognese SEBINA YOU [http://sol.unibo.it.ezproxy.unibo.it/SebinaOpac/SebinaYOU.do] )

  The SQL language in more depth:

  - Van der Lans, R. F. (2001). Introduction to SQL.
