outcomes:
- id: o1
  text: At the end of the course, the student is familiar with the architecture of a computer and understands
    the basic elements of programming and relational database querying.
- id: o2
  text: The student is able to
  items:
  - id: o2.1
    text: develop simple programs and queries with particular focus on examples of statistical processing
  - id: o2.2
    text: use the R and SQL languages.
