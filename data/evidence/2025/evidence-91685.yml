outcomes:
- id: o1
  text: On completion of the course the student will know and be able to describe the main ideas that
    led to the stored-program electronic computer.
- id: o2
  text: He/she knows the milestones in the creation and development of computer science in the second
    half of the last century and can recognise how these have influenced contemporary computer science.
contents:
- id: c1
  text: This course will present some milestones in the construction of the current form of computer science.
- id: c2
  text: We will introduce the main ideas, thought patterns and principles that have contributed to the
    birth and evolution of certain areas of computer science, through certain architectures, machines
    and languages, but without dwelling too much on their details.
- id: c3
  text: The reference period is from 1945 (first general purpose programmable electronic computer) to
    the early 1980s.
- id: c4
  text: In the various (temporal or conceptual) segments, we will see the evolution of architectures,
    operating systems and programming languages, showing how these topics are interconnected.
- id: c5
  text: Given the lecturer's expertise, programming languages will receive special attention.
- id: c6
  text: 'Introduction: what it means to ‘do computer science history’'
- id: c7
  text: 'Prehistory: before 1945'
- id: c8
  text: First programmable electronic computers
- id: c9
  text: 'Calculators find a market, indeed more than one: the 1950s'
- id: c10
  text: Mainframes and the birth of computing as a discipline
- id: c11
  text: Mini-computers and microprocessors
- id: c12
  text: Communicating and collaborating
- id: c13
  text: Personal computers
