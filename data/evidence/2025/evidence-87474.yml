outcomes:
- id: o1
  text: At the end of the course, students got acquainted with the fundamental issues of distributed systems,
    the computational models capturing their essence, and the technologies currently helping facing them
    in the most systematic and effective way.
- id: o2
  text: In particular, students become familiar with the fittest solutions, technologies, architectures,
    and methodologies to design distributed systems, and is capable of devising out the most critical
    aspects of distributed systems coming from physical distribution determining the most proper methodological
    approaches selecting the fittest technologies for implementing the solutions detected
