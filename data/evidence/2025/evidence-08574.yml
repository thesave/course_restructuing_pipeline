outcomes:
- id: o1
  text: At the end of the course, the student knows the fundamental concepts and algorithms in use in
    modern operating systems.
- id: o2
  text: The student also learns how to use programming languages, mainly those based on objects, to handle
    concurrency and distribution and to program services
contents:
- id: c1
  text: Introduction to operating systems (OS)
- id: c2
  text: Summary of concepts of architecture of computing systems
- id: c3
  text: General organisation of an OS
- id: c4
  text: Processes and threads
- id: c5
  text: Concurrency and communication
- id: c6
  text: CPU Scheduling
- id: c7
  text: Memory management
- id: c8
  text: File systems
- id: c9
  text: Concepts of distributed systems
- id: c10
  text: Distributed comunication
- id: c11
  text: Protection, security and cryptography
