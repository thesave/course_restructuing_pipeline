  laboratory:
    value: true
    evidence:
    - The course is organized on class lectures and on laboratory sessions.
    - These two activities are strictly intertwined so that the lab hours are devoted to the explained
      topics presented in class at the same time.
    - Lab proposals are presented in class and students are requested to solve them in groups so to practice
      their capacities in coordination and work teams, as a way of verifying design skills and enhancing
      their capacities, in the direction of the final test.
    - The lab sessions, highly recommended, tend to put together exactly the same environments of the
      final test (part in C and part in Java ).
    - Any student is responsible of her/his environment and of its correctness and usability during lab
      and exam tests.
