outcomes:
- id: o1
  text: At the end of the course, the student knows the high-level principles and the historical and theoretical
    backgrounds for solving problems efficiently using computational tools and information-processing
    agents, as well as the theoretical and practical groundings for modelling, gathering and managing
    data using computational techniques.
- id: o2
  text: The student is able to understand and use the main data structures for organising information,
    develop algorithms for addressing computational-related tasks, implement such algorithms in a specific
    programming language, write and share data using standard formats for spreadsheet and Web consumption,
    understand and create databases through database management systems, retrieve data using appropriate
    query languages, build and interpret graphs showing basic descriptive statistics computed from data,
    and develop and integrate data-driven workflows into software applications.
contents:
- id: c1
  text: The course is organised in two blocks.
- id: c2
  text: The first block (module 1) is organised in a series of lectures.
- id: c3
  text: Each lecture introduces a specific topic, includes mentions to some related historical facts and
    to people (indicated between squared brackets) who have provided interesting insights on the subject.
- id: c4
  text: The lectures are accompanied by several hands-on sessions for learning the primary constructs
    of the programming language that will be used for implementing and running the various algorithms
    proposed.
- id: c5
  text: The second block (module 2 and 3) is organised in a series of theoretical lectures and hands-on
    sessions.
- id: c6
  text: In each lecture, it is provided a theoretical introduction about the specific topic of the lecture.
- id: c7
  text: In each hands-on session to be held with a computer, it is run a laboratory activity session based
    on existing tools that enable the experimentation with the topics introduced in the theoretical lectures.
