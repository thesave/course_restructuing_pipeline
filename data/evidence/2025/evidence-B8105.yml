prerequisites: []
bibliography: |-
  Lecture notes will be made freely available to students in the GitHub repository of the course (https://github.com/comp-data/2025-2026) before the beginning of the course. Slides and any additional material will be made also available a few days before each lecture in the same repository. No additional books or papers are needed for passing the final exam successfully.

  The following suggested readings could be helpful to students as background material, in order to practice basic terminologies of the course:

  - Peroni, S., Heibi, I., Massari, A. (2025). Think and Compute: a Primer for Digital Humanists. https://thinkcompute.github.io – created for this course.
  - Tagliaferri, L. (2018). How To Code in Python. ISBN: 978-0999773017. Full text available online (https://www.digitalocean.com/community/books/digitalocean-ebook-how-to-code-in-python).
  - Wing, J. M. (2008). Computational thinking and thinking about computing. Philosophical Transactions of the Royal Society A: Mathematical, Physical and Engineering Sciences, 366 (1881): 3717. DOI: https://doi.org/10.1098/rsta.2008.0118. Full text available online (https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2696102/).
  - Nardelli, E. (2019). Do we really need computational thinking? Communications of the ACM, 62 (2): 32-35. DOI: https://doi.org/10.1145/3231587
