outcomes:
- id: o1
  text: Al termine del modulo lo studente acquisisce le conoscenze di base dell'informatica applicata
    alla rappresentazione grafica digitale, le metodologie e gli strumenti pratici per l'utilizzo dei
    sistemi operativi digitali più diffusi nel campo dell'architettura.
- id: o2
  text: In particolare, lo studente è in grado di
  items:
  - id: o2.1
    text: gestire criticamente i formati grafici digitali, nelle caratterizzazioni raster e vettoriale;
  - id: o2.2
    text: acquisire le conoscenze di base sull'utilizzo di strumenti informatici CAD;
  - id: o2.3
    text: rappresentare un edificio, o sue parti e componenti, ed è in grado di gestire e elaborare disegni
      tecnici digitali e tavole architettoniche.
contents:
- id: c1
  text: The course is organized in order to afford the technical and theoretical tools for the right representation
    of the architectural project.
- id: c2
  text: This course is intended as an overall introduction to information technology and to computer use.
- id: c3
  text: The course will give to the student the methodology and the practical tools in order to work with
    the applications and with the most common operating systems.
- id: c4
  text: 'Classroom lessons and laboratory practices will focus on this topics:'
- id: c5
  text: 'Introduction to using computer for graphic applications: computer overall, CPU, Input/Output
    devices, random access memory (RAM), mass storage, graphics cards, Operating system.'
- id: c6
  text: 'Raster graphics: overall, pixel definition, color space, image and device resolution, lossy and
    non-lossy data compression, most common raster formats and their main feature, Adobe Photoshop.'
- id: c7
  text: 'Vector graphics and tecnical drawing: overall, functions and tools of a drawing application,
    graphic primitives, modify tools, layers, line styles and weight, screen frequency, print, design
    and development of a graphic layout, most common vector and vector/raster formats, Autodesk AutoCad.'
