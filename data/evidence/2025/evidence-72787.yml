outcomes:
- id: o1
  text: At the end of the course, the student has theoretical and practical tools fundamental for the
    development of native applications on the iOS and Android platforms, as well as an important introduction
    to the design and development of performing applications for smartphones.
- id: o2
  text: In particular, the student knows the architecture, and the graphical interfaces of smartphone
    applications.
