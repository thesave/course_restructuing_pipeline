outcomes:
- id: o1
  text: Knowledge related to the technologies needed for management and usage of computer networks and
    distributed systems.
contents:
- id: c1
  text: MODULE 1 - PRINCIPLES AND MODELS FOR DISTRIBUTED SYSTEMS
  heading: true
  items:
  - id: c1.1
    text: Introduction to Distributed Systems, architectures.
  - id: c1.2
    text: Processes, threads, virtualization, scalability.
  - id: c1.3
    text: DNS and HTTP protocols.
  - id: c1.4
    text: Communications, socket programming, APIs, remote procedure call.
  - id: c1.5
    text: Introduction to the Python programming language.
  - id: c1.6
    text: Practical lab exercises on the above topics.
- id: c2
  text: MODULE 2 - APPLICATIONS OF DISTRIBUTED SYSTEMS IN TELECOMMUNICATIONS
  heading: true
  items:
  - id: c2.1
    text: Cloud computing and service orchestration, OpenStack, Kubernetes.
  - id: c2.2
    text: Network Function Virtualization (NFV), Open RAN (O-RAN).
  - id: c2.3
    text: Software-Defined Networking (SDN), NETCONF.
  - id: c2.4
    text: Practical lab exercises on the above topics.
prerequisites: []
