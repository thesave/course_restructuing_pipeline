outcomes:
- id: o1
  text: The student will learn computer skills, with the ability to apply them to data processing and
    presentation in environmental sciences.
- id: o2
  text: In particular, the student will learn concepts about computer architecture, main computer tools,
    Internet and databases.
- id: o3
  text: The student will be learn also some rudiments of programming.
