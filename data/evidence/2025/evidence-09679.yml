outcomes:
- id: o1
  text: The student
  items:
  - id: o1.1
    text: has a in depth knowledge about managing, organizing and planning an Information System. these
      organizational and managerial competences are complemental to the technical ones in the database
      area;
  - id: o1.2
    text: knows the techniques for analyze and classify software modules in the information system contex;
  - id: o1.3
    text: carries out feasibility studies and Business Process Reengineering project;
  - id: o1.4
    text: carries out database integration and master data projects;
  - id: o1.5
    text: acquires practical skills on the previous topics through interactive business cases and seminars.
