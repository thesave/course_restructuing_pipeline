outcomes:
- id: o1
  text: At the end of the course, students will be able to
  items:
  - id: o1.1
    text: understand the fundamental components of a computing device (control unit, processing unit,
      peripherals, memory, etc.);
  - id: o1.2
    text: understand the fundamental elements of an operating system (in particular, how Windows is organised);
  - id: o1.3
    text: understand and know how to use the main application programmes, in particular word processing,
      spreadsheets and database processing;
  - id: o1.4
    text: know how to solve problems using certain available software;
  - id: o1.5
    text: understand the structure of and know how to use the World Wide Web.
