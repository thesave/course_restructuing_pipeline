outcomes:
- id: o1
  text: By the end of the course, the student his familiar with the design and analysis of correct and
    efficient algorithms and data structures.
- id: o2
  text: In particular, the student has basic knowledge of algorithms and data structures.
- id: o3
  text: The student is able to design correct and efficient algorithms for common computational tasks
    in biology and to analyse existing algorithms and data structures.
contents:
- id: c1
  text: 'Concepts of algorithm and computational complexity: definition of algorithm, recursive algorithms
    and iterative algorithms, asymptotic notation.'
- id: c2
  text: 'Exhaustive Search: restriction mapping, motif finding.'
- id: c3
  text: 'Greedy algorithms: sorting by reversals, approximate algorithms.'
- id: c4
  text: 'Dynamic programming: edit distance, Manhattan distance.'
- id: c5
  text: Divide and Conquer.
