outcomes:
- id: o1
  text: At the end of the course the student has acquired basic notions about web sites development via
    client side and server side technologies and on representation of documents via markup and style sheets.
contents:
- id: c1
  text: 'Fundamentals: HTTP, MIME, character encodings, markup.'
- id: c2
  text: 'Basic web Technologies: URI, HTML5, CSS3, JSON.'
- id: c3
  text: Server-side technologies for web applications, in particular PHP.
- id: c4
  text: Client-side technologies for web applications, in particular Javascript.
- id: c5
  text: HCI techniques, User eXperience (UX), Web accessibility and usability.
