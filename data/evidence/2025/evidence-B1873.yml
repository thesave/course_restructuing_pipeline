outcomes:
- id: o1
  text: At the end of the course, the studentis familiar with the theoreticalprinciplesunderpinning modernmachine
    learning.
- id: o2
  text: The student isfurtherable to understand, apply and evaluatethe main machinelearningtechniquesand
    implementationsrelevantto addressingpracticalproblems and tasksin thedomains ofCultural Heritageand
    GLAM.Lastly, the student is able to critically reflect on thepreconditions and implications of using
    machine learning in these domains.
contents:
- id: c1
  text: This course offers an introduction to Machine Learning (ML), with a focus on applications in the
    Arts and Humanities.
- id: c2
  text: The course will introduce foundational ML concepts and methods, and will be complemented by laboratory
    activities where methods will be implemented.
- id: c3
  text: After completing this course, the student can
  items:
  - id: c3.1
    text: Understand basic and advanced Machine Learning concepts and methods.
  - id: c3.2
    text: Find software libraries that can be used to develop ML applications.
  - id: c3.3
    text: Implement ML applications using Python.
  - id: c3.4
    text: Evaluate whether ML could be used in an Arts and Humanities task.
- id: c4
  text: Machine Learning (ML) is increasingly used in the context of Arts & Humanities research and GLAM
    applications (Galleries, Libraries, Archives, Museums).
- id: c5
  text: Examples range from text recognition and information extraction from historical sources to image
    search and analysis on artwork collections, from automatic 3D reconstructions of built heritage to
    the automatic detection of archeological sites from satellite or drone images.
- id: c6
  text: This course will lay the foundations for the students to explore and implement similar applications
    and more.
- id: c7
  text: The breakdown of the topics is as follows (per week)
  items:
  - id: c7.1
    text: 'Week 1: Introduction to Machine Learning, part 1. We discuss the course setup, the fundamentals
      of machine learning, the types of ML tasks, the key components of an ML workflow, some foundational
      mathematical concepts, and linear regression. We implement linear regression in numpy.'
  - id: c7.2
    text: 'Week 2: Introduction to Machine Learning, part 2. We discuss the worked-out examples of linear
      regression, linear classification, and the Multi-Layer Perceptron (MLP), and implement them in numpy.'
  - id: c7.3
    text: 'Week 3: PyTorch and Machine Vision. We introduce PyTorch, discuss tasks in machine vision and
      the main architectures to work with images (convolutional and residual networks). We implement an
      image-based task in PyTorch.'
  - id: c7.4
    text: 'Week 4: Language Processing. We introduce tasks in natural language processing and the Transformer,
      the main architecture to work with texts. We implement text-based tasks in PyTorch.'
  - id: c7.5
    text: 'Week 5: Generative AI. We discuss generative AI models, in particular focusing on Large Language
      Models (LLMs). We see how to use LLMs in practice and mention advanced applications such as Retrieval
      Augmented Generation (RAG). We implement a RAG-enabled chatbot using LlamaIndex and Chainlit.'
- id: c8
  text: Note that this list of topics might still change slightly.
