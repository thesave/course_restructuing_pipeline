outcomes:
- id: o1
  text: Acquisition of principles, methodologies and tools for designing algorithms that solve problems
    of a medium difficulty.
- id: o2
  text: Ability to apply such knowledge in the development of algorithms and computer programs, using
    a high-level programing language.
contents:
- id: c1
  text: 'Introduction to modern elaboration systems: brief history of informatics, introduction to the
    von Neumann architecture and to the modern hardware devices, information representation, basic concepts
    of operating systems.'
- id: c2
  text: Introduction to the concept of algorithm, Turing's specific and universal machines, problems solutions
    and (non) computable functions, high- and low-level programming languages, syntax definition by means
    of EBNF grammars.
- id: c3
  text: 'Introduction to the C language: values, types, constants, variables, operators and expressions,
    pointers, arrays and strings, structures.'
- id: c4
  text: 'Structural and procedural programming in C: control instructions, functions, procedures.'
- id: c5
  text: 'Input and output in C: I/O primitives, I/O based on the stream abstraction, access to files.'
- id: c6
  text: 'Principles and basic methodologies for designing and developing algorithms: solving small-scale
    problems, iteration and recursion, programs structured in many modules in the C language.'
- id: c7
  text: 'Runtime structure of C programs: runtime representation of programs, activation records and functions.'
- id: c8
  text: Dynamic allocation of memory for scalar types, structures and array; memory managing and memory
    leaking issues in C.
- id: c9
  text: 'Ordering algorithms: Naive Sort, Bubble Sort, Insert Sort, Merge Sort, and Quick Sort.'
- id: c10
  text: 'Introduction to Abstract Data Types (ADT): type definition and operations (constructors, selectors,
    predicates, functions and transformators). Some fundamentals ADT: lists, queues, stacks.'
prerequisites:
- id: p1
  text: 'Prerequisites: no prerequisites are required to attend this course. Indeed, the student is gradually
    introduced to the principles and methods of imperative programming, and in particular towards structured
    and procedural programming styles. The basic and fundamental notions required to understand the course
    contents are provided within the course itself, and no assumption is made about previous knowledge.
    Previous experience and knowledge about programming languages might be of some help.'
bibliography: |-
