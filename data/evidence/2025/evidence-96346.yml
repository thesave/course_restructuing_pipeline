outcomes:
- id: o1
  text: At the end of the course, the student possesses necessary knowledge of computer structure and
    appropriate familiarity with modern programming languages, particularly Python.
- id: o2
  text: Such knowledge is adequate and sufficient to address and solve simple scientific problems through
    the design and implementation of suitable algorithms and data structures.
- id: o3
  text: Laboratory activities introduce them to initial examples of applied methods and models.
contents:
- id: c1
  text: The course introduces the main concepts of computer science, problem-solving, and abstract machines.
- id: c2
  text: 'It then delves into programming in Python, with particular attention to:'
- id: c3
  text: The Python machine
- id: c4
  text: Names and their visibility
- id: c5
  text: Functions
- id: c6
  text: Modifiable and non-modifiable objects
- id: c7
  text: Basic data types (numbers, strings, lists, dictionaries, etc.)
- id: c8
  text: Abstract data types (binary trees)
- id: c9
  text: Furthermore, the course presents some classes of algorithms (e.g., sorting) with an overview of
    computational complexity.
- id: c10
  text: It discusses the limitations of effective procedures and the existence of problems that are unsolvable
    algorithmically.
- id: c11
  text: Laboratory activity is included, to support students in understanding and applying the concepts
    learned during the lessons.
