outcomes:
- id: o1
  text: At the end of the course the student understands the concept of information and knows the methods
    of digital representation and the systems of automatic data processing in the field of humanities;
    he/she possesses theoretical knowledge, methodological skills and techniques to represent and process
    humanistic data.
contents:
- id: c1
  text: The course aims to provide students with a basic understanding of computer programming and the
    tools for encoding, analyzing, and storing texts in digital format.
- id: c2
  text: Upon completion, students will have the skills necessary to design, develop, and test a small
    software system capable of manipulating text using a high-level, object-oriented programming language
    (i.e., Python).
- id: c3
  text: fundamental concepts of digital information processing (including integers and floating-point
    numbers, strings, assignments, variables, libraries, lists and files);
- id: c4
  text: basic programming constructs, such as sequential and selective execution, loops, user-defined
    functions and classes;
- id: c5
  text: fundamental principles and techniques of information processing (including conditional and iterative
    control, string manipulation, and creation and automated processing of text documents).
- id: c6
  text: Students who successfully complete this course will be able to design and implement small (but
    complete) interactive programs that use basic control structures; drawing also upon object-oriented
    programming concepts, they'll be able to produce, analyze, modify, and store texts and other resources
    in digital format.
