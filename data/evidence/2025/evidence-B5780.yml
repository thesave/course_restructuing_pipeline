outcomes:
- id: o1
  text: At the end of the course, the student has the knowledge for developing and using tools for sequence
    and structure analysis of biomolecules and more generally for annotation problems in the genomic era.
- id: o2
  text: In particular, the student will be able to independently write programs in Python language.
- id: o3
  text: He/she will be also able to discuss the theoretical basis of sequence alignment tools (dynamic
    programming and heuristic algorithms) and to implement them.
contents:
- id: c1
  text: The course is composed of 2 modules
  items:
  - id: c1.1
    text: 'Python programming, including: variables, expressions and statements, functions, conditionals,
      iteration, strings, lists, tuples, dictionaries, files, recursion and object-oriented programming.'
  - id: c1.2
    text: Brief introduction to linux (at the beginning of the course) and to dynamic programming and
      pairwise alignment algorithms (local, global and semiglobal) and their python implementation (at
      the end of the course).
