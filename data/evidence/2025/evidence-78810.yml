outcomes:
- id: o1
  text: At the end of the course, the student
  items:
  - id: o1.1
    text: is familiar with the fundamental concepts underlying modern operating system organization and
      functioning, with an emphasis on real-time systems for automation
  - id: o1.2
    text: is able to realize simple concurrent applications using system calls and synchronization mechanisms
  - id: o1.3
    text: is able to analyze, design and implement simple real-time concurrent applications
contents:
- id: c1
  text: The course is organized into modules.
- id: c2
  text: Python (20 hours), September/October. First part of "Module 1". Covers the basic of Python and
    object-oriented programming. Lectures and hands-on lab.
- id: c3
  text: 'Operating Systems (40 hours), October/December. Second part of "Module 1". Topics: Overview and
    system structures. Processes and threads. Scheduling. Process synchronisation and deadlocks. Memory
    and I/O. Lectures.'
- id: c4
  text: 'Operating Systems Lab (15 hours), October/November. First part of "Module 2". Topics: Linux shell,
    system call programming, POSIX, threads, synchronization. Hands-on lab.'
- id: c5
  text: 'Real-Time (30 hours), February/May. Corresponds to "Module 3". Topics: Basic concepts or real-time
    systems. Aperiodic task scheduling. Clock-based and priority-based scheduling of periodic tasks. Resource
    access protocols. Lectures.'
- id: c6
  text: 'Real-Time Lab (15 hours). Second part of "Module 2", March/May. Topics: real-time system programming
    using vxWorks and Workbench. How to build a metascheduler for hard real-time periodic tasks that share
    resources. Hands-on lab.'
