outcomes:
- id: o1
  text: The course aims at providing the basic concepts related to software engineering, and the tools
    and techniques for analysis and design of software systems.
- id: o2
  text: Particular relevance will be given to the methods enforcing correct use of object-oriented technologies.
contents:
- id: c1
  text: The lifecycle of software systems
  items:
  - id: c1.1
    text: phases and activities;
  - id: c1.2
    text: planning, requirement analysis, design.
- id: c2
  text: Object-oriented analysis and design
  items:
  - id: c2.1
    text: the object-oriented paradigm (abstraction, information hiding, inheritance, polymorphism, delegation);
  - id: c2.2
    text: designing object-oriented systems.
- id: c3
  text: The UML language
  items:
  - id: c3.1
    text: use case diagrams;
  - id: c3.2
    text: class and object diagrams;
  - id: c3.3
    text: sequence diagrams;
  - id: c3.4
    text: collaboration diagrams;
  - id: c3.5
    text: state diagrams;
  - id: c3.6
    text: activity diagrams;
  - id: c3.7
    text: component diagrams;
  - id: c3.8
    text: deployment diagrams.
- id: c4
  text: Basics of user interface design
- id: c5
  text: Software engineering
  items:
  - id: c5.1
    text: quality criteria;
  - id: c5.2
    text: evaluation;
  - id: c5.3
    text: prototyping;
  - id: c5.4
    text: production;
  - id: c5.5
    text: testing;
  - id: c5.6
    text: certification;
  - id: c5.7
    text: maintenance.
prerequisites:
- id: p1
  text: A prior knowledge and understanding of programming languages and algorithms, and of the object-oriented
    paradigm is required to attend with profit this course.
- id: p2
  text: These notions are normally achieved by giving an exam of Programming, Algorithms and Data Structures,
    and OO Programming.
- id: p3
  text: 'Fluent spoken and written Italian is a necessary pre-requisite: all lectures and tutorials, and
    all study material will be in Italian.'
