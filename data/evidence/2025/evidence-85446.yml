outcomes:
- id: o1
  text: This course aims to initiate to methods for interpretation of data and content as knowledge sources.
- id: o2
  text: 'At the end of the new course the students will be able to: master the basics of knowledge representation
    and reasoning, with application to the Semantic Web (ontologies, linked data, knowledge patterns);
    be familiar with the state-of-the-art in knowledge representation and extraction technologies; use
    applications to automatically extract knowledge from text; analyse the knowledge requirements of a
    customer, and produce a plan to implement them.'
contents:
- id: c1
  text: The students will master the basics of representation and extraction of knowledge, intended as
    data suitable to machine querying jointly with automated reasoning and generalised inferences.
- id: c2
  text: 'The course includes the following themes:'
- id: c3
  text: Knowledge Representation as computational logic methods (knowledge graphs, ontology design patterns,
    description logic, linked data frameworks)
- id: c4
  text: Knowledge Extraction as a hybridization of either rule-based heuristics (scraping, linguistic
    patterns, graph-based data analysis), or statistical methods (generative AI models) for extracting
    data from arbitrary content
- id: c5
  text: Representation and extraction will be presented both from a foundational (philosophical, cognitive)
    viewpoint, as well as optimal satisfaction of task-oriented requirements
- id: c6
  text: The Web and Generative AI models will be the computational platforms to learn, test, and apply
    the learnt methods, with examples from multiple domains, with a focus on social sciences and humanities.
- id: c7
  text: Multiple software components will be introduced during the course in order to make the students
    accustomed to semantic technologies
