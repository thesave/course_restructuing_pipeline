outcomes:
- id: o1
  text: The student – knows and is able to use the ICT resources, both traditional and electronic, required
    for the interpretation of oral speeches.
- id: o2
  text: S/he knows and is able to use the terminography tools necessary for the interpretation of oral
    speeches.
- id: o3
  text: S/he has the basic terminology skills required for the interpretation.
- id: o4
  text: S/he is able to autonomously build terminology databases necessary for the interpretation of oral
    speeches.
contents:
- id: c1
  text: The module is delivered in the second semester and is one of the two modules that make up the
    METODI, TECNOLOGIE E LINGUISTICA PER L'INTERPRETAZIONE course.
- id: c2
  text: The course focuses on various aspects of documentation and terminology research, which are closely
    linked to each other.
- id: c3
  text: The first part of the course focuses on the various documentation strategies, traditional on the
    one hand and supported by Artificial Intelligence (AI) on the other, useful for the preparation of
    conference interpreters.
- id: c4
  text: Following an overview of advanced techniques for web searching using search engines, special emphasis
    will be placed on the construction and use of electronic specialised corpora aimed at terminology
    extraction (with the help of BootCaT and also with the support of AI).
- id: c5
  text: Then the theoretical basis of terminology are presented together with the basic tools for the
    detection of terminology, namely AntConC.
- id: c6
  text: Also at this stage of the workflow, traditional extraction methods will be compared with AI-supported
    methods.
- id: c7
  text: Finally, some of the main terminographic tools for creating and managing glossaries and terminology
    databases will be presented (MultiTerm), with particular reference to software that also allows glossaries
    to be consulted in the interpretation booth during the conference (Interplex, InterpretBank).
