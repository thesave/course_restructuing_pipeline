outcomes:
- id: o1
  text: The course is about formal methods for the modelling, analysis and verification of distributed
    systems, by using Petri nets and other concurrency models.
- id: o2
  text: At the end of the course, the student is able to build models of concurrent and distributed systems,
    to analyze such models and to verify their properties.
contents:
- id: c1
  text: Introduction to concurrency and to the problem of the correctness of reactive systems design.
- id: c2
  text: Petri nets and labeled transition systems
- id: c3
  text: Linear nets. Language equivalence, trace equivalence, isomorphism equivalence. Bisimulation. Modal
    logic BML. Process algebra Lin. Representability theorem. Congruence and algebraic properties of bisimulation.
    Sound and complete axiomatization.
- id: c4
  text: Forking nets. Team bisimulation. Modal logic TML. Process algebra Fork. Representability theorem.
    Congruence and algebraic properties of team bisimuation. Sound and complete axiomatization.
- id: c5
  text: Petri nets. Place bisimulation. Structure-preserving bisimulation. Modal logics MKL and LKL. Process
    algebra Pet. Representability theorem. Congruence and algebraic properties. Axiomatization.
- id: c6
  text: 'Other equivalences for Petri nets: sequential, concurrent, causal.'
- id: c7
  text: 'Bisimulation on linear nets with silent transitions: weak and branching bisimulation.'
- id: c8
  text: 'The language CCS: syntax and SOS semantics. Turing completeness of finitary CCS; undecidability
    of behavioral equivalences of finitary CCS.'
- id: c9
  text: 'Distributed computability: Last man standing problem.'
