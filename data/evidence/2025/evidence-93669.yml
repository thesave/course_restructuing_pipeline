outcomes:
- id: o1
  text: At the end of the course, students get acquainted with the fundamental issues of intelligent systems,
    the most relevant computational models and technologies, and the most effective methods.
- id: o2
  text: In particular, students become familiar with the fittest solutions, languages, technologies, architectures,
    and methodologies to design intelligent systems, and are capable of
- id: o3
  text: devising the problems requiring artificial intelligence techniques for their solution;
- id: o4
  text: determining the most proper conceptual and methodological approaches;
- id: o5
  text: selecting and integrating the fittest technologies for implementing the solutions detected.
