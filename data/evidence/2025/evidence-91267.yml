outcomes:
- id: o1
  text: At the end of the course, the student understands the conceptual and technical foundation of multi-agent
    systems, and is able to model complex computational and socio-technical systems in terms of agent-oriented
    abstractions; build complex computational and socio-technical systems using agent-oriented technologies
    and methodologies; design and engineer intelligent systems as multi-agent systems, by integrating
    techniques and methods from artificial intelligence in an effective and methodologically-sound way.
