outcomes:
- id: o1
  text: 'During the course, the student will be introduced to the complex themes pertaining to the simulation
    of intelligent behavior by means of machines, with practical experimentation of basic machine learning
    techniques for different tasks: supervised, unsupervised, with reinforcement.'
- id: o2
  text: The course will also provide rudiments of image processing, since images will be extensively used
    as experimental test bench for the aforementioned learning techniques.
contents:
- id: c1
  text: 'The course is essentially structured in two parts: one dedicated to traditional Machine Learning
    techniques, and the other focused on an introduction to neural networks and deep learning.'
- id: c2
  text: In the first part, the goal is to highlight the typical approach of machine learning, centered
    on defining a parametric class of models, formulating a loss function to compare them, and optimizing
    the parameters to find the best model.
- id: c3
  text: Emphasis will be placed on the importance of the probabilistic approach and on the distinction
    between discriminative and generative models.
- id: c4
  text: Key concepts in the field will be introduced, such as entropy, likelihood, and the gradient descent
    technique.
- id: c5
  text: In the second part of the course, neural networks will be introduced, along with the notion of
    layers and the important case of convolutional networks.
- id: c6
  text: Some simple models will be described and their practical application will be shown on basic problems
    of image classification and transformation.
