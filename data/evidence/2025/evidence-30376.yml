outcomes:
- id: o1
  text: After the course, the student is skilled in business intelligence architectures and functionalities.
- id: o2
  text: In particular, the student is capable of designing and administrating enterprise data warehouses.
contents:
- id: c1
  text: Business intelligence
  items:
  - id: c1.1
    text: the role of BI in the corporate information system;
  - id: c1.2
    text: the BI pyramid.
- id: c2
  text: Data Warehousing
  items:
  - id: c2.1
    text: architectures;
  - id: c2.2
    text: 'techniques for data analysis: reporting and OLAP;'
  - id: c2.3
    text: lifecycle
    items:
    - id: c2.3.1
      text: data source analysis;
    - id: c2.3.2
      text: requirement analysis;
    - id: c2.3.3
      text: conceptual design;
    - id: c2.3.4
      text: workload and data volume;
    - id: c2.3.5
      text: logical design;
    - id: c2.3.6
      text: design of ETL procedures;
    - id: c2.3.7
      text: physical design.
prerequisites:
- id: p1
  text: A prior knowledge and understanding of database systems, relational model, and SQL language is
    required to attend with profit this course.
- id: p2
  text: These notions are normally achieved by giving an exam of Databases or Information Systems.
- id: p3
  text: 'Fluent spoken and written Italian is a necessary pre-requisite: all lectures and tutorials, and
    all study material will be in Italian.'
