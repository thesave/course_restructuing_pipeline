outcomes:
- id: o1
  text: At the end of the course the student is in possession of the basic knowledge of cutting-edge models
    and applications of artificial intelligence, with particular attention to machine learning.
- id: o2
  text: In particular, they are able to have a practical vision to select the appropriate methods to solve
    concrete problems
