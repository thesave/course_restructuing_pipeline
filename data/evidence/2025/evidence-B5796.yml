outcomes:
- id: o1
  text: Digital services have to meet various requirements in terms of performance, scalability and reliability.
- id: o2
  text: We analyze the whole lifecycle of high quality services, from design to deployment, testing and
    operation.
- id: o3
  text: In each phase, we aim to provide the students with the ability to gather and analyze data, to
    identify sources of outages and critical dependencies, and to avoid bottlenecks and single points
    of failure.
- id: o4
  text: Finally, we expect students to be prepared to evaluate and discuss alternatives and justify investment
    in support of business services.
