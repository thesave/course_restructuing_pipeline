outcomes:
- id: o1
  text: At the end of the course, the student understands the foundational ideas, recent advances and
    application potential of deep neural systems.
- id: o2
  text: The student understands supervised and unsupervised techniques, basic neural topologies, methods
    for visualizing and understanding the behavior on neural nets, adversarial and generative techniques,
    reinforcement learning, and recurrent networks.
- id: o3
  text: The student is able to apply such technologies to solving classification problems in realistic
    domains.
contents:
- id: c1
  text: 'The course begins with an introduction to Neural Networks and Deep Learning, focusing on their
    typical training mechanism: the backpropagation algorithm.'
- id: c2
  text: 'We will discuss the main types of neural networks: feedforward, convolutional, and recurrent,
    providing concrete examples and examining architectures that have proven useful for image processing,
    localization, segmentation, style transfer, text processing, and many other applications.'
- id: c3
  text: Techniques for visualizing the behavior of hidden neural units will be explored, including those
    related to deep dreams and inceptionism.
- id: c4
  text: We will also cover techniques for fooling neural networks and modern generative techniques, including
    recent diffusion models.
- id: c5
  text: The final part of the course will be dedicated to an introduction to Deep Reinforcement Learning,
    with particular attention to designing agents for video games, autonomous driving, and other situations
    that require complex and adaptive intelligent behaviors.
