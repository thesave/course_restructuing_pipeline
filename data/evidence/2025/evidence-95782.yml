outcomes:
- id: o1
  text: '"At the end of the course, the student knows the theoretical and practical concepts behind Network
    Analysis to be able to conduct a scientific inquiry over network data.'
- id: o2
  text: That entails knowing the mathematical theory of networks — social, biological, technological —
    and its applications for a quantitative evaluation of the network-driven phenomena.
- id: o3
  text: During the course, the student has the chance to study applications over different fields, like
    Literature, History, Forensics, Computer Science, and Biology.
- id: o4
  text: The course includes practical sessions where the student learns how to automatise network research
    through the usage of software tools for network analysis and visualisation."
contents:
- id: c1
  text: 'The programme is the same for both attending and non-attending students:'
- id: c2
  text: Introduction to Network Analysis, gentle introduction to the field of network analysis and its
    usages in other fields of research (e.g., computer science, forensics, archeology, literature, history,
    science of religion, etc.).
- id: c3
  text: 'Research Design and How to Read a (Network Analysis) Research Paper: introduction to the scientific
    publication process, elements of research papers (on network analysis), research design, analysis
    of research papers.'
- id: c4
  text: 'Mathematics of Networks: networks and their representation, types of networks, graph representations,
    paths and components, adjacency matrices and matrix representations, ways and modes, operations on
    Matrices.'
- id: c5
  text: 'Data Collection and Data Management: network questions, data collection and reliability, data
    formats and transformation, algorithms and software for network analysis and visualisation.'
- id: c6
  text: 'Measures and Metrics, Nodes: kinds of measures, multi-category nominal scales, ordinal and scalar
    measures, centrality, degree and other kinds of centrality (e.g.'
- id: c7
  text: Google's PageRank), hubs and authorities, closeness and betweenness centrality, groups of nodes
    (cliques, cores, components and k-components), clustering and clustering coefficients, reciprocity
    and similarity, structural and other types of equivalence, homophily and types of assortative mixing.
- id: c8
  text: 'Testing Hypotheses: the role of hypotheses in the scientific method, testing hypotheses in network
    analysis, permutation tests, dyadic hypotheses.'
- id: c9
  text: 'Measures and Metrics, Networks: small-world effects, degree distribution, power laws and scale-free
    networks, visualisation and properties of power-law distributions, local-clustering coefficient, cohesion,
    reciprocity, transitivity and the clustering coefficient, triad census, centralisation and core-periphery
    indices, centrality, random graphs, means on edges and degree, degree distribution, giant and small
    component(s), locally tree-like networks.'
- id: c10
  text: 'Network Visualisation: the importance of network visualisation, graph-layout algorithms, embedding
    node attributes, node filtering, visualising ego networks, embedding tie characteristics, tie strengths,
    visualising network change.'
- id: c11
  text: 'Handling Large Networks: reducing the size of the problem, eliminating edges, pruning nodes,
    divide and conquer, aggregation, sampling, small-world and scale-free networks.'
