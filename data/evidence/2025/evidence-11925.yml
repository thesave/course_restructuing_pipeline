outcomes:
- id: o1
  text: At the end of the course, the student knows the basic architecture of a computer, combinatorial
    and sequential networks, and the correspondence between assembly and high-level languages.
- id: o2
  text: The student is able to design simple combinational and sequential circuits and write assembly
    code.
contents:
- id: c1
  text: Organisation of computer systems.
- id: c2
  text: Binary representation of information.
- id: c3
  text: Boolean algebra, Logic Gates, Combinational circuits, Sequential circuits.
- id: c4
  text: Memory, CPU and Bus.
- id: c5
  text: The ISA level and assembly programming.
- id: c6
  text: Hints on operating systems.
- id: c7
  text: Mapping from high-level programming languages to lower architectural levels.
prerequisites: []
bibliography: |-
  No specific book is required. Updated teaching material is available through the Virtuale website.

  For further information we suggest: Andrew S. Tanenbaum - Todd Austin. Structured Computer Organization 6th edition. Pearson. 2013.

  The book is also recommended for students who are not attending the lessons.
