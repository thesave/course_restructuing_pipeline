outcomes:
- id: o1
  text: At the end of the course the student is introduced to the use of a high-level programming language
    and associated development environments.
- id: o2
  text: The student will develop analysis, specification, and design of algorithms capacities.
contents:
- id: c1
  text: Introduction to computer science
- id: c2
  text: Introduction to computers
- id: c3
  text: Introduction to networking
- id: c4
  text: Introduction to Operating Systems
- id: c5
  text: Algorithms and programming languages
- id: c6
  text: Construction of software components
- id: c7
  text: Methodologies for the design of problem solving on a small scale
- id: c8
  text: Data Types
- id: c9
  text: Input / Output
- id: c10
  text: Expressions and control statements
- id: c11
  text: Functions and Procedures
- id: c12
  text: Recursive function invocation (introductory references)
- id: c13
  text: Activation record model and run-time
- id: c14
  text: Arrays and strings
- id: c15
  text: Matrices
- id: c16
  text: Text files and binary files
- id: c17
  text: Dynamic memory allocation
- id: c18
  text: Unix commands and console (introductory references)
- id: c19
  text: C-language theoretical lessons will be completed by a strong lab part with numerous exercises
    and examples of hands-on programming in order to provide students with the ability to design and analyze
    simple algorithms (e.g., studying sorting algorithms and well-known numerical computation algorithms)
    giving at the same time intuitive notions about computational complexity.
