outcomes:
- id: o1
  text: At the end of the course students will have acquired methods and tools to design, implement and
    validate simulation models for the performance analysis and assessment of computer and communication
    systems and for the analysis of social systems.
- id: o2
  text: Students will be able to design, implement and validate simulation models for the analysis and
    assessment of complex systems.
contents:
- id: c1
  text: classification of systems and models;
- id: c2
  text: discrete event models
- id: c3
  text: 'analytical models: queueing systems and queueing networks;'
- id: c4
  text: design of simulation experiments;
- id: c5
  text: random number generation and random variate generation;
- id: c6
  text: discrete events simulazione techniques;
- id: c7
  text: agent based simulation;
- id: c8
  text: simulation and machine learning;
- id: c9
  text: digital twin;
- id: c10
  text: design and implementation of simulators and simulation tools;
- id: c11
  text: input and output data analysis of simulation models;
- id: c12
  text: verification, validation and testing of simulation models;
- id: c13
  text: introduction to parallel and distributed simulation;
- id: c14
  text: analysis and evaluation of complex systems.
- id: c15
  text: Introduction to Virtual Reality.
