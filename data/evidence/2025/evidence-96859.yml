outcomes:
- id: o1
  text: The course introduces the concepts, methods and techniques concerning design and programming of
    embedded software, i.e. software for embedded systems, focusing in particular on an Internet of Things
    (IoT) perspective.
- id: o2
  text: 'More in detail, upon completing this course a student will have:'
- id: o3
  text: a general background about embedded systems, including Cyber-Physical Systems and Internet-of-Things
    (IoT);
- id: o4
  text: basic knowledge about the hardware of embedded systems, from microcontrollers to SoC (System-on-a
    Chip), sensors, actuators, wired/wireless communication technologies and protocols;
- id: o5
  text: basic knowledge about real-time operating systems, their organisation and scheduling techniques
- id: o6
  text: solid knowledge about embedded software design and programming techniques, to deal with aspects
    related to real-time, reactivity, concurrency, and about main models adopted for that purpose (finite
    state machines - time triggered and event triggered, tasks and their scheduling);
- id: o7
  text: knowledge about design and programming embedded software systems for mobile and wearable computing;
- id: o8
  text: basic knowledge about main aspects and issues concerning Internet of Things and the organisation
    and architecture of IoT systems;
- id: o9
  text: the capability of developing embedded system & IoT projects, involving the design and programming
    of embedded software for microcontrollers or SoC based architectures, and their integration/communication
    with applications running on mobile devices and with services/backends on the server side.
contents:
- id: c1
  text: Introduction to Embedded Systems and Internet of Things (IoT)
  items:
  - id: c1.1
    text: '- basics about HW (microcontrollers, SoC, sensors, actuators and electronics)'
- id: c2
  text: Programming Models and Techniques for Embedded Systems
