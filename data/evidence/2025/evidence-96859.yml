    text: '- super-loop'
  - id: c2.2
    text: '- Finite State Machines (time-driven and event-driven)'
  - id: c2.3
    text: '- Task'
  - id: c2.4
    text: '- event-driven architectures'
  - id: c2.5
    text: '- architectures base on a Real-Time OS'
- id: c3
  text: Networks of Embedded Systems and IoT
  items:
  - id: c3.1
    text: '- models, architectures, communication protocols, wireless technologies for embedded systems'
  - id: c3.2
    text: '- message passing models'
  - id: c3.3
    text: '- Integration with mobile systems and mobile app programming'
  - id: c3.4
    text: '- Basics about IoT architectures and platforms'
- id: c4
  text: Advanced Themes (intro)
  items:
  - id: c4.1
    text: '- Web of Things (WoT)'
  - id: c4.2
    text: '- Digital Twins'
