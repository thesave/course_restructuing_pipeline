outcomes:
- id: o1
  text: At the end of the course the students know the basic principles of computer vision and image processing
    algorithms.
- id: o2
  text: Thereby, they are able to understand and apply a variety of algorithms and operators aimed at
    either extracting relevant semantic information from digital images or improving image quality.
- id: o3
  text: They also understand the diverse challenges and design choices characterizing the main applications
    and acquire familiarity with software tools widely adopted in these scenarios.
contents:
- id: c1
  text: Introduction – Basic definitions related to image processing and computer vision. An overview
    across major application domains.
- id: c2
  text: 'Image Formation and Acquisition – Geometry of image formation. Pinhole camera and perspective
    projection. Geometry of stereopsis. Using lenses. Field of view and depth of field. Projective coordinates
    and perspective projection matrix. Camera calibration: intrinsic and extrinsic parameters, lens distortion.
    Camera calibration based on planar targets and homography estimation (Zhang''s algorithm). Image rectification
    and stereo calibration. Basic notions on image sensing, sampling and quantization.'
- id: c3
  text: Image Filtering –Convolution and correlation. Mean and Gaussian filtering. Median Filtering. Bilateral
    filtering. Non-local means.
- id: c4
  text: Image Segmentation and Blob Analysis – Gray-level Histogram. Binarization by global thresholding.
    Automatic threshold estimation. Spatially adaptive binarization. Colour-based segmentation. Binary
    Morphology Operators. Connected components labeling and blob analysis.
- id: c5
  text: Local Features – Edge features and image gradient, Smooth derivatives (Sobel), Canny edge detector.
    Keypoint detectors and descriptors. Harris Corners. Scale invariant features. SIFT features. Efficient
    feature matching by kd-trees.
- id: c6
  text: 'Instance Detection – Pattern matching by SSD, SAD, NCC and ZNCC. Shape-based mathing. Hough Transform
    for analystic shapes, Generalized Hough Transform. Object detection by local invariant features: Hough-based
    voting, least-squares similarity estimation.'
- id: c7
  text: 'Deep Learning for Computer Vision – Review of machine learning basics. Image Classification.
    Linear Classifiers and Fully Connected Neural Networks. Convolutional Neural Networks (CNN). Successful
    CNN architectures for image classification: AlexNet, VGG, Inception, ResNet. Transfer Learning. CNN
    for Object Detection: R-CNN, Feature Pyramid Network (FPN), Faster R-CNN, YOLO.'
