outcomes:
- id: o1
  text: The course aims at providing basic computer architecture principles focusing on RISC (Reduced
    Instruction Set Computer) processors with a focus on the DLX CPU.
- id: o2
  text: The outcome of the course are methodologies to design systems based on modern microprocessors
    focusing on interfacing techniques for memory and input/output devices.
contents:
- id: c1
  text: Microprocessor evolution - Processor hierarchy and design methodologies - RISC architectures and
    comparison to CISC architectures - Memories and address decoding techniques - Sequential control units
    - Pieplined control units - I/O handling - Interrupts
