outcomes:
- id: o1
  text: At the end of the course, the student knows the basic concepts of digital information processing,
    with particular focus to the organization of the computer and networks, databases (especially geographic
    ones), digital graphics.
- id: o2
  text: 'The student is able to:'
- id: o3
  text: apply the basic concepts of traditional cartography in their application to numerical cartography;
- id: o4
  text: be able to manage simple numerical cartography applications and georeference raster and vector
    elements.
contents:
- id: c1
  text: The Informatics module consists of two parts. The first is an introduction to computer science,
    with particular emphasis on coding and information processing. The second involves a laboratory activity
    on data collection and analysis, and development of a server-side application.
- id: c2
  text: In the Numerical Cartography module, the fundamental concepts of cartography will be addressed
    with particular reference to numerical and computer aspects. The basic principles of cartography will
    be covered, such as cartographic projections, coordinate systems, and representation of geographical
    data. Moreover, part of the course will involve an introduction to digital cartography and GIS, with
    particular attention towards specific computer tools to import, create, manage and analyze geographical
    data.
