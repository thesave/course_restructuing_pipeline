outcomes:
- id: o1
  text: The course aims to provide basic knowledge about project management and software engineering applied
    to Digital Humanities (DH).
- id: o2
  text: Students will identify effective project management practices and their related processes.
- id: o3
  text: They will learn to apply the generally recognized practices to successfully manage DH projects.
- id: o4
  text: Through experimentation on real case studies, students will learn to design and manage a typical
    DH software process step by step.
- id: o5
  text: At the same time, the course introduces the concepts and methods required for the construction
    of systems applied to the Humanities.
- id: o6
  text: It aims to develop a basic understanding of the discipline of software engineering through the
    direct application of related design patterns and best practices adapted to the DH domain.
- id: o7
  text: 'Upon successful completion of this course, students will be able to: identify the key processes
    and requirements of both disciplines; initiate a software project; plan for time and cost; plan for
    project risks, and change control.'
contents:
- id: c1
  text: The course introduces basic theoretical and practical aspects of Project Management and Software
    Engineering for the Cultural Heritage domain.
- id: c2
  text: The course aims to provide DHDK students with an overview of the two disciplines to give them
    the indispensable tools to manage multidisciplinary DH projects.
- id: c3
  text: Theoretical and methodological approaches will be put into practice through case studies including
    those suggested by students.
- id: c4
  text: The course is organised in two parts
- id: c5
  text: 'Part 1: Software Project Management will focus on'
  heading: true
  items:
  - id: c5.1
    text: Project Management in software development;
  - id: c5.2
    text: Resource management and planning;
  - id: c5.3
    text: 'The software lifecycle: from requirements to delivery.'
- id: c6
  text: 'Part 2: Introduction to Software Engineering will introduce key concepts about'
  heading: true
  items:
  - id: c6.1
    text: Software design basic theory and practices;
  - id: c6.2
    text: Agile vs. structured software development processes;
  - id: c6.3
    text: Software validation and verification.
