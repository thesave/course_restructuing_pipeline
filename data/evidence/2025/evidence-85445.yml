outcomes:
- id: o1
  text: At the end of the course, the student knows the most important approaches to model information
    and data structures for permanent and robust storage and management.
- id: o2
  text: The student also knows the most recent technologies to create successful web resources (both information-oriented
    web sites and service-oriented web applications).
- id: o3
  text: The student is able to write documents ready to be published on the web, is able to design their
    visual aspects, is able to verify their correctness and universality, and is able to implement simple
    distributed applications on the web.
contents:
- id: c1
  text: The course discusses the following topics
  items:
  - id: c1.1
    text: 'From data to information: approaches to data structures and digital representation of data.'
  - id: c1.2
    text: 'Web fundamentals: VII level protocols, character encodings'
  - id: c1.3
    text: 'Basic web technologies: HTTP, URI, HTML, CSS, XML'
  - id: c1.4
    text: 'Client-side technologies for web applications: JavaScript, Ajax, JSON, JavaScript frameworks.'
prerequisites: []
bibliography: Due to the rapid evolution of the topics of the course, there is no textbook that covers
  the whole course. Students therefore use the slides of the course and are directed to online resources
  for the necessities of the course and the deepening of the topics discussed.
