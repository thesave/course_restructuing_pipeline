outcomes:
- id: o1
  text: At the end of the course, the student has an understanding of the theoretical foundations of linguistic
    and algorithmic techniques used in the context of AI.
contents:
- id: c1
  text: 'The course gives first of all some rudiments of computability and complexity theory: Turing machines,
    undecidability, polynomial time computability, and NP-completeness.'
- id: c2
  text: 'Towards the end of the course, we give a bird''s eye view on computational learning theory: PAC
    Learning, learning via uniform convergence, the VC-Dimension.'
