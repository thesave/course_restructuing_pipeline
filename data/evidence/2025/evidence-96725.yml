outcomes:
- id: o1
  text: The student has an in-depth knowledge of the strategies, techniques, methods and professional
    tools used for the localization of videogames, IT products and web contents; s/he is able to apply
    them in the adaptation of complex digital applications, which include different genres and text types,
    between English and Italian, in compliance with media accessibility requirements; s/he knows and is
    able to apply the fundamental techniques for information mining, editing and revision of texts, including
    an adequate assessment of the linguistic quality of the localized videogame, IT product or web content
    as a whole.
contents:
- id: c1
  text: The Software Localization module introduces the concept of localization in software, explaining
    its distinctive features and potential pitfalls in relation to other forms of translation, in the
    context of modern technological translation practice.
- id: c2
  text: Subsequently, a diversified set of contents that require translation within software applications
    (dialogues, interfaces, tutorials, etc.) will be presented, providing specific guidance on how these
    must be approached.
- id: c3
  text: To this end, issues such as variable/placeholder handling, size/visual restrictions, bug identification
    and prevention, as well as other conventions specific to software localization (which are often absent
    in other types of translatable material) will be reviewed.
