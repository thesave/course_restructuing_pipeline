outcomes:
- id: o1
  text: At the end of the course, the student knows methodological and technological aspects, and application
    development tools for mobile devices both under iOS (iPhone, iPad, iPod Touch) and Android platforms.
- id: o2
  text: Students will understand the management of devices with innovative user interfaces, multi-touch,
    event management, ObjectiveC programming, Xcode and Cocoa Touch, Eclipse and Android SDK, design patterns,
    I/O, sensors and geo-localization/maps APIs, networking services, debugging and testing of applications.
- id: o3
  text: In addition, students will understand the basic issues of applications' execution in wireless
    mobile scenarios, and will experience the most relevant platforms for mobile applications' development,
    APIs of internal devices, multimedia management, iPhone and Android SDK and design of applications
    under a Model-View-Control pattern.
