  laboratory:
    value: true
    evidence:
    - In particular, after presenting the basic notions and development tools (iOS Xcode and Android SDK),
      the course is divided into two parallel but asymmetrical tracks of lectures and laboratory sessions
      focused on mobile application development in the Android and iOS environments.
    - This approach fosters understanding of the principles and their practical implementation, enabling
      students to independently develop their own prototype applications outside the classroom (using
      personal development tools or the course’s teaching laboratory facilities).
