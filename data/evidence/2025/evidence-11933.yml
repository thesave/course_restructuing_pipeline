outcomes:
- id: o1
  text: Al termine del corso, lo studente conosce i principi della calcolabilità e le teorie alla base
    dell'informatica. È in grado di verificare l'esistenza o l'inesistenza di programmi che calcolano
    una determinata funzione.
contents:
- id: c1
  text: Problems and algorithms
- id: c2
  text: Computability vs Complexity
- id: c3
  text: Turing machines
- id: c4
  text: Recursive and recursively enumerable problems
- id: c5
  text: Complexity classes
- id: c6
  text: The classes P and NP
- id: c7
  text: NP-complete problems, and the P vs. NP question
- id: c8
  text: A quick look at space complexity classes
- id: c9
  text: A quick look at oracle classes, class hierarchies, and functional classes
prerequisites:
- id: p1
  text: Students are assumed to have a solid background in algorithmic reasoning, to have acquired the
    notion of subroutine call, and to be somewhat familiar with basic data structures such as lists, trees,
    and graphs.
- id: p2
  text: Previous knowledge of the notion of finite state automaton is helpful but not necessary.
bibliography: |-
  Textbook:

