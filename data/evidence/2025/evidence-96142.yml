outcomes:
- id: o1
  text: Investigate the topics of data-driven decision making and introduce the architectures of classical
    business intelligence, with specific reference to data warehousing systems and to the methods for
    designing them.
- id: o2
  text: Discuss the theme of enterprise data strategy in a broader way, focusing on the methods, architectures,
    and technologies for big data.
