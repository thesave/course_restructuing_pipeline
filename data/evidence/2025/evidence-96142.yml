prerequisites:
- id: p1
  text: A prior knowledge and understanding of database systems and relational model is required to attend
    with profit this course.
- id: p2
  text: These notions are normally achieved by giving an exam of Databases or Information Systems.
- id: p3
  text: 'Fluent spoken and written Italian is a necessary pre-requisite: all lectures and tutorials, and
    all study material will be in Italian.'
