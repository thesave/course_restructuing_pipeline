outcomes:
- id: o1
  text: At the end of the module, the student will have the knowledge and the ability to understand the
    concepts and possible applications of basic statistics in the biomedical and clinical fields, ranging
    from anthropometry to biometrics, as well as to the planning, organization, and management of healthcare
    services.
contents:
- id: c1
  text: Overview of experimental and observational study designs;
- id: c2
  text: Introduction to statistics;
- id: c3
  text: Univariate and bivariate descriptive statistics;
- id: c4
  text: Inferential statistics and probability;
- id: c5
  text: Frequency tables and graphical representations;
- id: c6
  text: 'Summary measures of a distribution: mean, median, mode;'
- id: c7
  text: Variability measures, confidence intervals, precision/bias;
- id: c8
  text: Main statistical tests and their practical applications;
- id: c9
  text: Use of Excel for data processing.
