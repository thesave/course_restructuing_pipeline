outcomes:
- id: o1
  text: Students know and are able to employ as independent users the main techniques and software that
    lie at the foundation of real-time transformation of spoken texts.
contents:
- id: c1
  text: This course appears in both the InConf and InTeCo curricula, but under different names.
- id: c2
  text: In particular, for InConf the course name is METODI E TECNOLOGIE AVANZATE PER L'INTERPRETAZIONE,
    while for InTeCo the name is TECHNOLOGY-ASSISTED INTERPRETING I.
- id: c3
  text: For the InConf curriculum
- id: c4
  text: The course is delivered in the first semester and focuses on the looking up of glossaries in the
    interpretation booth and on the development of expertise in the area of voice recognition software
    for the production of real-time subtitles (also known as speech-to-text interpreting - STTI).
- id: c5
  text: The first part of the course focuses on the use of speech recognition software for the production
    of intralingual live subtitles will be introduced.
- id: c6
  text: After a theoretical introduction to the production of written text from public speeches, some
    of the the speech recognition tools available today will be presented.
- id: c7
  text: Among these, the focus will be on DIT.tafono (free speaker-independent software) and Dragon Naturally
    Speaking (commercial speaker-dependent software).
- id: c8
  text: This will be followed by practical exercises in the production of written texts from voice input
    using both written and audio (visual) material.
- id: c9
  text: Afterwards, the techniques for real-time production of subtitles for audio-visual products will
    be presented (especially for deaf people).
- id: c10
  text: Then, in the second part, the use of tools useful to looking up terminological resources in the
    interpretation booth (CAI tools) will be presented, focusing in particular on InterpretBank.
- id: c11
  text: For the InTeCo curriculum
- id: c12
  text: This course includes a platform-based part and a face-to-face part, which borrows the hours from
    InConf's METODI E TECNOLOGIE AVANZATE PER L'INTERPRETAZIONE course.
- id: c13
  text: In the face-to-face part, the use of speech recognition software for the production of intralingual
    live subtitles will be introduced.
