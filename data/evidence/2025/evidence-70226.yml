outcomes:
- id: o1
  text: At the end of the course the student should be able to understand the more common technologies
    used to design network applications and the most common application and transport protocols.
contents:
- id: c1
  text: The course will present the basic principles of design and implementation of network applications.
- id: c2
  text: The theoretical concepts presented will be applied in laboratory projects aimed at understanding
    the implementation of network application in today Internet.
- id: c3
  text: 'Internet and computer networks: Internet, protocols, client-server architecture, protocol layers
    and service models.'
- id: c4
  text: Channel reliability. Error correction versus error detection. The most common error detection
    codes. ARQ protocols.
- id: c5
  text: 'Protocol analysis: sniffing, collection of traffic traces, analysis and debug, use of the Wireshark
    protocol analyzer.'
- id: c6
  text: 'Application layer: architectures, application level protocols (Web and HTTP, FTP, SMTP, POP3,
    IMAP, DNS), P2P architectures (BitTorrent), socket programming.'
- id: c7
  text: 'Transport layer: services, multiplexing and demultiplexing, connectionless service, UDP protocol,
    reliable data transfer, connection-oriented communication, TCP protocol, congestion control.'
- id: c8
  text: 'Basics of cybersecurity: authentication, authorization, digital signatures and certificates.'
prerequisites: []
