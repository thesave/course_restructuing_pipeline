outcomes:
- id: o1
  text: At the end of the course students will have got knowlegde of all main e-government authentication
    systems.
- id: o2
  text: Moreover they will be able to use online services provided by Italian government bodies such as
    INPS, INAIL, Italian Revenue Agency, Local Chambers of Commerce.
- id: o3
  text: Lastly they will easily consult documentary databanks.
