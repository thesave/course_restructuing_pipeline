outcomes:
- id: o1
  text: At the end of the course students master the design, creation and interpretation of corporate
    Business Intelligence (BI) and Business Analytics (BA) reports.
- id: o2
  text: They will understand the different design choices and technologies and the different options on
    how to implement BI and BA reports.
- id: o3
  text: The course will also discuss Descriptive, Prescriptive and Predictive Analytics and show how to
    include in a BI report Analytics calculations using R.
- id: o4
  text: This course is integrated with Management Control System Lab as it completes the integrated course
    Analytics for Management (I.C.) with the competences needed to collect, clean and analyze the data
    coming from different parts of the organization in order to support an analytical approach to management.
