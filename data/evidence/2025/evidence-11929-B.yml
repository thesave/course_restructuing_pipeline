outcomes:
- id: o1
  text: At the end of the course, the student knows the basic data structures and the notable algorithms
    from the literature operating on them.
- id: o2
  text: The student is familiar with the main techniques for estimating the computational cost of algorithms
    and is able to design and implement efficient solutions to solve common problems in the field of information
    technology disciplines.
contents:
- id: c1
  text: 'The course consists of two modules: one primarily introducing algorithms and data structures,
    and the second introducing the Python language.'
- id: c2
  text: The algorithms and data structures of interest will be presented using an abstract language (pseudocode)
    independent of syntactical details, and during the exercises, they will then be translated mainly
    using the C language.
- id: c3
  text: Python will offer another perspective, useful both in this course and especially in subsequent
    courses.
- id: c4
  text: The topics covered during the course include
  items:
  - id: c4.1
    text: Concepts of algorithms and efficiency/complexity
  - id: c4.2
    text: Analysis and asymptotic notation of complexity (Big O)
  - id: c4.3
    text: Recursive algorithms and the divide-and-conquer methodology
  - id: c4.4
    text: Search algorithms
  - id: c4.5
    text: Sorting algorithms
  - id: c4.6
    text: 'Elementary data structures: stacks, queues, lists'
  - id: c4.7
    text: Hash tables
  - id: c4.8
    text: Graphs and graph traversal algorithms
  - id: c4.9
    text: Binary search trees
