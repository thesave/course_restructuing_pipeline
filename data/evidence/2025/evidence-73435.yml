outcomes:
- id: o1
  text: At the end of the course students
  items:
  - id: o1.1
    text: know the basic principles of Project Management and can manage different approaches used in
      software production, from the most traditional ones to the iterative and adaptive approaches typical
      of the “agile” project management;
  - id: o1.2
    text: know some tools used in project management and have gained a better understanding of some practical
      aspects also through practical exercises;
  - id: o1.3
    text: can participate in or manage a software development project.
contents:
- id: c1
  text: Introduction to project management.
- id: c2
  text: Definition of project, program, portfolio.
- id: c3
  text: Definition of scope, quality, resources and their interrelationship.
- id: c4
  text: Definition of project management.
- id: c5
  text: Definition of processes and knowledge areas involved in project management according to the Project
    Management Body of Knowledge (PMBOK).
- id: c6
  text: Management of integration, scope, time, cost, quality, human resources, communications, risk,
    procurement, and stakeholders.
- id: c7
  text: 'The life cycle of a project and its management: traditional, incremental, iterative, and adaptive.'
- id: c8
  text: Scoping process group.
- id: c9
  text: Planning process group.
- id: c10
  text: Launching/executing process group.
- id: c11
  text: Monitoring and controlling process group
- id: c12
  text: Closing process group.
- id: c13
  text: Exercises.
- id: c14
  text: Seminars.
