bibliography: |-
  1. Introduction to software engineering

  - Books:

    - Software Engineering: A Practitioner’s Approach by Roger S. Pressman
    - Software Engineering by Ian Sommerville
    - The Mythical Man-Month: Essays on Software Engineering by Frederick P. Brooks Jr.
  - Essays/Articles:

    - “No Silver Bullet—Essence and Accident in Software Engineering” [https://www.cs.unc.edu/techreports/86-020.pdf]] by Fred Brooks (seminal paper)

  1. Background notions for software development (Python)

  - Books:

    - The Pragmatic Programmer: Your Journey to Mastery by Andrew Hunt & David Thomas (includes software design and development principles)
    - Clean Code: A Handbook of Agile Software Craftsmanship by Robert C. Martin
  - Articles & Documentation:

    - “The Twelve-Factor App” [https://12factor.net/] – methodology on best practices for modern software
    - Python official documentation [https://docs.python.org/3/] (reference sections on environment management, packages, modules, etc.)

  1. Decentralized version control (Git)

  - Books:

    - Pro Git by Scott Chacon & Ben Straub (freely available online here [https://git-scm.com/book/en/v2] )
    - Version Control with Git by Jon Loeliger
  - Online Resources:

    - GitHub Guides [https://guides.github.com/]

  1. Object-oriented programming (Python)

  - Books:

    - Python Object-Oriented Programming by Steven F. Lott & Dusty Phillips
    - Design Patterns: Elements of Reusable Object-Oriented Software by Erich Gamma et al. (Gang of Four, classic patterns)
    - Effective Python: 90 Specific Ways to Write Better Python by Brett Slatkin
    - Clean Architecture: A Craftsman’s Guide to Software Structure and Design by Robert C. Martin
  - Essays:

    - “SOLID Principles” [http://principles-wiki.net/collections:robert_c._martin_s_principle_collection] by Robert C. Martin (aka Uncle Bob, various summaries available online)
    - “SOLID Principles: Improve Object-Oriented Design in Python” [https://realpython.com/solid-principles-python/] by Leodanis Pozo Ramos

  1. Software Modelling with UML

  - Books:

    - UML Distilled: A Brief Guide to the Standard Object Modeling Language by Martin Fowler
    - Applying UML and Patterns by Craig Larman
  - Online Resources:

    - PlantUML documentation [https://plantuml.com/]
    - UML Reference [https://www.uml.org/] (OMG standard)

  1. Quality-assurance (QA), automated testing, TDD

  - Books:

    - Test-Driven Development: By Example by Kent Beck
    - The Art of Software Testing by Glenford J. Myers, Corey Sandler, and Tom Badgett
    - xUnit Test Patterns: Refactoring Test Code by Gerard Meszaros
  - Articles:

    - “What is Unit Testing?” [https://martinfowler.com/bliki/UnitTest.html] by Martin Fowler
    - “Continuous Delivery” [https://martinfowler.com/bliki/ContinuousDelivery.html] article by Martin Fowler

  1. Build automation, packaging, and release

  - Books:

    - Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation by Jez Humble & David Farley
  - Articles/Documentation:

    - Poetry documentation [https://python-poetry.org/docs/]

  1. Versioning, Conventional Commit

  - Specifications & Articles:

    - Semantic Versioning [https://semver.org/] (SemVer)
    - Conventional Commits [https://www.conventionalcommits.org/] Specification

  1. Overview on Distributed Systems Engineering

  - Books:

    - Designing Data-Intensive Applications by Martin Kleppmann (highly recommended)
    - Distributed Systems: Principles and Paradigms by Andrew Tanenbaum and Maarten van Steen (freely available online [https://www.distributed-systems.net/] )
  - Essays/Articles:

    - “Fallacies of Distributed Computing” [https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing] by Peter Deutsch and James Gosling (classic brief essay)
    - “CAP Theorem” [https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/] by Eric Brewer

  1. WebServices and RESTful APIs

  - Books:

    - RESTful Web APIs by Leonard Richardson, Mike Amundsen, and Sam Ruby
  - Articles:

    - “Architectural Styles and the Design of Network-based Software Architectures” [https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm] (REST dissertation) by Roy Fielding (seminal)

  1. Domain Driven Design (DDD)

  - Books:

    - Domain-Driven Design: Tackling Complexity in the Heart of Software by Eric Evans (the original, foundational text)
    - Implementing Domain-Driven Design by Vaughn Vernon
  - Essays/Articles:

    - “Domain Driven Design Reference” [https://martinfowler.com/tags/domain%20driven%20design.html] by Martin Fowler (collection of short articles)
    - “Ubiquitous Language” [https://martinfowler.com/bliki/UbiquitousLanguage.html] by Martin Fowler

  1. Continuous Integration

  - Books:

    - Continuous Integration: Improving Software Quality and Reducing Risk by Paul M. Duvall, Steve Matyas, Andrew Glover
    - Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation by Jez Humble & David Farley
  - Online Documentation:

    - GitHub Actions official documentation [https://docs.github.com/en/actions]

  1. Software Licensing

  - Books & Essays:

    - Understanding Open Source and Free Software Licensing by Andrew M. St. Laurent
    - “The Cathedral and the Bazaar” [http://www.catb.org/esr/writings/cathedral-bazaar/] by Eric S. Raymond (classic essay on OSS culture, partially covers licenses)
  - Online Resources:

    - Open Source Initiative: Licenses and Standards [https://opensource.org/licenses]
    - Choose a License [https://choosealicense.com/]

  Additional useful general software engineering resources:

  - Websites & Blogs:

    - Martin Fowler’s blog [https://martinfowler.com/] : insights on software design, architecture, and development practices
    - Joel on Software [https://www.joelonsoftware.com/] : insights on software development and management
    - ThoughtWorks Technology Radar [https://www.thoughtworks.com/radar] : a report on emerging technologies and practices in software development
    - The Missing Semester of Your CS Education [https://missing.csail.mit.edu/] : MIT notes on practical software engineering skills
