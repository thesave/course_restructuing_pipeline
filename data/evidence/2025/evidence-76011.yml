outcomes:
- id: o1
  text: The training objective of the course is the knowledge of information technologies applied to archaeological
    research in the various application areas that characterize the complex process process that brings
    the information connected with the archaeological data from the techniques of prospecting, excavation,
    cataloging, restoration and relative museumization.
- id: o2
  text: The extensive use of digital information representation technologies in the different passages
    means that computer science applied to archeology today constitutes a systemic process of networking
    integration of numerous multimedia representation technologies based on object - oriented multiplatform
    - web languages based, mostly organized in centralized structures (servers) and in the form of metadata
    (XML, JavaScript, KML etc.).
- id: o3
  text: 'At the end of the course the student:'
- id: o4
  text: is able to manage this complex process and technological process - is in possession of the theoretical
    and practical bases of the digital representation of archaeological data in various formats, - is
    in possession of the theoretical and practical bases relating to the techniques and the protocols
    of transformation, representation, transmission and communication of archaeological data - is in possession
    of the knowledge, the correct strategies and the practical skills that allow him to participate consciously
    in the project and in the realization of a server-web information system for archiving and multimedia
    representation of the archaeological data.
contents:
- id: c1
  text: T
- id: c2
  text: The course is structured in three parts, aiming to provide students with a comprehensive understanding
    of how multimedia technologies are applied in archaeological research and heritage enhancement.
- id: c3
  text: Part I – Introduction and Context
  heading: true
  items:
  - id: c3.1
    text: The course begins with an overview and critical reflection on the role and development of multimedia
      technologies in the field of Cultural Heritage, with a specific focus on archaeology.
  - id: c3.2
    text: A logical-operational framework will be introduced, outlining the key phases required to survey,
      document, analyze, and virtually reconstruct an archaeological context.
- id: c4
  text: Part II – Documentation and Survey Techniques
  heading: true
  items:
  - id: c4.1
    text: The second part is dedicated to the modern documentation methods used in archaeological surveying,
      focusing on instruments and techniques such as total stations, laser scanners, GNSS receivers, and
      digital photogrammetry.
  - id: c4.2
    text: The main challenges involved in documenting archaeological sites—particularly in relation to
      site extent and preservation conditions—will be examined.
  - id: c4.3
    text: The course will then introduce workflows for processing 3D models derived from point clouds,
      acquired through both laser scanning and image-based photogrammetry.
- id: c5
  text: Part III – Virtual Reconstruction and 3D Computer Graphics
  heading: true
  items:
  - id: c5.1
    text: In the final part of the course, selected case studies will be used to explore the application
      of 3D computer graphics in archaeological research.
  - id: c5.2
    text: These technologies have, in recent years, significantly transformed how we engage with and interpret
      the past.
  - id: c5.3
    text: Virtual reconstructions, when conducted with scientific rigor, cannot be based on imaginative
      assumptions.
  - id: c5.4
    text: The course will therefore focus on the step-by-step methodology required to produce reliable
      reconstructions.
  - id: c5.5
    text: This includes collecting and analyzing information about the object or context, generating graphic
      representations (e.g., 2D vector drawings), developing a 3D reconstructed model, and planning the
      most effective way to present the final product to the public.
  - id: c5.6
    text: Within this workflow, digital surveying plays a crucial role as the foundation for ensuring
      the accuracy and reliability of all subsequent reconstruction processes.
