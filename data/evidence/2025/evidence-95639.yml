outcomes:
- id: o1
  text: The general objective of this course is to provide the general conceptual and technological framework
    that characterise Industry 4.0, focusing in particular on Internet of Things (IoT), Industrial IoT
    and Computer Vision and their application in digital transformation contexts.
- id: o2
  text: At the end of the course, a student
  items:
  - id: o2.1
    text: has a global understanding about the big picture related to Industry 4.0
  - id: o2.2
    text: knows the main principles, technologies and standards about Internet of Things (IoT) and Industrial
      IoT, integrated with contents delivered by other courses (e.g. service oriented architectures, API,
      web, cloud)
  - id: o2.3
    text: knows some main state-of-the art directions in this context. Examples are Web of Things, Digital
      Twins
  - id: o2.4
    text: knows the main application domains and concrete case studies concerning the application of IoT
      and Industrial IoT
  - id: o2.5
    text: knows the main topics in the field of computer vision (e.g. object detection and classification)
      and their applications
  - id: o2.6
    text: knows state-of-the art approaches and technologies in the context of computer vision, with reference
      to both classic techniques for image representation and deep learning based solutions
  - id: o2.7
    text: is able to analyse and evaluate the application of the models and technologies, as well as to
      build projects and prototype technologies, given a Digital Transformation context/problem
contents:
- id: c1
  text: This course covers the fundamental concepts, technologies, drivers, trends, and implications of
    Industry 4.0 and industrial Digital Transformation.
- id: c2
  text: It addresses foundational IoT technologies (sensing, processing, communication), scalable industrial
    architectures and standards, AI and data-driven approaches, and advanced paradigms such as Digital
    Twins, Web of Things, and Industry 5.0.
- id: c3
  text: Beyond technical aspects, the course discusses the business, organizational, and societal implications
    of technology-driven transformation, supported by laboratories and a real-world industrial case study.
- id: c4
  text: Overarching Learning Goal
  items:
  - id: c4.1
    text: Students understand the history, cross-disciplinary drivers, technological foundations, and
      current state of Industry 4.0 and industrial Digital Transformation, and can recognize patterns,
      evaluate technology-driven business models, and reason about future trends.
- id: c5
  text: Overarching Competency Goal
  items:
  - id: c5.1
    text: Students are capable of ideating, designing, implementing, and presenting IoT-based solutions
      and prototypes in the context of Digital Transformation, Industry 4.0, and Industrial IoT.
- id: c6
  text: Specific Learning Goals (Knowledge)
  items:
  - id: c6.1
    text: Understand resource-constrainedness in Industry 4.0 systems and recognize suitable methods for
      sensing, identification, processing, and communication in constrained environments.
  - id: c6.2
    text: Know the technological landscape of Industrial IoT, including embedded systems, connectivity
      protocols, data management, AI techniques, and interoperability standards.
  - id: c6.3
    text: Understand reference architectures, Digital Twin concepts, Web of Things principles, and emerging
      Industry 5.0 and human-centered paradigms.
- id: c7
  text: Specific Competency Goals (Skills)
  items:
  - id: c7.1
    text: Design and implement functional end-to-end IoT prototypes integrating sensing, communication,
      data processing, and cloud/edge components.
  - id: c7.2
    text: Evaluate architectural and technological trade-offs (e.g., edge vs. cloud, protocols, standards)
      in industrial IoT scenarios.
  - id: c7.3
    text: Take informed decisions in Digital Transformation projects by relating technological choices
      to business needs and constraints, and effectively communicate and justify these decisions.
