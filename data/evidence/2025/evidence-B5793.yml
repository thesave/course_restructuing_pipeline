outcomes:
- id: o1
  text: In a digital world, every activity is vulnerable to cyber attacks.
- id: o2
  text: At the end of the course the students are able to know and evaluate the most dangerous cyber threats
    to the society and to specific organizations and industries.
- id: o3
  text: Moreover, they are expected to be able to design and build secure systems by adopting modern defensive
    strategies and technologies that are discussed in class and experimented in lab.
